// Firebase SDK를 스크립트 태그로 동적 로드
let db = null;
let fbResolve = null;
const fbReady = new Promise(r=>{ fbResolve=r; });

function loadFirebase() {
  if(window._fbLoaded) { fbResolve(window._db); return; }
  const scripts = [
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js",
    "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js",
  ];
  let loaded = 0;
  scripts.forEach(src=>{
    const s=document.createElement("script"); s.src=src; s.async=false;
    s.onload=()=>{ loaded++; if(loaded===scripts.length) initFB(); };
    document.head.appendChild(s);
  });
}

function initFB() {
  if(!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
  db = window.firebase.firestore();
  db.enablePersistence().catch(()=>{});
  window._db=db; window._fbLoaded=true;
  fbResolve(db);
}

loadFirebase();

// Firestore 헬퍼 (async)
const FB = {
  watchMatches: (cb) => {
    let unsub = ()=>{};
    fbReady.then(d=>{
      unsub = d.doc("kickoff/matches").onSnapshot(snap=>{
        if(snap.exists) cb(snap.data().list||[]);
      });
    });
    return ()=>unsub();
  },
  saveMatches: (list) => fbReady.then(d=>
    d.doc("kickoff/matches").set({list, updatedAt:window.firebase.firestore.FieldValue.serverTimestamp()})
  ),
  watchNotices: (cb) => {
    let unsub = ()=>{};
    fbReady.then(d=>{
      unsub = d.doc("kickoff/notices").onSnapshot(snap=>{
        if(snap.exists) cb(snap.data().list||[]);
      });
    });
    return ()=>unsub();
  },
  saveNotices: (list) => fbReady.then(d=>
    d.doc("kickoff/notices").set({list, updatedAt:window.firebase.firestore.FieldValue.serverTimestamp()})
  ),
  watchComments: (storageKey, cb) => {
    let unsub = ()=>{};
    fbReady.then(d=>{
      unsub = d.collection("kickoff_comments")
        .where("storageKey","==",storageKey)
        .onSnapshot(snap=>{
          const items = snap.docs.map(doc=>({fbId:doc.id,...doc.data()}));
          // 클라이언트에서 시간순 정렬 (displayTime 기준)
          items.sort((a,b)=>(a.displayTime||"").localeCompare(b.displayTime||""));
          cb(items);
        });
    });
    return ()=>unsub();
  },
  addComment: (comment) => fbReady.then(d=>
    d.collection("kickoff_comments").add({
      ...comment,
      createdAt: window.firebase.firestore.FieldValue.serverTimestamp()
    })
  ),
  deleteComment: (fbId) => fbReady.then(d=>
    d.collection("kickoff_comments").doc(fbId).delete()
  ),
};

// 이미지 업로드 (base64 Data URL 방식 — CORS 문제 없음, 서버 불필요)
const uploadImage = async (file) => {
  if(!file) return null;
  if(file.size > 5*1024*1024) throw new Error("파일 크기는 5MB 이하여야 합니다");
  const allowedTypes = ["image/jpeg","image/png","image/gif","image/webp"];
  if(!allowedTypes.includes(file.type)) throw new Error("JPG, PNG, GIF, WEBP 파일만 가능합니다");
  // 이미지 리사이즈 후 base64 변환 (용량 최소화)
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX = 800;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX) {
          if(w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = () => reject(new Error("이미지 로드 실패"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("파일 읽기 실패"));
    reader.readAsDataURL(file);
  });
};

// 이미지 첨부 공통 훅
function useImageUpload() {
  const [uploading, setUploading] = useState(false);
  const [uploadErr, setUploadErr] = useState("");
  const [imgUrl,    setImgUrl]    = useState("");
  const fileRef = useRef(null);

  const triggerPick = () => { setUploadErr(""); fileRef.current?.click(); };
  const handleFile  = async (e) => {
    const file = e.target.files?.[0];
    if(!file) return;
    setUploading(true); setUploadErr("");
    try {
      const url = await uploadImage(file);
      setImgUrl(url);
    } catch(err) {
      setUploadErr(err.message||"업로드 오류");
    } finally {
      setUploading(false);
      e.target.value = "";
    }
  };
  const clear = () => setImgUrl("");

  return { imgUrl, uploading, uploadErr, fileRef, triggerPick, handleFile, clear, setImgUrl };
}

function MatchFormModal({ editMatch, teams, fields, onSave, onClose }) {
  const isEdit=!!editMatch; const def=editMatch||{};
  const [date,setDate]=useState(def.date||"05/20");
  const [time,setTime]=useState(def.time||"09:00");
  const [field,setField]=useState(def.field||fields[0]?.name||"A구장");
  const [group,setGroup]=useState(def.group||"A");  // ← 조 추가
  const [homeId,setHomeId]=useState(null); const [awayId,setAwayId]=useState(null);
  const [hName,setHName]=useState(def.home?.name||"");
  const [hEmoji,setHEmoji]=useState(def.home?.emoji||"🐉");
  const [hColor,setHColor]=useState(def.home?.color||"#e74c3c");
  const [aName,setAName]=useState(def.away?.name||"");
  const [aEmoji,setAEmoji]=useState(def.away?.emoji||"🌊");
  const [aColor,setAColor]=useState(def.away?.color||"#3498db");

  const selectTeam=(side,t)=>{
    if(side==="home"){setHomeId(t.id);setHName(t.name);setHEmoji(t.emoji);setHColor(t.color);}
    else{setAwayId(t.id);setAName(t.name);setAEmoji(t.emoji);setAColor(t.color);}
  };

  const ok=hName.trim()&&aName.trim()&&date&&time&&field;

  const handleSave=()=>{
    if(!ok)return;
    const selHome=teams.find(t=>t.id===homeId);
    const selAway=teams.find(t=>t.id===awayId);
    const mkLineup=(t)=>t?{formation:"4-4-2",gk:[t.players.find(p=>p.pos==="GK")?.name||"GK1"],df:t.players.filter(p=>p.pos==="DF").map(p=>p.name),mf:t.players.filter(p=>p.pos==="MF").map(p=>p.name),fw:t.players.filter(p=>p.pos==="FW").map(p=>p.name)}:{formation:"4-4-2",gk:["GK1"],df:["DF1","DF2","DF3","DF4"],mf:["MF1","MF2","MF3","MF4"],fw:["FW1","FW2"]};
    onSave({
      ...(isEdit?editMatch:{}),
      id:isEdit?editMatch.id:Date.now(),
      date,time,field,group,  // ← group 저장
      home:{name:hName.trim(),emoji:hEmoji,color:hColor},
      away:{name:aName.trim(),emoji:aEmoji,color:aColor},
      status:isEdit?editMatch.status:"예정",
      hs:isEdit?editMatch.hs:null, as:isEdit?editMatch.as:null,
      phase:isEdit?editMatch.phase:"pre", elapsedSec:isEdit?editMatch.elapsedSec:0,
      events:isEdit?editMatch.events:[],
      lineup:isEdit?editMatch.lineup:{home:mkLineup(selHome),away:mkLineup(selAway)},
      stats:isEdit?editMatch.stats:{possession:[50,50],shots:[0,0],shotsOnTarget:[0,0],corners:[0,0],fouls:[0,0],yellowCards:[0,0]},
    });
  };

  return (
    <BottomSheet onClose={onClose}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
        <div style={{fontSize:14}}>{isEdit?"E":"+"}</div>
        <div style={{fontSize:14,fontWeight:800,color:"#e2e8f0"}}>{isEdit?"경기 수정":"경기 개설"}</div>
        <button onClick={onClose} style={{marginLeft:"auto",background:"rgba(255,255,255,.08)",border:"none",borderRadius:8,width:30,height:30,color:"#94a3b8",fontSize:14,cursor:"pointer"}}>✕</button>
      </div>

      <div style={{marginBottom:14}}>
        <SectionLabel>📅 날짜 · 시간</SectionLabel>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Inp value={date} onChange={setDate} placeholder="05/20"/>
          <Inp value={time} onChange={setTime} placeholder="09:00"/>
        </div>
      </div>

      {/* 조 배정 */}
      <div style={{marginBottom:14}}>
        <SectionLabel>🏆 조 배정 (조별 리그)</SectionLabel>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {GROUPS.map(g=>(
            <button key={g} onClick={()=>setGroup(g)} style={{
              width:36,height:36,borderRadius:9,
              background:group===g?"rgba(46,204,113,.25)":"#0f172a",
              border:`1px solid ${group===g?"#2ecc71":"#1e3060"}`,
              color:group===g?"#2ecc71":"#64748b",
              fontWeight:group===g?800:500,fontSize:14,cursor:"pointer",
            }}>{g}</button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:14}}>
        <SectionLabel>🏟 경기장 *</SectionLabel>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {fields.map(f=>(
            <button key={f.id} onClick={()=>setField(f.name)} style={{background:field===f.name?"rgba(46,204,113,.2)":"#0f172a",border:`1px solid ${field===f.name?"#2ecc71":"#1e3060"}`,borderRadius:8,padding:"7px 12px",color:field===f.name?"#2ecc71":"#64748b",fontWeight:field===f.name?700:500,fontSize:14,cursor:"pointer"}}>{f.name}</button>
          ))}
        </div>
      </div>
      {/* 홈팀 */}
      <div style={{marginBottom:14}}>
        <SectionLabel>🏠 홈팀 *</SectionLabel>
        {teams.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
          {teams.map(t=><button key={t.id} onClick={()=>selectTeam("home",t)} style={{display:"flex",alignItems:"center",gap:6,background:homeId===t.id?`${t.color}20`:"#0f172a",border:`1px solid ${homeId===t.id?t.color:"#1e3060"}`,borderRadius:9,padding:"8px 10px",color:homeId===t.id?t.color:"#94a3b8",fontWeight:homeId===t.id?700:500,fontSize:14,cursor:"pointer"}}><span style={{fontSize:14}}>{t.emoji}</span>{t.name}</button>)}
        </div>}
        <Inp value={hName} onChange={setHName} placeholder="홈팀 이름 직접 입력"/>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {TEAM_EMOJIS.map(e=><button key={e} onClick={()=>setHEmoji(e)} style={{width:32,height:32,borderRadius:7,background:hEmoji===e?"rgba(255,255,255,.15)":"#0f172a",border:`1px solid ${hEmoji===e?"#fff":"#1e3060"}`,fontSize:14,cursor:"pointer"}}>{e}</button>)}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {TEAM_COLORS.map(c=><button key={c} onClick={()=>setHColor(c)} style={{width:26,height:26,borderRadius:"50%",background:c,border:hColor===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>)}
        </div>
      </div>

      {/* 원정팀 */}
      <div style={{marginBottom:20}}>
        <SectionLabel>원정팀 *</SectionLabel>
        {teams.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
          {teams.map(t=><button key={t.id} onClick={()=>selectTeam("away",t)} style={{display:"flex",alignItems:"center",gap:6,background:awayId===t.id?`${t.color}20`:"#0f172a",border:`1px solid ${awayId===t.id?t.color:"#1e3060"}`,borderRadius:9,padding:"8px 10px",color:awayId===t.id?t.color:"#94a3b8",fontWeight:awayId===t.id?700:500,fontSize:14,cursor:"pointer"}}><span style={{fontSize:14}}>{t.emoji}</span>{t.name}</button>)}
        </div>}
        <Inp value={aName} onChange={setAName} placeholder="원정팀 이름 직접 입력"/>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {TEAM_EMOJIS.map(e=><button key={e} onClick={()=>setAEmoji(e)} style={{width:32,height:32,borderRadius:7,background:aEmoji===e?"rgba(255,255,255,.15)":"#0f172a",border:`1px solid ${aEmoji===e?"#fff":"#1e3060"}`,fontSize:14,cursor:"pointer"}}>{e}</button>)}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
          {TEAM_COLORS.map(c=><button key={c} onClick={()=>setAColor(c)} style={{width:26,height:26,borderRadius:"50%",background:c,border:aColor===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>)}
        </div>
      </div>

      <button onClick={handleSave} style={{width:"100%",background:ok?"linear-gradient(135deg,#2ecc71,#27ae60)":"#1e293b",border:"none",borderRadius:12,padding:"15px 0",color:ok?"#000":"#475569",fontWeight:800,fontSize:14,cursor:ok?"pointer":"not-allowed"}}>
        {isEdit?"수정 완료":"경기 개설"}
      </button>
    </BottomSheet>
  );
}

// ── 팀 관리 탭 ────────────────────────────────────────────────────────────────
function TeamTab({ teams, setTeams, canManage, showNotif }) {
  const [view, setView]     = useState("list"); // list | form | detail
  const [editTeam, setEdit] = useState(null);
  const [detailTeam, setDetail] = useState(null);
  const [delTarget, setDel] = useState(null);
  const [playerForm, setPlayerForm] = useState(null); // null | "new" | player
  const [delPlayer, setDelPlayer]   = useState(null);

  const blank = {name:"",emoji:"🐉",color:"#e74c3c",region:"",group:"A",coach:"",players:[]};
  const [form, setForm] = useState(blank);

  const openNew  = ()=>{ setForm(blank); setEdit(null); setView("form"); };
  const openEdit = (t)=>{ setForm({...t}); setEdit(t); setView("form"); };
  const openDetail=(t)=>{ setDetail(t); setView("detail"); };

  const saveTeam = ()=>{
    if(!form.name.trim()) return;
    if(editTeam){
      setTeams(prev=>prev.map(t=>t.id===editTeam.id?{...form,id:editTeam.id}:t));
      setDetail({...form,id:editTeam.id});
      showNotif("✅ 팀이 수정되었습니다!");
    } else {
      const nt={...form,id:Date.now()};
      setTeams(prev=>[...prev,nt]);
      showNotif("✅ 팀이 개설되었습니다!");
    }
    setView(editTeam?"detail":"list");
  };

  const deleteTeam=(id)=>{
    setTeams(prev=>prev.filter(t=>t.id!==id));
    setDel(null); setView("list");
    showNotif("🗑 팀이 삭제되었습니다","#ff4757");
  };

  // 선수 관리
  const blankPlayer = {name:"",pos:"MF",birth:""};
  const [pForm, setPForm] = useState(blankPlayer);
  const [editPid, setEditPid] = useState(null);

  const openNewPlayer  = ()=>{ setPForm(blankPlayer); setEditPid(null); setPlayerForm("new"); };
  const openEditPlayer = (p)=>{ setPForm({...p}); setEditPid(p.id); setPlayerForm(p); };

  const savePlayer=()=>{
    if(!pForm.name.trim()) return;
    const updateDetail = (t) => {
      if(editPid){
        return {...t, players: t.players.map(p=>p.id===editPid?{...pForm,id:editPid}:p)};
      } else {
        const np={...pForm,id:Date.now()};
        return {...t, players:[...t.players,np]};
      }
    };
    setTeams(prev=>prev.map(t=>t.id===detailTeam.id?updateDetail(t):t));
    const updated=updateDetail(detailTeam);
    setDetail(updated);
    setPlayerForm(null);
    showNotif(editPid?"✅ 선수 정보 수정":"✅ 선수 추가 완료");
  };

  const deletePlayer=(pid)=>{
    const updated={...detailTeam, players:detailTeam.players.filter(p=>p.id!==pid)};
    setTeams(prev=>prev.map(t=>t.id===detailTeam.id?updated:t));
    setDetail(updated); setDelPlayer(null);
    showNotif("🗑 선수가 삭제되었습니다","#ff4757");
  };

  // 선수 폼 모달
  if(playerForm){
    return (
      <div style={{padding:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setPlayerForm(null)} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:10,width:34,height:34,color:"#e2e8f0",fontSize:14,cursor:"pointer"}}>←</button>
          <div style={{fontSize:14,fontWeight:800}}>{editPid?"선수 수정":"선수 추가"}</div>
        </div>
        <div style={{marginBottom:12}}><SectionLabel>이름 *</SectionLabel><Inp value={pForm.name} onChange={v=>setPForm(p=>({...p,name:v}))} placeholder="선수 이름"/></div>
        <div style={{marginBottom:12}}>

  // 팀 상세 (선수 목록)
  if(view==="detail" && detailTeam){
    const t=teams.find(x=>x.id===detailTeam.id)||detailTeam;
    return (
      <div style={{padding:16}}>
        {delPlayer&&<DeleteConfirmSheet title="선수를 삭제하시겠습니까?" body={`${delPlayer.name} (${delPlayer.pos})`} onConfirm={()=>deletePlayer(delPlayer.id)} onClose={()=>setDelPlayer(null)}/>}

          </div>
          {canManage&&<div style={{display:"flex",gap:6}}>
            <button onClick={()=>openEdit(t)} style={{background:"rgba(59,130,246,.15)",border:"1px solid #3b82f640",borderRadius:8,padding:"5px 10px",color:"#60a5fa",fontSize:14,fontWeight:700,cursor:"pointer"}}>수정</button>
            <button onClick={()=>setDel(t)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:8,padding:"5px 10px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>🗑</button>

        </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:14,fontWeight:700}}>선수 명단 ({t.players.length}명)</div>

          if(!ps.length) return null;
          return (
            <div key={pos} style={{marginBottom:12}}>
              <div style={{fontSize:14,fontWeight:700,color:t.color,marginBottom:6,letterSpacing:1}}>{pos}</div>
              {ps.map(p=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,background:"#0f1d35",border:"1px solid #1e3060",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
                  <div style={{width:32,height:32,borderRadius:"50%",background:t.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>👤</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{p.name}</div>
                    <div style={{fontSize:14,color:"#64748b"}}>{p.birth||"생년월일 미입력"}</div>
                  </div>
                  {canManage&&<div style={{display:"flex",gap:5}}>
                    <button onClick={()=>openEditPlayer(p)} style={{background:"rgba(59,130,246,.15)",border:"none",borderRadius:7,padding:"5px 8px",color:"#60a5fa",fontSize:14,cursor:"pointer"}}>수정</button>
                    <button onClick={()=>setDelPlayer(p)} style={{background:"rgba(255,71,87,.1)",border:"none",borderRadius:7,padding:"5px 8px",color:"#ff4757",fontSize:14,cursor:"pointer"}}>🗑</button>
                  </div>}
                </div>
              ))}
            </div>
          );

        {t.players.length===0&&<div style={{textAlign:"center",padding:"32px 0",color:"#475569"}}><div style={{fontSize:14,marginBottom:8}}>👥</div><div>선수가 없습니다</div>{canManage&&<button onClick={openNewPlayer} style={{marginTop:12,background:"rgba(46,204,113,.15)",border:"1px solid #2ecc71",borderRadius:9,padding:"9px 18px",color:"#2ecc71",fontWeight:700,fontSize:14,cursor:"pointer"}}>첫 선수 추가</button>}</div>}
      </div>
    );
  }

  // 팀 폼
  if(view==="form"){
    return (
      <div style={{padding:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setView(editTeam?"detail":"list")} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:10,width:34,height:34,color:"#e2e8f0",fontSize:14,cursor:"pointer"}}>←</button>
          <div style={{fontSize:14,fontWeight:800}}>{editTeam?"팀 수정":"팀 개설"}</div>
        </div>
        <div style={{marginBottom:12}}><SectionLabel>팀 이름 *</SectionLabel><Inp value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="예) 서울 드래곤스"/></div>
        <div style={{marginBottom:12}}><SectionLabel>지역</SectionLabel><Inp value={form.region} onChange={v=>setForm(f=>({...f,region:v}))} placeholder="예) 서울특별시"/></div>
        <div style={{marginBottom:12}}><SectionLabel>감독/코치명</SectionLabel><Inp value={form.coach} onChange={v=>setForm(f=>({...f,coach:v}))} placeholder="예) 홍길동"/></div>
        <div style={{marginBottom:12}}>
          <SectionLabel>조 배정</SectionLabel>
          <div style={{display:"flex",gap:8}}>
            {GROUPS.map(g=><button key={g} onClick={()=>setForm(f=>({...f,group:g}))} style={{flex:1,background:form.group===g?"rgba(46,204,113,.2)":"#0f1d35",border:`1px solid ${form.group===g?"#2ecc71":"#1e3060"}`,borderRadius:9,padding:"10px 0",color:form.group===g?"#2ecc71":"#64748b",fontWeight:700,fontSize:14,cursor:"pointer"}}>{g}</button>)}
          </div>
        </div>
        <div style={{marginBottom:12}}>
          <SectionLabel>엠블럼</SectionLabel>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {TEAM_EMOJIS.map(e=><button key={e} onClick={()=>setForm(f=>({...f,emoji:e}))} style={{width:36,height:36,borderRadius:8,background:form.emoji===e?"rgba(255,255,255,.15)":"#0f172a",border:`1px solid ${form.emoji===e?"#fff":"#1e3060"}`,fontSize:14,cursor:"pointer"}}>{e}</button>)}
          </div>
        </div>
        <div style={{marginBottom:20}}>
          <SectionLabel>팀 컬러</SectionLabel>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {TEAM_COLORS.map(c=><button key={c} onClick={()=>setForm(f=>({...f,color:c}))} style={{width:28,height:28,borderRadius:"50%",background:c,border:form.color===c?"3px solid #fff":"2px solid transparent",cursor:"pointer"}}/>)}
          </div>
        </div>
        <button onClick={saveTeam} style={{width:"100%",background:form.name.trim()?"linear-gradient(135deg,#2ecc71,#27ae60)":"#1e293b",border:"none",borderRadius:12,padding:"14px 0",color:form.name.trim()?"#000":"#475569",fontWeight:800,fontSize:14,cursor:form.name.trim()?"pointer":"not-allowed"}}>

  // 팀 목록
  return (
    <div style={{padding:16}}>

        <div><div style={{fontSize:14,fontWeight:800}}>팀 관리</div><div style={{fontSize:14,color:"#64748b",marginTop:2}}>총 {teams.length}팀 등록</div></div>
        {canManage&&<button onClick={openNew} style={{background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"9px 14px",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>➕ 팀 개설</button>}

      {teams.length===0?(
        <div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}>
          <div style={{fontSize:14,marginBottom:12}}>👥</div>
          <div>등록된 팀이 없습니다</div>
          {canManage&&<button onClick={openNew} style={{marginTop:14,background:"rgba(46,204,113,.15)",border:"1px solid #2ecc71",borderRadius:10,padding:"10px 20px",color:"#2ecc71",fontWeight:700,fontSize:14,cursor:"pointer"}}>첫 팀 개설하기</button>}
        </div>
      ):(
        teams.map(t=>(
          <div key={t.id} style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:44,height:44,borderRadius:12,background:`${t.color}25`,border:`1px solid ${t.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{t.emoji}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:800,color:"#e2e8f0"}}>{t.name}</div>
                <div style={{fontSize:14,color:"#64748b",marginTop:2}}>{t.region} · {t.group}조 · 선수 {t.players.length}명</div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>openDetail(t)} style={{background:"rgba(46,204,113,.15)",border:"1px solid #2ecc7140",borderRadius:8,padding:"5px 10px",color:"#2ecc71",fontSize:14,fontWeight:700,cursor:"pointer"}}>상세</button>
                {canManage&&<>
                  <button onClick={()=>openEdit(t)} style={{background:"rgba(59,130,246,.15)",border:"1px solid #3b82f640",borderRadius:8,padding:"5px 10px",color:"#60a5fa",fontSize:14,fontWeight:700,cursor:"pointer"}}>수정</button>
                  <button onClick={()=>setDel(t)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:8,padding:"5px 10px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>🗑</button>

    </div>
  );
}

// ── 경기장 관리 탭 ────────────────────────────────────────────────────────────
function FieldTab({ fields, setFields, canManage, showNotif }) {
  const [view,   setView]   = useState("list");
  const [editF,  setEditF]  = useState(null);
  const [delF,   setDelF]   = useState(null);
  const blank = {name:"",location:"",surface:"천연잔디",capacity:"",note:""};
  const [form, setForm] = useState(blank);

  const openNew  = ()=>{ setForm(blank); setEditF(null); setView("form"); };
  const openEdit = (f)=>{ setForm({...f}); setEditF(f); setView("form"); };

  const saveField = ()=>{
    if(!form.name.trim()) return;
    if(editF){
      setFields(prev=>prev.map(f=>f.id===editF.id?{...form,id:editF.id}:f));
      showNotif("✅ 경기장이 수정되었습니다!");
    } else {
      setFields(prev=>[...prev,{...form,id:Date.now()}]);
      showNotif("✅ 경기장이 개설되었습니다!");
    }
    setView("list");
  };

  const deleteField = (id)=>{
    setFields(prev=>prev.filter(f=>f.id!==id));
    setDelF(null); setView("list");
    showNotif("🗑 경기장이 삭제되었습니다","#ff4757");
  };

  if(view==="form"){
    return (
      <div style={{padding:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setView("list")} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:10,width:34,height:34,color:"#e2e8f0",fontSize:14,cursor:"pointer"}}>←</button>
          <div style={{fontSize:14,fontWeight:800}}>{editF?"경기장 수정":"경기장 개설"}</div>
        </div>
        <div style={{marginBottom:12}}><SectionLabel>경기장 이름 *</SectionLabel><Inp value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="예) A구장"/></div>
        <div style={{marginBottom:12}}><SectionLabel>위치</SectionLabel><Inp value={form.location} onChange={v=>setForm(f=>({...f,location:v}))} placeholder="예) 대회본부 서측"/></div>
        <div style={{marginBottom:12}}>
          <SectionLabel>잔디 종류</SectionLabel>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            {SURFACE_OPTS.map(s=><button key={s} onClick={()=>setForm(f=>({...f,surface:s}))} style={{background:form.surface===s?"rgba(46,204,113,.2)":"#0f1d35",border:`1px solid ${form.surface===s?"#2ecc71":"#1e3060"}`,borderRadius:9,padding:"10px 6px",color:form.surface===s?"#2ecc71":"#64748b",fontWeight:form.surface===s?700:500,fontSize:14,cursor:"pointer"}}>{s}</button>)}
          </div>
        </div>
        <div style={{marginBottom:12}}><SectionLabel>수용 인원</SectionLabel><Inp value={form.capacity} onChange={v=>setForm(f=>({...f,capacity:v}))} placeholder="예) 500"/></div>
        <div style={{marginBottom:20}}><SectionLabel>비고</SectionLabel><Inp value={form.note} onChange={v=>setForm(f=>({...f,note:v}))} placeholder="예) 메인 경기장, 야간 조명 있음"/></div>
        <button onClick={saveField} style={{width:"100%",background:form.name.trim()?"linear-gradient(135deg,#2ecc71,#27ae60)":"#1e293b",border:"none",borderRadius:12,padding:"14px 0",color:form.name.trim()?"#000":"#475569",fontWeight:800,fontSize:14,cursor:form.name.trim()?"pointer":"not-allowed"}}>
          {editF?"✓ 수정 완료":"➕ 경기장 개설"}
        </button>
      </div>
    );
  }

  return (
    <div style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div><div style={{fontSize:14,fontWeight:800}}>경기장 관리</div><div style={{fontSize:14,color:"#64748b",marginTop:2}}>총 {fields.length}개 경기장</div></div>
        {canManage&&<button onClick={openNew} style={{background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"9px 14px",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>➕ 경기장 개설</button>}
      </div>
      {fields.length===0?(
        <div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}>
          <div style={{fontSize:14,marginBottom:12}}>🏟</div>
          <div>등록된 경기장이 없습니다</div>
          {canManage&&<button onClick={openNew} style={{marginTop:14,background:"rgba(46,204,113,.15)",border:"1px solid #2ecc71",borderRadius:10,padding:"10px 20px",color:"#2ecc71",fontWeight:700,fontSize:14,cursor:"pointer"}}>첫 경기장 개설하기</button>}
        </div>
      ):(
        fields.map(f=>(
          <div key={f.id} style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,padding:14,marginBottom:10}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
              <div style={{width:44,height:44,borderRadius:12,background:"rgba(46,204,113,.15)",border:"1px solid #2ecc7130",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🏟</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:800,color:"#e2e8f0"}}>{f.name}</div>
                <div style={{fontSize:14,color:"#64748b",marginTop:3,lineHeight:1.6}}>
                  {f.location&&<span>📍 {f.location} · </span>}
                  <span>🌿 {f.surface}</span>
                  {f.capacity&&<span> · 👥 {f.capacity}명</span>}
                </div>
                {f.note&&<div style={{fontSize:14,color:"#475569",marginTop:2}}>💬 {f.note}</div>}
              </div>
              {canManage&&<div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>openEdit(f)} style={{background:"rgba(59,130,246,.15)",border:"1px solid #3b82f640",borderRadius:8,padding:"5px 10px",color:"#60a5fa",fontSize:14,fontWeight:700,cursor:"pointer"}}>수정</button>
                <button onClick={()=>setDelF(f)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:8,padding:"5px 10px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>🗑</button>
              </div>}
            </div>
          </div>
        ))
      )}
      {delF&&<DeleteConfirmSheet title="경기장을 삭제하시겠습니까?" body={delF.name} onConfirm={()=>deleteField(delF.id)} onClose={()=>setDelF(null)}/>}
    </div>
  );
}

// ── 참가자 등록 탭 (버그 수정 - 별도 컴포넌트로 분리) ─────────────────────────

          ))}
        </div>
      </div>

      <div style={{marginBottom:12}}><SectionLabel>이름 *</SectionLabel><Inp value={rForm.name} onChange={v=>setRForm(p=>({...p,name:v}))} placeholder="홍길동"/></div>

      <div style={{marginBottom:12}}>

          {teams.map(t=><button key={t.id} onClick={()=>setRForm(p=>({...p,team:t.name}))} style={{display:"flex",alignItems:"center",gap:6,background:rForm.team===t.name?`${t.color}20`:"#0f172a",border:`1px solid ${rForm.team===t.name?t.color:"#1e3060"}`,borderRadius:9,padding:"7px 10px",color:rForm.team===t.name?t.color:"#94a3b8",fontWeight:rForm.team===t.name?700:500,fontSize:14,cursor:"pointer"}}><span style={{fontSize:14}}>{t.emoji}</span>{t.name}</button>)}
        </div>}
        <Inp value={rForm.team} onChange={v=>setRForm(p=>({...p,team:v}))} placeholder="팀 이름 직접 입력"/>
      </div>

      <div style={{marginBottom:12}}><SectionLabel>생년월일</SectionLabel><Inp value={rForm.birth} onChange={v=>setRForm(p=>({...p,birth:v}))} placeholder="2013-05-20"/></div>

      {role==="선수"&&(
        <div style={{marginBottom:12}}>
          <SectionLabel>포지션</SectionLabel>
          <div style={{display:"flex",gap:8}}>
            {POS_LIST.map(p=><button key={p} onClick={()=>setPos(p)} style={{flex:1,background:pos===p?"rgba(46,204,113,.15)":"#0f1d35",border:`1px solid ${pos===p?"#2ecc71":"#1e3060"}`,borderRadius:8,padding:"10px 0",color:pos===p?"#2ecc71":"#64748b",fontWeight:700,fontSize:14,cursor:"pointer"}}>{p}</button>)}
          </div>
        </div>
      )}

      <button onClick={()=>{ if(rForm.name&&rForm.team&&role) setDone(true); }} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:12,padding:"14px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 4px 16px rgba(46,204,113,.25)",marginTop:4}}>📋 등록 신청하기</button>

      <div style={{marginTop:12,background:"rgba(46,204,113,.05)",border:"1px solid #2ecc7120",borderRadius:10,padding:"9px 14px"}}>
        <div style={{fontSize:14,color:"#475569"}}>현재 로그인: <strong style={{color:user.color}}>{user.icon} {user.label}</strong> · {user.name}</div>
      </div>
    </div>
  );
}

// ── 경기 상세 ─────────────────────────────────────────────────────────────────
function MatchDetail({ matchId, matches, onUpdateMatch, onBack, user }) {
  const match=matches.find(m=>m.id===matchId);
  const [tab,   setTab]   = useState("timeline");
  const [modal, setModal] = useState(null);
  const [notif, setNotif] = useState(null);
  // 타이머는 App 전역 타이머가 담당 (이중 타이머 방지)
  const update = useCallback(updater=>{
    onUpdateMatch(matchId, typeof updater==="function"?updater(match):updater);
  },[match,matchId,onUpdateMatch]);

  if(!match) return null;

  const phase=match.phase||"pre"; const elSec=match.elapsedSec||0;
  const isFirst=phase==="first_half"; const isSecond=phase==="second_half";
  const isHalf=phase==="half_time"; const isRunning=isFirst||isSecond;
  const isPre=phase==="pre"; const isFinished=phase==="finished";

  // ── 경기 시간 설정 ─────────────────────────────────────────────────────────
  // 조별 기본값: A조(U-11)=10분, B조(U-9)=15분, C조(U-13)=10분
  const defaultHalf = match.group==="B" ? 15 : 10;
  const halfDur     = match.halfDuration ?? defaultHalf;  // 전반/후반 각 시간(분)
  const fullDur     = halfDur * 2;                         // 풀타임(분)
  const halfSec     = halfDur * 60;                        // 전반 초

  // 추가시간
  const extraFirst  = match.extraFirst  || 0;
  const extraSecond = match.extraSecond || 0;

  // 타이머 표시 계산
  const dispSec  = isSecond ? (elSec - (match.firstHalfSec||0)) : elSec;
  const rawMin   = isSecond
    ? Math.floor(dispSec/60) + halfDur + 1
    : Math.floor(elSec/60) + 1;
  const capMin   = isFirst
    ? (rawMin > halfDur ? halfDur : rawMin)
    : isSecond
    ? (rawMin > fullDur ? fullDur : rawMin)
    : rawMin;
  const extraMin = isFirst
    ? (rawMin > halfDur ? rawMin - halfDur : 0)
    : isSecond
    ? (rawMin > fullDur ? rawMin - fullDur : 0)
    : 0;
  const dispStr = isHalf ? "HT"
    : isFinished ? "FT"
    : isRunning
      ? extraMin > 0
        ? `${capMin}+${extraMin}'${pad(dispSec%60)}`
        : `${capMin}'${pad(dispSec%60)}`
      : "--";
  const curMin = isRunning
    ? (extraMin > 0 ? capMin + extraMin : capMin)
    : 1;

  const showN=(msg,color="#2ecc71")=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2400);};

  const goPhase=(next,msg,color="#2ecc71")=>{
    const upd={phase:next};
    if(next==="half_time")   {upd.firstHalfSec=elSec; upd.status="진행중";}
    if(next==="second_half") {upd.status="진행중";}
    if(next==="first_half")  {upd.status="진행중"; upd.hs=match.hs??0; upd.as=match.as??0;}
    if(next==="finished")    {upd.status="완료";}
    update(prev=>({...prev,...upd}));
    showN(msg,color);
  };

  const setExtra=(half, val)=>{
    const key = half==="first" ? "extraFirst" : "extraSecond";
    update(prev=>({...prev,[key]:Math.max(0,Math.min(15,val))}));
  };
  const setHalfDur=(val)=>{
    update(prev=>({...prev, halfDuration:Math.max(5,Math.min(30,val))}));
  };

  const addGoal=(side,player,assist,method,min)=>{
    const sk=side==="home"?"hs":"as";
    update(prev=>({...prev,[sk]:(prev[sk]||0)+1,events:[...prev.events,{id:Date.now(),min,type:"goal",team:side,player,assist:assist||"",desc:method}]}));
    setModal(null); showN(`⚽ ${player}${assist?" 🤝"+assist:""} · ${method} · ${min}'`);
  };
  const addCard=(type,team,player,reason,min)=>{
    update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type,team,player,assist:"",desc:reason}]}));
    setModal(null); showN(`${type==="yellow"?"🟨":"🟥"} ${player} · ${min}'`);
  };
  const addSub=(team,out,inP,note,min)=>{
    update(prev=>({...prev,events:[...prev.events,{id:Date.now(),min,type:"sub",team,player:`${out}↔${inP}`,assist:"",desc:note||"선수 교체"}]}));
    setModal(null); showN(`🔄 ${out}→${inP} · ${min}'`);
  };
  const cancelGoal=(id)=>{
    const ev=match.events.find(e=>e.id===id); if(!ev) return;
    const sk=ev.team==="home"?"hs":"as";
    update(prev=>({...prev,[sk]:Math.max(0,(prev[sk]||0)-1),events:prev.events.filter(e=>e.id!==id)}));
    setModal(null); showN("🚫 골 취소 완료","#ff4757");
  };
  const eIcon=t=>({goal:"⚽",yellow:"🟨",red:"🟥",sub:"🔄"}[t]||"●");

  const PhaseBar=()=>(
    <div style={{background:"#0a1428",border:"1px solid #1e3060",borderRadius:14,padding:14,marginBottom:12}}>
      <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:10,letterSpacing:1}}>🎮 경기 진행 관리</div>

      {/* 경기 시작 전 설정 */}
      {isPre&&(
        <div style={{marginBottom:12}}>
          {/* 날짜/시간/경기장 */}
          <div style={{background:"rgba(59,130,246,.07)",border:"1px solid #3b82f620",borderRadius:10,padding:12,marginBottom:8}}>
            <div style={{fontSize:14,fontWeight:700,color:"#60a5fa",marginBottom:8,letterSpacing:1}}>📅 경기 일정 수정</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <div style={{fontSize:14,color:"#475569",marginBottom:4}}>날짜</div>
                <input value={match.date} onChange={e=>update(prev=>({...prev,date:e.target.value}))}
                  style={{width:"100%",background:"#0f172a",border:"1px solid #3b82f640",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
              </div>
              <div>
                <div style={{fontSize:14,color:"#475569",marginBottom:4}}>시작 시간</div>
                <input value={match.time} onChange={e=>update(prev=>({...prev,time:e.target.value}))} placeholder="HH:MM"
                  style={{width:"100%",background:"#0f172a",border:"1px solid #3b82f640",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
              </div>
            </div>
            <div style={{fontSize:14,color:"#475569",marginBottom:4}}>경기장</div>
            <input value={match.field} onChange={e=>update(prev=>({...prev,field:e.target.value}))}
              style={{width:"100%",background:"#0f172a",border:"1px solid #3b82f640",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
          </div>

          {/* 러닝타임 설정 */}
          <div style={{background:"rgba(46,204,113,.07)",border:"1px solid #2ecc7130",borderRadius:10,padding:12}}>
            <div style={{fontSize:14,fontWeight:700,color:"#2ecc71",marginBottom:10,letterSpacing:1}}>⏱ 전반/후반 러닝타임 설정</div>
            {/* 조별 빠른 선택 */}
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {[
                {label:"U-11 · 10분", val:10, color:"#e74c3c"},
                {label:"U-9 · 15분",  val:15, color:"#2ecc71"},
                {label:"U-13 · 10분", val:10, color:"#8e44ad"},
              ].map(p=>(
                <button key={p.label} onClick={()=>setHalfDur(p.val)} style={{
                  flex:1, background:halfDur===p.val?`${p.color}20`:"#0f172a",
                  border:`1px solid ${halfDur===p.val?p.color:"#1e3060"}`,
                  borderRadius:8, padding:"8px 4px",
                  color:halfDur===p.val?p.color:"#64748b",
                  fontWeight:halfDur===p.val?800:500, fontSize:14, cursor:"pointer",
                }}>{p.label}</button>
              ))}
            </div>
            {/* 직접 조정 */}
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <button onClick={()=>setHalfDur(halfDur-1)} style={{width:36,height:36,borderRadius:8,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:14,cursor:"pointer",fontWeight:700}}>−</button>
              <div style={{flex:1,textAlign:"center"}}>
                <span style={{fontSize:14,fontWeight:900,color:"#2ecc71"}}>{halfDur}</span>
                <span style={{fontSize:14,color:"#64748b",marginLeft:4}}>분</span>
                <div style={{fontSize:14,color:"#475569",marginTop:3}}>전반 {halfDur}분 + 후반 {halfDur}분 = 총 {halfDur*2}분</div>
              </div>
              <button onClick={()=>setHalfDur(halfDur+1)} style={{width:36,height:36,borderRadius:8,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:14,cursor:"pointer",fontWeight:700}}>+</button>
            </div>
            <div style={{fontSize:14,color:"#475569",textAlign:"center",marginTop:6}}>5분 ~ 30분 범위에서 설정 가능</div>
          </div>
        </div>
      )}

      {/* 실시간 타이머 표시 */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,padding:"12px 14px",background:"rgba(0,0,0,.3)",borderRadius:10,border:`1px solid ${PHASE_COLOR[phase]}30`}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:PHASE_COLOR[phase],flexShrink:0,animation:isRunning?"blink 1s infinite":"none"}}/>
        <div style={{flex:1}}>
          <div style={{fontSize:14,color:PHASE_COLOR[phase],fontWeight:700}}>{PHASE_LABEL[phase]}</div>
          {isRunning&&<div style={{fontSize:14,color:"#475569",marginTop:1}}>
            전후반 각 {halfDur}분{extraMin>0?" · ⏱ 추가시간":""}</div>}
          {isHalf&&<div style={{fontSize:14,color:"#475569",marginTop:1}}>하프타임</div>}
          {isPre&&<div style={{fontSize:14,color:"#475569",marginTop:1}}>전후반 각 {halfDur}분 예정</div>}
        </div>
        <div style={{fontSize:14,fontWeight:900,color:extraMin>0?"#f1c40f":PHASE_COLOR[phase],fontVariantNumeric:"tabular-nums",letterSpacing:-1}}>{dispStr}</div>
      </div>

      {/* 추가시간 설정 (전반/후반 진행 중) */}
      {(isFirst||isSecond)&&(
        <div style={{marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:7,letterSpacing:1}}>
            ⏱ {isFirst?"전반":"후반"} 추가시간
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(241,196,15,.06)",border:"1px solid #f1c40f20",borderRadius:10,padding:"10px 12px"}}>
            <button onClick={()=>setExtra(isFirst?"first":"second",(isFirst?extraFirst:extraSecond)-1)}
              style={{width:30,height:30,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:14,cursor:"pointer",fontWeight:700}}>−</button>
            <div style={{flex:1,textAlign:"center"}}>
              <span style={{fontSize:14,fontWeight:900,color:"#f1c40f"}}>{isFirst?extraFirst:extraSecond}</span>
              <span style={{fontSize:14,color:"#64748b",marginLeft:4}}>분 추가</span>
            </div>
            <button onClick={()=>setExtra(isFirst?"first":"second",(isFirst?extraFirst:extraSecond)+1)}
              style={{width:30,height:30,borderRadius:7,background:"#1e293b",border:"1px solid #334155",color:"#94a3b8",fontSize:14,cursor:"pointer",fontWeight:700}}>+</button>
          </div>
          {(isFirst?extraFirst:extraSecond)>0&&(
            <div style={{fontSize:14,color:"#f1c40f",marginTop:5,textAlign:"center"}}>
              {isFirst?"전반":"후반"} {isFirst?halfDur:fullDur}+{isFirst?extraFirst:extraSecond}분까지 진행
            </div>
          )}
        </div>
      )}

      {/* 단계 버튼 */}
      {isPre&&<button onClick={()=>goPhase("first_half","▶ 경기 시작!")} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"13px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>
        ▶ 경기 시작 (전반 {halfDur}분)
      </button>}
      {isFirst&&<button onClick={()=>goPhase("half_time","⏸ 전반전 종료","#f1c40f")} style={{width:"100%",background:"linear-gradient(135deg,#f1c40f,#d4ac0d)",border:"none",borderRadius:10,padding:"12px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>
        ⏸ 전반 종료{extraFirst>0?` (+${extraFirst}분)`:""}
      </button>}
      {isHalf&&<button onClick={()=>goPhase("second_half","▶ 후반전 시작!")} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"12px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>
        ▶ 후반 시작 (후반 {halfDur}분)
      </button>}
      {isSecond&&<button onClick={()=>goPhase("finished","🏁 경기 종료!","#ff4757")} style={{width:"100%",background:"linear-gradient(135deg,#ff4757,#c0392b)",border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>
        🏁 경기 종료{extraSecond>0?` (+${extraSecond}분)`:""}
      </button>}
      {isFinished&&<div style={{textAlign:"center",padding:"8px 0",fontSize:14,color:"#64748b"}}>경기 종료 (전후반 각 {halfDur}분)</div>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"#020817",zIndex:100,display:"flex",flexDirection:"column",fontFamily:"'Noto Sans KR',sans-serif",maxWidth:430,margin:"0 auto",overflowY:"auto"}}>
      <Notif notif={notif}/>
      {modal==="goal_home"&&<GoalModal side="home" match={match} currentMin={curMin} onConfirm={(p,a,m,min)=>addGoal("home",p,a,m,min)} onClose={()=>setModal(null)}/>}
      {modal==="goal_away"&&<GoalModal side="away" match={match} currentMin={curMin} onConfirm={(p,a,m,min)=>addGoal("away",p,a,m,min)} onClose={()=>setModal(null)}/>}
      {modal==="yellow"&&<CardModal type="yellow" match={match} currentMin={curMin} onConfirm={(t,p,r,m)=>addCard("yellow",t,p,r,m)} onClose={()=>setModal(null)}/>}
      {modal==="red"&&<CardModal type="red" match={match} currentMin={curMin} onConfirm={(t,p,r,m)=>addCard("red",t,p,r,m)} onClose={()=>setModal(null)}/>}
      {modal==="sub"&&<SubModal match={match} currentMin={curMin} onConfirm={addSub} onClose={()=>setModal(null)}/>}
      {modal==="cancel"&&(
        <BottomSheet onClose={()=>setModal(null)}>
          <div style={{fontSize:14,fontWeight:800,color:"#ff4757",marginBottom:14}}>🚫 골 취소</div>
          {match.events.filter(e=>e.type==="goal").length===0
            ?<div style={{textAlign:"center",padding:"20px 0",color:"#475569",fontSize:14}}>취소할 골 기록이 없습니다</div>
            :match.events.filter(e=>e.type==="goal").map(e=>(
              <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,71,87,.07)",border:"1px solid #ff475730",borderRadius:10,padding:"10px 12px",marginBottom:7}}>
                <span style={{fontSize:14}}>⚽</span>
                <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{e.player}{e.assist&&<span style={{fontSize:14,color:"#3498db"}}> 🤝{e.assist}</span>}</div><div style={{fontSize:14,color:"#64748b"}}>{e.desc} · {e.min}' · {e.team==="home"?match.home.name:match.away.name}</div></div>
                <button onClick={()=>cancelGoal(e.id)} style={{background:"#ff4757",border:"none",borderRadius:8,padding:"6px 12px",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer"}}>취소</button>
              </div>
            ))
          }
        </BottomSheet>
      )}

      <div style={{background:"linear-gradient(160deg,#0d1b3e 0%,#1a2a5e 60%,#0a0e1a 100%)",borderBottom:"1px solid #1e3060",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",padding:"14px 16px 0"}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:10,width:34,height:34,color:"#e2e8f0",fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{flex:1,textAlign:"center",fontSize:14,color:"#64748b"}}>{match.date} · {match.field}</div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            {isRunning&&<div style={{background:`${PHASE_COLOR[phase]}20`,border:`1px solid ${PHASE_COLOR[phase]}50`,borderRadius:20,padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:PHASE_COLOR[phase],display:"inline-block",animation:"blink 1s infinite"}}/>
              <span style={{fontSize:14,fontWeight:900,color:PHASE_COLOR[phase],fontVariantNumeric:"tabular-nums"}}>{dispStr}</span>
            </div>}
            {isHalf&&<div style={{background:"rgba(241,196,15,.15)",border:"1px solid #f1c40f40",borderRadius:20,padding:"3px 9px",fontSize:14,fontWeight:800,color:"#f1c40f"}}>HT</div>}
            {isFinished&&<div style={{background:"rgba(148,163,184,.1)",border:"1px solid #33415540",borderRadius:20,padding:"3px 9px",fontSize:14,fontWeight:800,color:"#94a3b8"}}>FT</div>}
            <div style={{background:`${user.color}20`,border:`1px solid ${user.color}50`,borderRadius:20,padding:"3px 8px",fontSize:14,fontWeight:700,color:user.color}}>{user.icon}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px 12px"}}>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:14,lineHeight:1}}>{match.home.emoji}</div>
            <div style={{fontSize:14,fontWeight:800,marginTop:6,color:"#e2e8f0"}}>{match.home.name}</div>
          </div>
          <div style={{textAlign:"center",padding:"0 10px"}}>
            {isPre?(
              <div><div style={{fontSize:14,fontWeight:900,color:"#64748b"}}>VS</div><div style={{fontSize:14,color:"#60a5fa",marginTop:4,background:"rgba(59,130,246,.1)",padding:"3px 10px",borderRadius:20}}>{match.time}</div></div>
            ):(
              <div>
                <div style={{fontSize:22,fontWeight:900,letterSpacing:4,lineHeight:1}}>
                  <span style={{color:(match.hs||0)>(match.as||0)?"#e2e8f0":"#64748b"}}>{match.hs??0}</span>
                  <span style={{color:"#2ecc71",fontSize:14,margin:"0 4px"}}>:</span>
                  <span style={{color:(match.as||0)>(match.hs||0)?"#e2e8f0":"#64748b"}}>{match.as??0}</span>
                </div>
                <div style={{marginTop:4,fontSize:14,color:"#64748b"}}>
                  {match.events.filter(e=>e.type==="goal").map((g,i)=><div key={i}>{g.player} {g.min}'</div>)}
                </div>
              </div>
            )}
          </div>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:14,lineHeight:1}}>{match.away.emoji}</div>
            <div style={{fontSize:14,fontWeight:800,marginTop:6,color:"#e2e8f0"}}>{match.away.name}</div>
          </div>
        </div>
        <div style={{display:"flex",borderTop:"1px solid #1e3060"}}>
          {["타임라인","라인업","통계"].map((t,i)=>{
            const k=["timeline","lineup","stats"][i];
            return <button key={t} onClick={()=>setTab(k)} style={{flex:1,padding:"11px 0",border:"none",background:"transparent",cursor:"pointer",fontSize:14,fontWeight:tab===k?800:500,color:tab===k?"#2ecc71":"#64748b",borderBottom:tab===k?"2px solid #2ecc71":"2px solid transparent"}}>{t}</button>;
          })}
        </div>
      </div>

      <div style={{padding:"16px 16px 32px",flex:1}}>
        {tab==="timeline"&&(
          <div>
            {user.canRecord&&<PhaseBar/>}
            {isPre&&!user.canRecord&&<div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}><div style={{fontSize:14,marginBottom:12}}>⏳</div><div style={{fontSize:14,fontWeight:600}}>경기 시작 전입니다</div></div>}
            {!isPre&&(

            })}

        )}
        {tab==="stats"&&(
          <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:14,padding:18}}>
            {isPre?<div style={{textAlign:"center",padding:"28px 0",color:"#475569"}}><div style={{fontSize:14,marginBottom:8}}>📊</div><div>경기 시작 후 통계가 표시됩니다</div></div>:(
              <div>
                <div style={{marginBottom:18}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                    <span style={{fontWeight:900,fontSize:14,color:match.home.color}}>{match.stats.possession[0]}%</span>
                    <span style={{fontSize:14,color:"#64748b"}}>점유율</span>
                    <span style={{fontWeight:900,fontSize:14,color:match.away.color}}>{match.stats.possession[1]}%</span>
                  </div>
                  <div style={{display:"flex",height:8,borderRadius:4,overflow:"hidden"}}>
                    <div style={{flex:match.stats.possession[0],background:match.home.color,borderRadius:"4px 0 0 4px"}}/>
                    <div style={{flex:match.stats.possession[1],background:match.away.color,borderRadius:"0 4px 4px 0"}}/>
                  </div>
                </div>
                {[["슈팅","shots"],["유효슈팅","shotsOnTarget"],["코너킥","corners"],["파울","fouls"],["옐로카드","yellowCards"]].map(([label,k])=>{
                  const h=match.stats[k][0],a=match.stats[k][1],tot=h+a||1;
                  return <div key={k} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:14}}>
                      <span style={{fontWeight:700,color:"#e2e8f0"}}>{h}</span>
                      <span style={{color:"#64748b",fontSize:14}}>{label}</span>

                    <div style={{display:"flex",height:5,borderRadius:4,overflow:"hidden"}}>
                      <div style={{flex:Math.round(h/tot*100),background:"#3b82f6",borderRadius:"4px 0 0 4px"}}/>
                      <div style={{flex:Math.round(a/tot*100),background:"#e74c3c",borderRadius:"0 4px 4px 0"}}/>
                    </div>

                })}
