            )}
          </div>
        )}
        {/* 댓글 (모든 탭에서 공통 표시) */}
        <div style={{padding:"0 16px 16px"}}>
          <CommentSection storageKey={`match_${matchId}`} user={user}/>
          <PhotoSection storageKey={`match_${matchId}`} user={user}/>
        </div>
      </div>
      <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}`}</style>
    </div>
  );
}

// ── 경기 카드 ─────────────────────────────────────────────────────────────────
function MatchCard({ match, onTap, onEdit, onDelete, canManage }) {
  const isLive=match.status==="진행중";
  const st=STATUS_STYLE[match.status]||STATUS_STYLE["예정"];
  const phase=match.phase||"pre";
  const isRunning=phase==="first_half"||phase==="second_half";
  const isHalf=phase==="half_time";
  const elSec=match.elapsedSec||0;

  // halfDuration 기반 타이머 (조별 기본값 적용)
  const halfDur = match.halfDuration ?? (match.group==="B" ? 15 : 10);
  const fullDur = halfDur * 2;
  const dispSec = phase==="second_half" ? (elSec-(match.firstHalfSec||0)) : elSec;
  const rawMin  = phase==="second_half" ? Math.floor(dispSec/60)+halfDur+1 : Math.floor(elSec/60)+1;
  const capMin  = phase==="second_half" ? Math.min(fullDur,rawMin) : Math.min(halfDur,rawMin);
  const extraMin= phase==="second_half" ? (rawMin>fullDur?rawMin-fullDur:0) : (rawMin>halfDur?rawMin-halfDur:0);
  const timeStr = extraMin>0?`${capMin}+${extraMin}'${pad(dispSec%60)}`:`${capMin}'${pad(dispSec%60)}`;
  const liveStr = isRunning?`${PHASE_LABEL[phase]} · ${timeStr}`:isHalf?"HT":match.status;

  return (
    <div style={{background:"#0f1d35",border:`1px solid ${isLive?"#2ecc71":"#1e3060"}`,borderRadius:14,padding:14,marginBottom:10,boxShadow:isLive?"0 0 16px rgba(46,204,113,.12)":"none"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:14,color:"#64748b"}}>🕐 {match.time} · {match.field} · {match.group}조 · {halfDur}분</span>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          {isRunning&&<span style={{width:6,height:6,borderRadius:"50%",background:"#2ecc71",display:"inline-block",animation:"blink 1s infinite"}}/>}
          <span style={{fontSize:14,fontWeight:700,padding:"3px 9px",borderRadius:20,background:st.bg,color:st.text,fontVariantNumeric:"tabular-nums"}}>{liveStr}</span>
        </div>
      </div>
      <div onClick={onTap} style={{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14}}>{match.home.emoji}</span>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{match.home.name}</div>
            {match.events?.filter(e=>e.type==="goal"&&e.team==="home").map(e=><div key={e.id} style={{fontSize:14,color:"#64748b"}}>{e.player} {e.min}'</div>)}
          </div>
        </div>
        <div style={{textAlign:"center",padding:"0 10px"}}>
          {match.hs!==null?<div style={{fontSize:14,fontWeight:900,color:isRunning?"#2ecc71":"#e2e8f0"}}>{match.hs??0} : {match.as??0}</div>:<div style={{fontSize:14,color:"#64748b"}}>VS</div>}
        </div>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:8,justifyContent:"flex-end",textAlign:"right"}}>
          <div>
            <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{match.away.name}</div>
            {match.events?.filter(e=>e.type==="goal"&&e.team==="away").map(e=><div key={e.id} style={{fontSize:14,color:"#64748b"}}>{e.player} {e.min}'</div>)}
          </div>
          <span style={{fontSize:14}}>{match.away.emoji}</span>
        </div>
      </div>
      <div style={{marginTop:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span onClick={onTap} style={{fontSize:14,color:"#2ecc71",fontWeight:600,cursor:"pointer"}}>탭하여 상세 보기 →</span>
        {canManage&&<div style={{display:"flex",gap:6}}>
          <button onClick={e=>{e.stopPropagation();onEdit();}} style={{background:"rgba(59,130,246,.15)",border:"1px solid #3b82f640",borderRadius:8,padding:"4px 10px",color:"#60a5fa",fontSize:14,fontWeight:700,cursor:"pointer"}}>수정</button>
          <button onClick={e=>{e.stopPropagation();onDelete();}} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:8,padding:"4px 10px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>삭제</button>
        </div>}
      </div>
    </div>
  );
}

// ── 순위/결과 탭 ─────────────────────────────────────────────────────────────
function RankingTab({ matches }) {
  const [innerTab, setInnerTab] = useState("group"); // group | scorer | results
  const groups = ["A","B","C"];
  const groupInfo = {
    A:{label:"A조 · U-11 · 제1구장", color:"#e74c3c"},
    B:{label:"B조 · U-9  · 제2구장", color:"#2ecc71"},
    C:{label:"C조 · U-13 · 제2구장", color:"#8e44ad"},
  };

  const calcGroup = (grp) => {
    const tMap = {};
    matches.filter(m=>m.group===grp).forEach(m=>{
      [m.home, m.away].forEach(t=>{
        if(!tMap[t.name]) tMap[t.name]={name:t.name,emoji:t.emoji,color:t.color,p:0,w:0,d:0,l:0,gf:0,ga:0};
      });
      if(m.phase!=="finished") return;
      const h=tMap[m.home.name], a=tMap[m.away.name];
      h.p++;a.p++;
      const hs=m.hs||0, as=m.as||0;
      h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
      if(hs>as){h.w++;a.l++;}else if(hs<as){a.w++;h.l++;}else{h.d++;a.d++;}
    });
    return Object.values(tMap).sort((a,b)=>{
      const pa=a.w*3+a.d, pb=b.w*3+b.d;
      return pb-pa||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf;
    });
  };

  // 득점 집계
  const allEvents = matches.flatMap(m=>m.events.map(e=>({...e,grp:m.group,home:m.home,away:m.away})));
  const pMap={};
  allEvents.filter(e=>e.type==="goal").forEach(e=>{
    const tn=e.team==="home"?e.home.name:e.away.name;
    if(!pMap[e.player]) pMap[e.player]={name:e.player,team:tn,grp:e.grp,goals:0,assists:0};
    pMap[e.player].goals++;
    if(e.assist){
      if(!pMap[e.assist]) pMap[e.assist]={name:e.assist,team:tn,grp:e.grp,goals:0,assists:0};
      pMap[e.assist].assists++;
    }
  });
  const scorers=Object.values(pMap).filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);

  // 완료 경기
  const finished = matches.filter(m=>m.phase==="finished");

  const tabs=[{id:"group",label:"조별 순위"},{id:"scorer",label:"득점 순위"},{id:"results",label:"경기 결과"}];

  return (
    <div style={{padding:"16px 16px 80px"}}>
      <div style={{fontSize:14,fontWeight:800,marginBottom:14}}>순위 · 결과</div>
      {/* 내부 탭 */}
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setInnerTab(t.id)} style={{flex:1,background:innerTab===t.id?"rgba(46,204,113,.15)":"#0f1d35",border:`1px solid ${innerTab===t.id?"#2ecc71":"#1e3060"}`,borderRadius:9,padding:"9px 0",color:innerTab===t.id?"#2ecc71":"#64748b",fontWeight:innerTab===t.id?700:400,fontSize:14,cursor:"pointer"}}>{t.label}</button>
        ))}
      </div>

      {/* 조별 순위 */}
      {innerTab==="group"&&groups.map(grp=>{
        const teams=calcGroup(grp); const gi=groupInfo[grp];
        return (
          <div key={grp} style={{marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:gi.color,marginBottom:8,letterSpacing:1}}>{gi.label}</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 36px",padding:"7px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:3}}>
                {["","팀","경","승","무","패","득실","승점"].map(h=><div key={h}>{h}</div>)}
              </div>
              {teams.length===0
                ?<div style={{padding:"12px",textAlign:"center",fontSize:14,color:"#334155"}}>경기 대기중</div>
                :teams.map((t,i)=>{
                  const pts=t.w*3+t.d;
                  return <div key={t.name} style={{display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 36px",padding:"9px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:3}}>
                    <div style={{textAlign:"center",fontSize:14}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":<span style={{color:"#334155",fontSize:14}}>{i+1}</span>}</div>
                    <div style={{display:"flex",alignItems:"center",gap:5}}><span style={{fontSize:14}}>{t.emoji}</span><span style={{fontSize:14,fontWeight:i<2?700:500,color:i<2?"#e2e8f0":"#94a3b8"}}>{t.name}</span></div>
                    <div style={{textAlign:"center",fontSize:14,color:"#64748b"}}>{t.p}</div>
                    <div style={{textAlign:"center",fontSize:14,color:"#2ecc71",fontWeight:700}}>{t.w}</div>
                    <div style={{textAlign:"center",fontSize:14,color:"#94a3b8"}}>{t.d}</div>
                    <div style={{textAlign:"center",fontSize:14,color:"#ff4757",fontWeight:700}}>{t.l}</div>
                    <div style={{textAlign:"center",fontSize:14,color:"#e2e8f0"}}>{t.gf-t.ga>0?"+":""}{t.gf-t.ga}</div>
                    <div style={{textAlign:"center",fontSize:14,fontWeight:900,color:i===0?"#f1c40f":"#e2e8f0"}}>{pts}</div>
                  </div>;
                })
              }
            </div>
          </div>
        );
      })}

      {/* 득점 순위 */}
      {innerTab==="scorer"&&(
        <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
          {scorers.length===0
            ?<div style={{padding:"24px",textAlign:"center",fontSize:14,color:"#334155"}}>아직 기록된 득점이 없습니다</div>
            :scorers.slice(0,20).map((p,i)=>(
              <div key={p.name} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:"1px solid #1e3060"}}>
                <span style={{fontSize:14,fontWeight:800,color:i===0?"#f1c40f":i===1?"#94a3b8":i===2?"#cd7f32":"#334155",minWidth:20,textAlign:"center"}}>{i+1}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:600,color:"#e2e8f0"}}>{p.name}</div>
                  <div style={{fontSize:14,color:"#475569"}}>{p.team} · {p.grp}조</div>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <div style={{textAlign:"center"}}><div style={{fontSize:14,fontWeight:900,color:"#2ecc71"}}>{p.goals}</div><div style={{fontSize:14,color:"#475569"}}>골</div></div>
                  <div style={{textAlign:"center"}}><div style={{fontSize:14,fontWeight:700,color:"#3498db"}}>{p.assists}</div><div style={{fontSize:14,color:"#475569"}}>도움</div></div>
                </div>
              </div>
            ))
          }
        </div>
      )}

      {/* 경기 결과 */}
      {innerTab==="results"&&(
        <div>
          {finished.length===0
            ?<div style={{textAlign:"center",padding:"40px 0",color:"#334155"}}>
              <div style={{fontSize:18,marginBottom:10}}>🏆</div>
              <div style={{fontSize:14}}>아직 완료된 경기가 없습니다</div>
            </div>
            :finished.sort((a,b)=>a.id-b.id).map(m=>(
              <div key={m.id} style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,padding:14,marginBottom:8}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <span style={{fontSize:14,fontWeight:700,background:`${groupInfo[m.group]?.color}20`,color:groupInfo[m.group]?.color,padding:"2px 7px",borderRadius:10}}>{m.group}조</span>
                  <span style={{fontSize:14,color:"#475569"}}>{m.date} {m.time} · {m.field}</span>
                  <span style={{marginLeft:"auto",fontSize:14,background:"#1e293b",color:"#94a3b8",padding:"2px 8px",borderRadius:10}}>종료</span>
                </div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <div style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:14}}>{m.home.emoji}</div>
                    <div style={{fontSize:14,fontWeight:700,color:(m.hs||0)>(m.as||0)?m.home.color:"#94a3b8",marginTop:4}}>{m.home.name}</div>
                  </div>
                  <div style={{textAlign:"center",padding:"0 12px"}}>
                    <div style={{fontSize:18,fontWeight:900,letterSpacing:4}}>
                      <span style={{color:(m.hs||0)>(m.as||0)?"#e2e8f0":"#64748b"}}>{m.hs||0}</span>
                      <span style={{color:"#334155",fontSize:14,margin:"0 4px"}}>:</span>
                      <span style={{color:(m.as||0)>(m.hs||0)?"#e2e8f0":"#64748b"}}>{m.as||0}</span>
                    </div>
                    <div style={{fontSize:14,color:"#475569",marginTop:2}}>FT</div>
                  </div>
                  <div style={{flex:1,textAlign:"center"}}>
                    <div style={{fontSize:14}}>{m.away.emoji}</div>
                    <div style={{fontSize:14,fontWeight:700,color:(m.as||0)>(m.hs||0)?m.away.color:"#94a3b8",marginTop:4}}>{m.away.name}</div>
                  </div>
                </div>
                {m.events?.filter(e=>e.type==="goal").length>0&&(
                  <div style={{marginTop:10,paddingTop:8,borderTop:"1px solid #1e3060"}}>
                    {m.events.filter(e=>e.type==="goal").map(e=>(
                      <div key={e.id} style={{fontSize:14,color:"#64748b",marginBottom:3}}>
                        ⚽ {e.player}{e.assist?` 🤝${e.assist}`:""} {e.min}' · {e.team==="home"?m.home.name:m.away.name}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
          }
        </div>
      )}
    </div>
  );
}

// ── 응원 탭 (전체 경기 댓글 통합 + 직접 입력) ────────────────────────────────
// ── 영광/응원 공통 입력 컴포넌트 ──────────────────────────────────────────────
function CheerGloryInput({ user, targetMatchId, targetMatch, onSent, isGlory }) {
  const [text,      setText]      = useState("");
  const [showEmoji, setShowEmoji] = useState(false);
  const [sending,   setSending]   = useState(false);
  const [err,       setErr]       = useState("");
  const pad2 = n=>String(n).padStart(2,"0");

  const GLORY_EMOJIS = [
    "🙏","✝️","☦️","🕊️","⭐","🌟","💫","✨","🌈","☀️",
    "❤️","💛","🤍","💙","💚","💜","🧡","❤️‍🔥","🫶","🙌",
    "🎵","🎶","📖","🕯️","🌸","🌺","🌻","🌹","🍃","🌿",
  ];

  const submit = async () => {
    if(!text.trim()||sending) return;
    if(!targetMatchId){ setErr("경기를 선택해주세요."); return; }
    setSending(true); setErr("");
    const now = new Date();
    const ts = `${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const key = `match_${targetMatchId}`;
    const newC = {
      fbId:"tmp_"+Date.now(), storageKey:key,
      author:user.name, role:user.label||"사용자", color:user.color||"#f1c40f",
      text:text.trim(), imgUrl:"", displayTime:ts, isGlory:true,
      matchId:targetMatchId,
      matchHome:targetMatch?.home.name||"", matchAway:targetMatch?.away.name||"",
      homeEmoji:targetMatch?.home.emoji||"", awayEmoji:targetMatch?.away.emoji||""
    };
    onSent(newC);
    setText(""); setShowEmoji(false);
    try {
      await FB.addComment({storageKey:key, author:user.name, role:user.label||"사용자", color:user.color||"#f1c40f", text:newC.text, imgUrl:"", displayTime:ts, isGlory:true});
    } catch(e) { setErr("전송 실패. 다시 시도해주세요."); }
    finally { setSending(false); }
  };

  return (
    <div>
      {showEmoji&&(
        <div style={{marginBottom:8,background:"#0f172a",borderRadius:10,padding:"8px 10px",border:"1px solid #f1c40f30"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(10,1fr)",gap:4}}>
            {GLORY_EMOJIS.map(e=>(
              <button key={e} onClick={()=>{setText(t=>t+e); setShowEmoji(false);}}
                style={{background:"transparent",border:"none",borderRadius:6,padding:"4px 0",fontSize:19,cursor:"pointer",textAlign:"center"}}>
                {e}
              </button>
            ))}
          </div>
        </div>
      )}
      {err&&<div style={{fontSize:13,color:"#ff4757",marginBottom:5}}>⚠ {err}</div>}
      <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
        <div style={{flex:1}}>
          <textarea value={text} onChange={e=>setText(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}}}
            placeholder="하나님께 영광 돌리는 메시지를 남겨주세요 🙏"
            style={{width:"100%",background:"#0f172a",border:"1px solid #f1c40f40",borderRadius:8,padding:"9px 11px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit",resize:"none",height:48,lineHeight:1.5}}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
          <button onClick={()=>setShowEmoji(v=>!v)}
            style={{width:34,height:20,borderRadius:6,background:showEmoji?"rgba(241,196,15,.2)":"#1e293b",border:`1px solid ${showEmoji?"#f1c40f":"#334155"}`,color:showEmoji?"#f1c40f":"#64748b",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
            🙏
          </button>
          <button onClick={submit} disabled={!text.trim()||sending}
            style={{width:34,height:26,borderRadius:6,background:text.trim()?"linear-gradient(135deg,#f1c40f,#d4ac0d)":"#1e293b",border:"none",color:text.trim()?"#000":"#334155",fontSize:15,cursor:text.trim()?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}}>
            {sending?"⏳":"↑"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CheerTab({ matches, user }) {
  const [allComments, setAllComments] = useState([]);
  const [loading,     setLoading]     = useState(true);
  const [selMatch,    setSelMatch]    = useState("all");
  const [innerTab,    setInnerTab]    = useState("glory"); // "glory" | "cheer" | "photo"

  // 응원 입력 상태
  const [cheerText,    setCheerText]    = useState("");
  const [showEmoji,    setShowEmoji]    = useState(false);
  const [sending,      setSending]      = useState(false);
  const [sendErr,      setSendErr]      = useState("");
  // 포토 입력 상태
  const [photoCaption, setPhotoCaption] = useState("");
  const [uploading,    setUploading]    = useState(false);
  const [uploadErr,    setUploadErr]    = useState("");
  const fileRef = useRef(null);
  const pad2 = n=>String(n).padStart(2,"0");

  const CHEER_EMOJIS = [
    // 축구
    "⚽","🥅","🏃","🧤","🥇","🏆","🎯","📣","🎉","🎊",
    // 응원
    "🔥","💪","👏","🙌","🤜","🤛","✊","👊","🫶","❤️",
    // 표정
    "😍","🤩","😎","🥹","😭","😱","🤯","🥳","😤","💪",
    // 기타
    "⭐","🌟","💫","✨","💥","👑","🦅","🐼","💚","💛",
    "🩵","❤️‍🔥","🫡","🙏","👍","🫰","💯","🆒","🔝","📸",
  ];

  useEffect(()=>{
    const unsubs = [];
    const commentMap = {};
    let loaded = 0;
    const total = matches.length;
    if(total===0){ setLoading(false); return; }
    matches.forEach(m=>{
      const key = `match_${m.id}`;
      const unsub = FB.watchComments(key, (list)=>{
        commentMap[key] = list.map(c=>({...c, matchId:m.id, matchHome:m.home.name, matchAway:m.away.name, homeEmoji:m.home.emoji, awayEmoji:m.away.emoji}));
        const merged = Object.values(commentMap).flat();
        merged.sort((a,b)=>(a.displayTime||"").localeCompare(b.displayTime||""));
        setAllComments(merged);
        loaded++;
        if(loaded>=total) setLoading(false);
      });
      unsubs.push(unsub);
    });
    return ()=>unsubs.forEach(u=>u());
  },[matches.length]);

  // 응원 대상 경기 (선택된 경기 or 가장 최근 경기)
  const targetMatchId = selMatch==="all"
    ? (matches.find(m=>m.phase==="first_half"||m.phase==="second_half")?.id || matches[0]?.id)
    : Number(selMatch);
  const targetMatch = matches.find(m=>m.id===targetMatchId);

  // 응원 댓글 전송
  const submitCheer = async () => {
    if(!cheerText.trim()||sending) return;
    if(!targetMatchId){ setSendErr("경기를 선택해주세요."); return; }
    setSending(true); setSendErr("");
    const now = new Date();
    const ts = `${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const key = `match_${targetMatchId}`;
    const newC = {fbId:"tmp_"+Date.now(), storageKey:key, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:cheerText.trim(), imgUrl:"", displayTime:ts, matchId:targetMatchId, matchHome:targetMatch?.home.name||"", matchAway:targetMatch?.away.name||"", homeEmoji:targetMatch?.home.emoji||"", awayEmoji:targetMatch?.away.emoji||""};
    setAllComments(prev=>[...prev,newC]);
    setCheerText(""); setShowEmoji(false);
    try { await FB.addComment({storageKey:key, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:newC.text, imgUrl:"", displayTime:ts}); }
    catch(e){ setAllComments(prev=>prev.filter(c=>c.fbId!==newC.fbId)); setSendErr("전송 실패. 다시 시도해주세요."); }
    finally{ setSending(false); }
  };

  // 포토 업로드
  const handlePhoto = async (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    if(!targetMatchId){ setUploadErr("경기를 먼저 선택해주세요."); return; }
    setUploading(true); setUploadErr("");
    try {
      const url = await uploadImage(file);
      const now = new Date();
      const ts = `${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      const key = `match_${targetMatchId}`;
      await FB.addComment({storageKey:key, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:photoCaption, imgUrl:url, displayTime:ts});
      setPhotoCaption("");
    } catch(err){ setUploadErr(err.message||"업로드 실패"); }
    finally{ setUploading(false); e.target.value=""; }
  };

  const byMatch = selMatch==="all" ? allComments : allComments.filter(c=>c.matchId===Number(selMatch));
  const cheerList = byMatch.filter(c=>!c.imgUrl);
  const photoList = byMatch.filter(c=>!!c.imgUrl);
  const gloryList   = byMatch.filter(c=>c.isGlory);
  const displayList = innerTab==="glory" ? gloryList : photoList;
  const matchesWithComments = matches.filter(m=>allComments.some(c=>c.matchId===m.id));

  const CommentItem = ({c}) => {
    const m = matches.find(m=>m.id===c.matchId);
    return (
      <div style={{padding:"10px 14px",borderBottom:"1px solid #0f172a",display:"flex",gap:8}}>
        <div style={{width:28,height:28,borderRadius:7,background:`${c.color||"#3498db"}20`,border:`1px solid ${c.color||"#3498db"}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>
          {c.role==="감독/코치"?"🎽":c.role==="선수"?"⚽":c.role==="학부모"?"👨‍👩‍👧":c.role==="심판"?"🟨":"💬"}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3,flexWrap:"wrap"}}>
            <span style={{fontSize:14,fontWeight:700,color:c.color||"#60a5fa"}}>{c.author}</span>
            <span style={{fontSize:12,color:"#334155",background:`${c.color||"#3498db"}15`,padding:"1px 5px",borderRadius:8}}>{c.role}</span>
            {m&&<span style={{fontSize:12,color:"#475569",background:"#0f172a",padding:"1px 6px",borderRadius:8}}>{c.homeEmoji}{c.awayEmoji} {c.matchHome}vs{c.matchAway}</span>}
            <span style={{fontSize:12,color:"#334155",marginLeft:"auto"}}>{c.displayTime}</span>
          </div>
          {c.text&&<div style={{fontSize:14,color:"#cbd5e1",lineHeight:1.6,wordBreak:"break-word"}}>{c.text}</div>}
          {c.imgUrl&&<img src={c.imgUrl} alt="사진" onError={e=>{e.target.style.display="none";}} style={{marginTop:6,maxWidth:"100%",maxHeight:220,borderRadius:8,objectFit:"cover",display:"block"}}/>}
        </div>
      </div>
    );
  };

  return (
    <div style={{paddingBottom:80}}>
      {/* 탭 헤더 */}
      <div style={{position:"sticky",top:60,zIndex:10,background:"#0a0e1a",padding:"12px 16px 0",borderBottom:"1px solid #1e3060"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:15,fontWeight:800}}>🙏 영광 · 포토</div>
          <div style={{display:"flex",background:"#0f1d35",borderRadius:20,padding:2,border:"1px solid #1e3060"}}>
            <button onClick={()=>setInnerTab("glory")} style={{padding:"5px 14px",borderRadius:18,border:"none",background:innerTab==="glory"?"#f1c40f":"transparent",color:innerTab==="glory"?"#000":"#64748b",fontSize:13,fontWeight:700,cursor:"pointer"}}>
              🙏 영광{innerTab==="glory"?` (${gloryList.length})`:""}
            </button>
            <button onClick={()=>setInnerTab("photo")} style={{padding:"5px 14px",borderRadius:18,border:"none",background:innerTab==="photo"?"#3498db":"transparent",color:innerTab==="photo"?"#fff":"#64748b",fontSize:13,fontWeight:700,cursor:"pointer"}}>
              📷 포토{innerTab==="photo"?` (${photoList.length})`:""}
            </button>
          </div>
        </div>

        {/* 경기 필터 */}
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,scrollbarWidth:"none"}}>
          <button onClick={()=>setSelMatch("all")} style={{flexShrink:0,background:selMatch==="all"?"rgba(46,204,113,.15)":"transparent",border:`1px solid ${selMatch==="all"?"#2ecc71":"#1e3060"}`,borderRadius:20,padding:"4px 12px",color:selMatch==="all"?"#2ecc71":"#64748b",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
            전체
          </button>
          {matches.map(m=>(
            <button key={m.id} onClick={()=>setSelMatch(String(m.id))} style={{flexShrink:0,background:selMatch===String(m.id)?`${m.home.color}20`:"transparent",border:`1px solid ${selMatch===String(m.id)?m.home.color:"#1e3060"}`,borderRadius:20,padding:"4px 11px",color:selMatch===String(m.id)?m.home.color:"#64748b",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>
              {m.home.emoji}{m.away.emoji} <span style={{fontSize:12}}>{m.group}조</span>
            </button>
          ))}
        </div>
      </div>

      {/* 입력 영역 */}
      <div style={{padding:"12px 16px",background:"#0d1425",borderBottom:"1px solid #1e3060"}}>
        {/* 대상 경기 표시 */}
        {targetMatch&&(
          <div style={{fontSize:13,color:"#475569",marginBottom:8,display:"flex",alignItems:"center",gap:4}}>
            <span>→</span>
            <span style={{color:"#94a3b8"}}>{targetMatch.home.emoji}{targetMatch.away.emoji} {targetMatch.home.name} vs {targetMatch.away.name} {selMatch==="all"?"(현재 경기)":""}</span>
          </div>
        )}

        {/* 영광 탭 입력 */}
        {innerTab==="glory"&&(
          <div>
            <div style={{fontSize:13,color:"#f1c40f80",marginBottom:8,textAlign:"center"}}>🙏 하나님께 영광 돌리는 메시지를 남겨주세요</div>
            <CheerGloryInput user={user} targetMatchId={targetMatchId} targetMatch={targetMatch} onSent={(newC)=>setAllComments(prev=>[...prev,newC])} isGlory={true}/>
          </div>
        )}

        {/* 포토 탭 입력 */}
        {innerTab==="photo"&&(
          <>
            {uploadErr&&<div style={{fontSize:13,color:"#ff4757",marginBottom:5}}>⚠ {uploadErr}</div>}
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              <input value={photoCaption} onChange={e=>setPhotoCaption(e.target.value)} placeholder="사진 설명 (선택)"
                style={{flex:1,background:"#0f172a",border:"1px solid #1e3060",borderRadius:8,padding:"9px 11px",color:"#e2e8f0",fontSize:14,outline:"none",fontFamily:"inherit"}}/>
              <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{display:"none"}}/>
              <button onClick={()=>fileRef.current?.click()} disabled={uploading}
                style={{padding:"8px 14px",background:uploading?"rgba(241,196,15,.15)":"rgba(52,152,219,.2)",border:"1px solid #3498db50",borderRadius:8,color:uploading?"#f1c40f":"#3498db",fontSize:13,fontWeight:700,cursor:uploading?"wait":"pointer",whiteSpace:"nowrap",flexShrink:0}}>
                {uploading?"⏳ 올리는 중...":"📷 사진 추가"}
              </button>
            </div>
          </>
        )}
      </div>

      {/* 목록 */}
      <div style={{padding:"0 16px"}}>
        {loading
          ?<div style={{textAlign:"center",padding:"40px 0",color:"#475569",fontSize:14}}>⏳ 불러오는 중...</div>
          :displayList.length===0
            ?<div style={{textAlign:"center",padding:"32px 0",color:"#334155"}}>
              <div style={{fontSize:30,marginBottom:8}}>{innerTab==="glory"?"🙏":"📷"}</div>
              <div style={{fontSize:14}}>{innerTab==="glory"?"첫 번째 영광의 메시지를 남겨주세요!":"첫 사진을 공유해보세요!"}</div>
            </div>
            :innerTab==="photo"
              ?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,paddingTop:12}}>
                {displayList.map(c=>(
                  <div key={c.fbId||c.id} style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:10,overflow:"hidden"}}>
                    <img src={c.imgUrl} alt="사진" onError={e=>{e.target.style.display="none";}} style={{width:"100%",aspectRatio:"1",objectFit:"cover",display:"block"}}/>
                    <div style={{padding:"6px 8px"}}>
                      <div style={{fontSize:12,fontWeight:700,color:c.color||"#60a5fa"}}>{c.author}</div>
                      {c.text&&<div style={{fontSize:12,color:"#94a3b8",marginTop:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{c.text}</div>}
                      <div style={{fontSize:11,color:"#334155",marginTop:2}}>{c.displayTime}</div>
                    </div>
                  </div>
                ))}
              </div>
              :innerTab==="glory"
                ?<div style={{paddingTop:12,display:"flex",flexDirection:"column",gap:8}}>
                  {displayList.map(c=>(
                    <div key={c.fbId||c.id} style={{background:"linear-gradient(135deg,#0f172a,#0a1428)",border:"1px solid #f1c40f30",borderRadius:14,padding:"14px 16px",position:"relative",overflow:"hidden"}}>
                      <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,#f1c40f,#e67e22,#f1c40f)",opacity:0.6}}/>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <div style={{width:28,height:28,borderRadius:"50%",background:"rgba(241,196,15,.15)",border:"1px solid #f1c40f40",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🙏</div>
                        <div>
                          <span style={{fontSize:14,fontWeight:700,color:"#f1c40f"}}>{c.author}</span>
                          <span style={{fontSize:12,color:"#64748b",marginLeft:6}}>{c.role}</span>
                        </div>
                        <span style={{fontSize:12,color:"#334155",marginLeft:"auto"}}>{c.displayTime}</span>
                      </div>
                      <div style={{fontSize:15,color:"#e2e8f0",lineHeight:1.7,wordBreak:"break-word",paddingLeft:36}}>{c.text}</div>
                    </div>
                  ))}
                </div>
                :<div style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:14,overflow:"hidden",marginTop:12}}>
                  {displayList.map(c=><CommentItem key={c.fbId||c.id} c={c}/>)}
                </div>
        }
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [sel, setSel]   = useState(null);
  const [name, setName] = useState("");
  const [err, setErr]   = useState("");

  const handle = () => {
    if(!sel)         { setErr("역할을 선택해주세요."); return; }
    if(!name.trim()) { setErr("이름을 입력해주세요."); return; }
    onLogin({...sel, name:name.trim()});
  };

  return (
    <div style={{fontFamily:"'Noto Sans KR',sans-serif",background:"#0a0e1a",minHeight:"100vh",color:"#e8eaf0",maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#0d1b3e,#1a2a5e)",padding:"32px 20px 24px",textAlign:"center"}}>
        <div style={{width:64,height:64,borderRadius:18,margin:"0 auto 14px",background:"linear-gradient(135deg,#2ecc71,#27ae60)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,boxShadow:"0 8px 24px rgba(46,204,113,.3)"}}>⚽</div>
        <div style={{fontSize:14,fontWeight:900}}>26년 상반기 은하수대회</div>
        <div style={{fontSize:14,color:"#7b9bc8",marginTop:4}}>2026 · 5월 30일 · U9/U11/U13</div>
      </div>
      <div style={{padding:"24px 20px",flex:1}}>
        <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:12,letterSpacing:1}}>역할 선택</div>
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:18}}>
          {ROLES.map(r=>(
            <button key={r.id} onClick={()=>{setSel(r);setErr("");}} style={{display:"flex",alignItems:"center",gap:12,background:sel?.id===r.id?`${r.color}12`:"#0f1d35",border:`1px solid ${sel?.id===r.id?r.color:"#1e3060"}`,borderRadius:12,padding:"11px 14px",cursor:"pointer",textAlign:"left"}}>
              <div style={{width:36,height:36,borderRadius:9,background:sel?.id===r.id?`${r.color}20`:"#1a2a4a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{r.icon}</div>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:sel?.id===r.id?r.color:"#e2e8f0"}}>{r.label}</div><div style={{fontSize:14,color:"#64748b",marginTop:1}}>{r.desc}</div></div>
              {sel?.id===r.id&&<div style={{width:20,height:20,borderRadius:"50%",background:r.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#000",fontWeight:900}}>✓</div>}
            </button>
          ))}
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:6}}>이름 *</div>
          <Inp value={name} onChange={v=>{setName(v);setErr("");}} placeholder="이름을 입력하세요"/>
        </div>
        {err&&<div style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:14,color:"#ff4757"}}>⚠ {err}</div>}
        <button onClick={handle} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:12,padding:"15px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 4px 16px rgba(46,204,113,.3)"}}>
          입장하기 →
        </button>
      </div>
      <style>{`input::placeholder{color:#2a3a5a;}`}</style>
    </div>
  );
}

// ── 기록 통계 탭 (기록 담당자 전용) ──────────────────────────────────────────
function StatsTab({ matches, teams }) {
  const [innerTab, setInnerTab] = useState("group"); // group | player | summary

  // ── 공통 집계 ──────────────────────────────────────────────────────────────
  const allEvents = matches.flatMap(m => m.events.map(e => ({...e, matchGroup:m.group||"?", home:m.home, away:m.away})));
  const goals   = allEvents.filter(e => e.type==="goal");
  const yellows = allEvents.filter(e => e.type==="yellow");
  const reds    = allEvents.filter(e => e.type==="red");
  const finished = matches.filter(m => m.phase==="finished").length;

  // ── 팀별 집계 (조 정보 포함) ───────────────────────────────────────────────
  const tMap = {};
  matches.forEach(m => {
    const grp = m.group || "미배정";
    ["home","away"].forEach(side => {
      const t = m[side];
      const key = t.name;
      if(!tMap[key]) tMap[key] = {
        name:t.name, emoji:t.emoji, color:t.color, group:grp,
        played:0, wins:0, draws:0, losses:0,
        gf:0, ga:0, goals:0, assists:0, yellows:0, reds:0,
      };
      if(!tMap[key].group || tMap[key].group==="미배정") tMap[key].group = grp;
      if(m.phase==="finished") {
        tMap[key].played++;
        const mine   = side==="home"?(m.hs||0):(m.as||0);
        const theirs = side==="home"?(m.as||0):(m.hs||0);
        tMap[key].gf += mine; tMap[key].ga += theirs;
        if(mine>theirs)       tMap[key].wins++;
        else if(mine===theirs) tMap[key].draws++;
        else                   tMap[key].losses++;
      }
    });
    m.events.forEach(e => {
      const tName = e.team==="home" ? m.home.name : m.away.name;
      if(!tMap[tName]) return;
      if(e.type==="goal")   { tMap[tName].goals++;  if(e.assist) tMap[tName].assists++; }
      if(e.type==="yellow")   tMap[tName].yellows++;
      if(e.type==="red")      tMap[tName].reds++;
    });
  });

  // 팀 데이터에 조 배정 정보 보완 (teams prop 활용)
  teams.forEach(t => {
    if(tMap[t.name]) tMap[t.name].group = t.group;
  });

  const pts = t => t.wins*3 + t.draws;
  const gd  = t => t.gf - t.ga;
  const allTeams = Object.values(tMap);
  const groups = [...new Set(allTeams.map(t=>t.group).filter(Boolean))].sort();

  const sortTeams = list => [...list].sort((a,b) =>
    pts(b)-pts(a) || gd(b)-gd(a) || b.gf-a.gf
  );

  // ── 선수별 집계 ────────────────────────────────────────────────────────────
  const pMap = {};
  goals.forEach(e => {
    const teamName = e.team==="home" ? e.home.name : e.away.name;
    const grp = tMap[teamName]?.group || "?";
    if(!pMap[e.player]) pMap[e.player] = {name:e.player, team:teamName, group:grp, goals:0, assists:0, yellows:0, reds:0};
    pMap[e.player].goals++;
    if(e.assist) {
      if(!pMap[e.assist]) pMap[e.assist] = {name:e.assist, team:teamName, group:grp, goals:0, assists:0, yellows:0, reds:0};
      pMap[e.assist].assists++;
    }
  });
  yellows.forEach(e => {
    const tName = e.team==="home" ? e.home.name : e.away.name;
    if(!pMap[e.player]) pMap[e.player] = {name:e.player, team:tName, group:tMap[tName]?.group||"?", goals:0, assists:0, yellows:0, reds:0};
    pMap[e.player].yellows++;
  });
  reds.forEach(e => {
    const tName = e.team==="home" ? e.home.name : e.away.name;
    if(!pMap[e.player]) pMap[e.player] = {name:e.player, team:tName, group:tMap[tName]?.group||"?", goals:0, assists:0, yellows:0, reds:0};
    pMap[e.player].reds++;
  });

  const scorers   = Object.values(pMap).filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);
  const assisters = Object.values(pMap).filter(p=>p.assists>0).sort((a,b)=>b.assists-a.assists||b.goals-a.goals);
  const bookers   = Object.values(pMap).filter(p=>p.yellows>0||p.reds>0).sort((a,b)=>b.reds-a.reds||b.yellows-a.yellows);

  // ── 공용 UI ────────────────────────────────────────────────────────────────
  const KpiCard = ({icon,label,value,sub,color="#2ecc71"}) => (
    <div style={{background:"#0a1428",border:"1px solid #1e3060",borderRadius:12,padding:12,textAlign:"center"}}>
      <div style={{fontSize:14,marginBottom:3}}>{icon}</div>
      <div style={{fontSize:14,fontWeight:900,color}}>{value}</div>
      <div style={{fontSize:14,fontWeight:700,color:"#94a3b8",marginTop:2}}>{label}</div>
      {sub&&<div style={{fontSize:14,color:"#475569",marginTop:1}}>{sub}</div>}
    </div>
  );

  const RankMedal = ({i}) => (
    <div style={{fontSize:14,fontWeight:800,
      color:i===0?"#f1c40f":i===1?"#94a3b8":i===2?"#cd7f32":"#475569",
      textAlign:"center",minWidth:20}}>{i+1}</div>
  );

  const innerTabs = [
    {id:"group",   label:"조별 순위", icon:"🏆"},
    {id:"player",  label:"개인 순위", icon:"⚽"},
    {id:"summary", label:"대회 종합", icon:"📊"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {/* 상단 헤더 */}
      <div style={{padding:"16px 16px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <div style={{fontSize:14,fontWeight:800}}>📊 기록 통계</div>
          <div style={{background:"rgba(241,196,15,.15)",border:"1px solid #f1c40f40",borderRadius:20,padding:"2px 9px",fontSize:14,fontWeight:800,color:"#f1c40f"}}>기록 담당자 전용</div>
        </div>
        {/* 내부 탭 */}
        <div style={{display:"flex",background:"#0f1d35",borderRadius:12,padding:3,gap:3,marginBottom:16}}>
          {innerTabs.map(t=>(
            <button key={t.id} onClick={()=>setInnerTab(t.id)} style={{
              flex:1, border:"none", borderRadius:9, padding:"8px 4px",
              background:innerTab===t.id?"#1e3060":"transparent",
              color:innerTab===t.id?"#2ecc71":"#64748b",
              fontWeight:innerTab===t.id?800:500, fontSize:14, cursor:"pointer",
            }}>{t.icon} {t.label}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"0 16px 32px",overflowY:"auto",flex:1}}>

        {/* ── 조별 순위 ── */}
        {innerTab==="group" && (
          <div>
            {groups.length===0 && (
              <div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}>
                <div style={{fontSize:14,marginBottom:12}}>🏆</div>
                <div>조별 경기 데이터가 없습니다</div>
                <div style={{fontSize:14,marginTop:6,color:"#334155"}}>경기 개설 시 조(group) 정보를 입력해주세요</div>
              </div>
            )}
            {groups.map(grp=>{
              const gt = sortTeams(allTeams.filter(t=>t.group===grp));
              return (
                <div key={grp} style={{marginBottom:20}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                    <div style={{width:26,height:26,borderRadius:7,background:"rgba(46,204,113,.2)",border:"1px solid #2ecc7140",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:800,color:"#2ecc71"}}>{grp}</div>
                    <div style={{fontSize:14,fontWeight:800,color:"#2ecc71",letterSpacing:1}}>조</div>
                    <div style={{fontSize:14,color:"#475569",marginLeft:4}}>{gt.length}팀</div>
                  </div>
                  <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
                    {/* 헤더 */}
                    <div style={{display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 28px 32px",padding:"8px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:3}}>
                      {["","팀","경","승","무","패","득","실","승점"].map((h,i)=>(
                        <div key={i} style={{textAlign:i===1?"left":"center"}}>{h}</div>
                      ))}
                    </div>
                    {gt.map((t,i)=>(
                      <div key={t.name} style={{
                        display:"grid",gridTemplateColumns:"20px 1fr 28px 28px 28px 28px 28px 28px 32px",
                        padding:"9px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:3,
                        background:i<2?"rgba(46,204,113,.03)":"transparent",
                      }}>
                        {/* 순위 */}
                        <div style={{textAlign:"center"}}>
                          {i===0?<span style={{fontSize:14}}>🥇</span>
                          :i===1?<span style={{fontSize:14}}>🥈</span>
                          :i===2?<span style={{fontSize:14}}>🥉</span>
                          :<span style={{fontSize:14,color:"#475569"}}>{i+1}</span>}
                        </div>
                        {/* 팀명 */}
                        <div style={{display:"flex",alignItems:"center",gap:5}}>
                          <span style={{fontSize:14}}>{t.emoji}</span>
                          <div>
                            <div style={{fontSize:14,fontWeight:i<2?800:600,color:i<2?"#e2e8f0":"#94a3b8"}}>{t.name}</div>
                            {i<2&&<div style={{fontSize:8,color:"#2ecc71"}}>조 통과권</div>}
                          </div>
                        </div>
                        <div style={{fontSize:14,textAlign:"center",color:"#64748b"}}>{t.played}</div>
                        <div style={{fontSize:14,textAlign:"center",color:"#2ecc71",fontWeight:700}}>{t.wins}</div>
                        <div style={{fontSize:14,textAlign:"center",color:"#94a3b8"}}>{t.draws}</div>
                        <div style={{fontSize:14,textAlign:"center",color:"#ff4757",fontWeight:700}}>{t.losses}</div>
                        <div style={{fontSize:14,textAlign:"center",color:"#e2e8f0"}}>{t.gf}</div>
                        <div style={{fontSize:14,textAlign:"center",color:"#e2e8f0"}}>{t.ga}</div>
                        <div style={{fontSize:14,textAlign:"center",fontWeight:900,color:i===0?"#f1c40f":"#e2e8f0"}}>{pts(t)}</div>
                      </div>
                    ))}
                    {/* 득실차 범례 */}
                    <div style={{padding:"6px 12px",background:"#0a1428",display:"flex",gap:12}}>
                      <span style={{fontSize:14,color:"#475569"}}>경=경기 수</span>
                      <span style={{fontSize:14,color:"#475569"}}>득=득점</span>
                      <span style={{fontSize:14,color:"#475569"}}>실=실점</span>
                      <span style={{fontSize:14,color:"#475569"}}>승점 = 승×3 + 무×1</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* ── 개인 순위 ── */}
        {innerTab==="player" && (
          <div>
            {/* 득점 순위 */}
            <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:8,letterSpacing:1}}>⚽ 득점 순위</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden",marginBottom:18}}>
              <div style={{display:"grid",gridTemplateColumns:"24px 1fr 44px 44px",padding:"8px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:4}}>
                {["#","선수 / 팀·조","⚽골","🤝도움"].map(h=><div key={h} style={{textAlign:h==="선수 / 팀·조"?"left":"center"}}>{h}</div>)}
              </div>
              {scorers.length===0
                ?<div style={{textAlign:"center",padding:"20px 0",color:"#475569",fontSize:14}}>득점 기록 없음</div>
                :scorers.map((p,i)=>(
                  <div key={p.name} style={{display:"grid",gridTemplateColumns:"24px 1fr 44px 44px",padding:"10px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:4}}>
                    <RankMedal i={i}/>
                    <div>
                      <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{p.name}</div>
                      <div style={{fontSize:14,color:"#475569"}}>{p.team} · {p.group}조</div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#2ecc71"}}>{p.goals}</span>
                      <span style={{fontSize:14,color:"#475569",marginLeft:2}}>골</span>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#3498db"}}>{p.assists}</span>
                      <span style={{fontSize:14,color:"#475569",marginLeft:2}}>도</span>
                    </div>
                  </div>
                ))
              }
            </div>

            {/* 어시스트 순위 */}
            <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:8,letterSpacing:1}}>🤝 어시스트 순위</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden",marginBottom:18}}>
              <div style={{display:"grid",gridTemplateColumns:"24px 1fr 44px 44px",padding:"8px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:4}}>
                {["#","선수 / 팀·조","🤝도움","⚽골"].map(h=><div key={h} style={{textAlign:h==="선수 / 팀·조"?"left":"center"}}>{h}</div>)}
              </div>
              {assisters.length===0
                ?<div style={{textAlign:"center",padding:"20px 0",color:"#475569",fontSize:14}}>어시스트 기록 없음</div>
                :assisters.map((p,i)=>(
                  <div key={p.name} style={{display:"grid",gridTemplateColumns:"24px 1fr 44px 44px",padding:"10px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:4}}>
                    <RankMedal i={i}/>
                    <div>
                      <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{p.name}</div>
                      <div style={{fontSize:14,color:"#475569"}}>{p.team} · {p.group}조</div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#3498db"}}>{p.assists}</span>
                      <span style={{fontSize:14,color:"#475569",marginLeft:2}}>도</span>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#2ecc71"}}>{p.goals}</span>
                      <span style={{fontSize:14,color:"#475569",marginLeft:2}}>골</span>
                    </div>
                  </div>
                ))
              }
            </div>

            {/* 경고 순위 */}
            <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:8,letterSpacing:1}}>🟨 경고·퇴장 순위</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"24px 1fr 40px 40px",padding:"8px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:4}}>
                {["#","선수 / 팀·조","🟨옐로","🟥레드"].map(h=><div key={h} style={{textAlign:h==="선수 / 팀·조"?"left":"center"}}>{h}</div>)}
              </div>
              {bookers.length===0
                ?<div style={{textAlign:"center",padding:"20px 0",color:"#475569",fontSize:14}}>카드 기록 없음</div>
                :bookers.map((p,i)=>(
                  <div key={p.name} style={{display:"grid",gridTemplateColumns:"24px 1fr 40px 40px",padding:"10px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:4}}>
                    <div style={{fontSize:14,color:"#475569",textAlign:"center"}}>{i+1}</div>
                    <div>
                      <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{p.name}</div>
                      <div style={{fontSize:14,color:"#475569"}}>{p.team} · {p.group}조</div>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#f1c40f"}}>{p.yellows}</span>
                    </div>
                    <div style={{textAlign:"center"}}>
                      <span style={{fontSize:14,fontWeight:900,color:"#e74c3c"}}>{p.reds}</span>
                    </div>
                  </div>
                ))
              }
            </div>
          </div>
        )}

        {/* ── 대회 종합 ── */}
        {innerTab==="summary" && (
          <div>
            {/* KPI */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
              <KpiCard icon="🏆" label="완료 경기" value={finished} sub={`전체 ${matches.length}경기`}/>
              <KpiCard icon="⚽" label="총 득점" value={goals.length} color="#e74c3c" sub={`경기당 ${finished?((goals.length/finished).toFixed(1)):0}골`}/>
              <KpiCard icon="🤝" label="총 어시스트" value={goals.filter(e=>e.assist).length} color="#3498db"/>
              <KpiCard icon="🟨" label="옐로카드" value={yellows.length} color="#f1c40f" sub={`레드 ${reds.length}장`}/>
            </div>

            {/* 조별 팀 통계 */}
            <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:8,letterSpacing:1}}>팀별 공격 기록</div>
            <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden",marginBottom:18}}>
              <div style={{display:"grid",gridTemplateColumns:"20px 1fr 36px 36px 36px 36px",padding:"8px 12px",background:"#0a1428",fontSize:14,color:"#475569",fontWeight:700,gap:4}}>
                {["조","팀","승점","⚽","🤝","🟨"].map(h=><div key={h} style={{textAlign:h==="팀"?"left":"center"}}>{h}</div>)}
              </div>
              {groups.map(grp=>
                sortTeams(allTeams.filter(t=>t.group===grp)).map((t,i)=>(
                  <div key={t.name} style={{display:"grid",gridTemplateColumns:"20px 1fr 36px 36px 36px 36px",padding:"9px 12px",borderTop:"1px solid #1e3060",alignItems:"center",gap:4}}>
                    <div style={{fontSize:14,fontWeight:800,color:"#2ecc71",textAlign:"center"}}>{grp}</div>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:14}}>{t.emoji}</span>
                      <div>
                        <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{t.name}</div>

                      </div>
                    </div>

                    <div style={{fontSize:14,textAlign:"center",color:"#2ecc71",fontWeight:700}}>{t.goals}</div>
                    <div style={{fontSize:14,textAlign:"center",color:"#3498db",fontWeight:700}}>{t.assists}</div>
                    <div style={{fontSize:14,textAlign:"center",color:"#f1c40f",fontWeight:700}}>{t.yellows}</div>
                  </div>
                ))
              )}

        )}
      </div>
    </div>
  );
}

function NoticeTab({ notices, setNotices, canNotice, userName, userObj, showNotif }) {

  const openNew  = () => { setForm(blank); setEditN(null); setView("form"); setUploadErr(""); };

  const openDet  = (n) => { setDetN(n); setView("detail"); };

  const handleFile = async (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    setUploading(true); setUploadErr("");
    try {
      const url = await uploadImage(file);
      setForm(f=>({...f,imgUrl:url}));
    } catch(err) { setUploadErr(err.message); }
    finally { setUploading(false); e.target.value=""; }
  };

  const saveNotice = () => {
    if(!form.title.trim() || !form.body.trim()) return;
    const now = new Date();
    const ts  = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    if(editN) {
      setNotices(prev => {
        const next = prev.map(n => n.id===editN.id ? {...n,...form} : n);
        FB.saveNotices(next).catch(()=>{});
        return next;
      });
      showNotif("✅ 공지사항이 수정되었습니다!");
    } else {
      setNotices(prev => {
        const next = [{...form, id:Date.now(), author:userName, createdAt:ts}, ...prev];
        FB.saveNotices(next).catch(()=>{});
        return next;
      });

    setView("list");
  };

  const delNotice = (id) => {
    setNotices(prev => {
      const next = prev.filter(n => n.id!==id);
      FB.saveNotices(next).catch(()=>{});

          📌 {form.pinned?"상단 고정 중 (해제하려면 탭)":"상단 고정"}

        {editN?"수정 완료":"공지 등록"}
      </button>
    </div>
  );

    return (

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setView("list")} style={{background:"rgba(255,255,255,.08)",border:"none",borderRadius:10,width:34,height:34,color:"#e2e8f0",fontSize:14,cursor:"pointer"}}>←</button>
          <div style={{flex:1}}/>
          {canNotice&&<div style={{display:"flex",gap:6}}>
            <button onClick={()=>openEdit(n)} style={{background:"rgba(59,130,246,.15)",border:"1px solid #3b82f640",borderRadius:8,padding:"5px 10px",color:"#60a5fa",fontSize:14,fontWeight:700,cursor:"pointer"}}>수정</button>
            <button onClick={()=>setDelN(n)} style={{background:"rgba(255,71,87,.1)",border:"1px solid #ff475740",borderRadius:8,padding:"5px 10px",color:"#ff4757",fontSize:14,fontWeight:700,cursor:"pointer"}}>삭제</button>

        <div style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:14,padding:18,marginBottom:4}}>
          {n.pinned&&<div style={{fontSize:14,color:"#f1c40f",fontWeight:700,marginBottom:8}}>📌 상단 고정</div>}
          <div style={{fontSize:14,fontWeight:800,color:"#e2e8f0",marginBottom:12,lineHeight:1.4}}>{n.title}</div>
          <div style={{fontSize:14,color:"#475569",marginBottom:16}}>📝 {n.author} · {n.createdAt}</div>
          <div style={{height:1,background:"#1e3060",marginBottom:16}}/>
          <div style={{fontSize:14,color:"#cbd5e1",lineHeight:1.8,whiteSpace:"pre-wrap",marginBottom:n.imgUrl?16:0}}>{n.body}</div>
          {n.imgUrl&&<img src={n.imgUrl} alt="첨부 이미지" style={{width:"100%",maxHeight:300,borderRadius:10,objectFit:"cover",display:"block"}} onError={e=>{e.target.style.display="none";}}/>}
        </div>
        {/* 공지 댓글 */}
        <div style={{marginTop:4}}>

  return (
    <div style={{padding:16}}>
      {delN&&<DeleteConfirmSheet title="공지사항을 삭제하시겠습니까?" body={delN.title} onConfirm={()=>delNotice(delN.id)} onClose={()=>setDelN(null)}/>}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>

        {canNotice&&<button onClick={openNew} style={{background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"9px 14px",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>📢 공지 작성</button>}

                <button onClick={()=>setDelN(n)} style={{background:"rgba(255,71,87,.08)",border:"none",borderRadius:7,padding:"4px 8px",color:"#ff4757",fontSize:14,cursor:"pointer"}}>🗑</button>
