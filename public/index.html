// ── 댓글 컴포넌트 (경기·공지 공통) ──────────────────────────────────────────
// CommentSection은 Firebase 실시간 리스너를 직접 사용
function CommentSection({ storageKey, user }) {
  const [list,      setList]      = useState([]);
  const [text,      setText]      = useState("");
  const [uploadErr, setUploadErr] = useState("");
  const [delTarget, setDelTarget] = useState(null);
  const [sending,   setSending]   = useState(false);
  const [showEmoji, setShowEmoji] = useState(false);
  const pad2 = n=>String(n).padStart(2,"0");

  const EMOJIS = [
    "⚽","🥅","🏃","🧤","🥇","🏆","🎯","📣","🎉","🎊",
    "🔥","💪","👏","🙌","🤜","🤛","✊","👊","🫶","❤️",
    "😍","🤩","😎","🥹","😭","😱","🤯","🥳","😤","🤝",
    "⭐","🌟","💫","✨","💥","👑","🦅","🐼","💚","💛",
    "🩵","❤️‍🔥","🫡","🙏","👍","💯","🔝","📸","🏅","🎖",
  ];

  // Firebase 실시간 댓글 구독
  useEffect(()=>{
    const unsub = FB.watchComments(storageKey, setList);
    return ()=>unsub();
  },[storageKey]);

  const addEmoji = (emoji) => { setText(t=>t+emoji); setShowEmoji(false); };

  const submit = async () => {
    if(!text.trim() || sending) return;
    setSending(true);
    const now = new Date();
    const ts  = `${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
    const newComment = { fbId:"temp_"+Date.now(), storageKey, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:text.trim(), imgUrl:"", displayTime:ts };
    setList(prev=>[...prev, newComment]);
    setText(""); setUploadErr(""); setShowEmoji(false);
    try {
      await FB.addComment({ storageKey, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:newComment.text, imgUrl:"", displayTime:ts });
    } catch(e) {
      setList(prev=>prev.filter(c=>c.fbId!==newComment.fbId));
      setUploadErr("전송 실패. 잠시 후 다시 시도해주세요.");
    }
    finally { setSending(false); }
  };

  const doDelete = async (fbId) => {
    try { await FB.deleteComment(fbId); setDelTarget(null); }
    catch(e) { setUploadErr("삭제 실패"); }
  };

  return (
    <div style={{background:"#0a0f1e",border:"1px solid #1e293b",borderRadius:14,overflow:"hidden",marginTop:12}}>
      <div style={{padding:"10px 14px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",gap:6}}>
        <span style={{fontSize:14}}>💬</span>
        <span style={{fontSize:14,fontWeight:700,color:"#94a3b8"}}>응원 댓글</span>
        <span style={{fontSize:13,color:"#334155",marginLeft:4}}>{list.length}개</span>
      </div>

      {/* 댓글 목록 */}
      {list.length===0
        ?<div style={{padding:"18px 14px",textAlign:"center",color:"#334155",fontSize:13}}>첫 번째 댓글을 남겨보세요!</div>
        :list.map(c=>(
          <div key={c.fbId||c.id} style={{padding:"10px 14px",borderBottom:"1px solid #0f172a",display:"flex",gap:8}}>
            <div style={{width:28,height:28,borderRadius:7,background:`${c.color}20`,border:`1px solid ${c.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>
              {c.role==="감독/코치"?"🎽":c.role==="선수"?"⚽":c.role==="학부모"?"👨‍👩‍👧":c.role==="심판"?"🟨":"💬"}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}>
                <span style={{fontSize:14,fontWeight:700,color:c.color}}>{c.author}</span>
                <span style={{fontSize:12,color:"#334155",background:`${c.color}15`,padding:"1px 6px",borderRadius:10}}>{c.role}</span>
                <span style={{fontSize:12,color:"#334155",marginLeft:"auto"}}>{c.displayTime||c.createdAt}</span>
              </div>
              {c.text&&<div style={{fontSize:15,color:"#cbd5e1",lineHeight:1.6,wordBreak:"break-word"}}>{c.text}</div>}
            </div>
            {c.author===user.name&&(
              delTarget===(c.fbId||c.id)
                ?<div style={{display:"flex",flexDirection:"column",gap:3,flexShrink:0}}>
                  <button onClick={()=>doDelete(c.fbId||c.id)} style={{background:"#ff4757",border:"none",borderRadius:5,padding:"3px 7px",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>삭제</button>
                  <button onClick={()=>setDelTarget(null)} style={{background:"#1e293b",border:"none",borderRadius:5,padding:"3px 7px",color:"#94a3b8",fontSize:13,cursor:"pointer"}}>취소</button>
                </div>
                :<button onClick={()=>setDelTarget(c.fbId||c.id)} style={{background:"rgba(255,71,87,.08)",border:"none",borderRadius:5,padding:"3px 6px",color:"#475569",fontSize:13,cursor:"pointer",flexShrink:0}}>🗑</button>
            )}
          </div>
        ))
      }

      {/* 이모티콘 팔레트 */}
      {showEmoji&&(
        <div style={{padding:"8px 12px",background:"#0d1425",borderTop:"1px solid #1e293b",display:"flex",flexWrap:"wrap",gap:6}}>
          {EMOJIS.map(e=>(
            <button key={e} onClick={()=>addEmoji(e)}
              style={{background:"#1e293b",border:"1px solid #334155",borderRadius:8,width:36,height:36,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              {e}
            </button>
          ))}
        </div>
      )}

      {/* 입력 영역 */}
      <div style={{padding:"10px 12px",background:"#0d1425"}}>
        {uploadErr&&<div style={{fontSize:13,color:"#ff4757",marginBottom:5}}>⚠ {uploadErr}</div>}
        <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
          <div style={{flex:1}}>
            <textarea value={text} onChange={e=>setText(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit();}}}
              placeholder={`${user.name}님, 응원 메시지 (Enter 전송)`}
              style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:8,padding:"9px 11px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit",resize:"none",height:52,lineHeight:1.5}}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,flexShrink:0}}>
            <button onClick={()=>setShowEmoji(v=>!v)} title="이모티콘"
              style={{width:34,height:34,borderRadius:7,background:showEmoji?"rgba(241,196,15,.2)":"#1e293b",border:`1px solid ${showEmoji?"#f1c40f":"#334155"}`,color:showEmoji?"#f1c40f":"#64748b",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
              😊
            </button>
            <button onClick={submit} disabled={!text.trim()}
              style={{width:34,height:34,borderRadius:7,background:text.trim()?"linear-gradient(135deg,#2ecc71,#27ae60)":"#1e293b",border:"none",color:text.trim()?"#000":"#334155",fontSize:16,cursor:text.trim()?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}}>
              ↑
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── 사진 업로드 섹션 (경기 상세 하단, 응원 포토탭과 연동) ──────────────────
function PhotoSection({ storageKey, user }) {
  const [list,      setList]      = useState([]);
  const [uploading, setUploading] = useState(false);
  const [uploadErr, setUploadErr] = useState("");
  const [sending,   setSending]   = useState(false);
  const [caption,   setCaption]   = useState("");
  const fileRef = useRef(null);
  const pad2 = n=>String(n).padStart(2,"0");

  useEffect(()=>{
    const unsub = FB.watchComments(storageKey, (all)=>{
      setList(all.filter(c=>!!c.imgUrl));
    });
    return ()=>unsub();
  },[storageKey]);

  const handleFile = async (e) => {
    const file = e.target.files?.[0]; if(!file) return;
    setUploading(true); setUploadErr("");
    try {
      const url = await uploadImage(file);
      setSending(true);
      const now = new Date();
      const ts  = `${now.getMonth()+1}/${now.getDate()} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      await FB.addComment({ storageKey, author:user.name, role:user.label||"사용자", color:user.color||"#60a5fa", text:caption, imgUrl:url, displayTime:ts });
      setCaption("");
    } catch(err) { setUploadErr(err.message||"업로드 실패"); }
    finally { setUploading(false); setSending(false); e.target.value=""; }
  };

  return (
    <div style={{background:"#0a0f1e",border:"1px solid #1e3060",borderRadius:14,overflow:"hidden",marginTop:8}}>
      <div style={{padding:"10px 14px",borderBottom:"1px solid #1e293b",display:"flex",alignItems:"center",gap:6}}>
        <span style={{fontSize:14}}>📷</span>
        <span style={{fontSize:14,fontWeight:700,color:"#94a3b8"}}>경기 포토</span>
        <span style={{fontSize:13,color:"#334155",marginLeft:4}}>{list.length}장</span>
      </div>

      {/* 사진 그리드 */}
      {list.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:2,padding:2}}>
          {list.map(c=>(
            <div key={c.fbId||c.id} style={{position:"relative",aspectRatio:"1",overflow:"hidden",borderRadius:4}}>
              <img src={c.imgUrl} alt="사진" onError={e=>{e.target.style.display="none";}}
                style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
              <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.6)",padding:"3px 5px"}}>
                <div style={{fontSize:11,color:c.color||"#60a5fa",fontWeight:700}}>{c.author}</div>
                {c.text&&<div style={{fontSize:11,color:"#94a3b8",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{c.text}</div>}
              </div>
            </div>
          ))}
        </div>
      )}
      {list.length===0&&<div style={{padding:"16px",textAlign:"center",fontSize:13,color:"#334155"}}>아직 사진이 없어요</div>}

      {/* 업로드 */}
      <div style={{padding:"10px 12px",background:"#0d1425",borderTop:"1px solid #1e293b"}}>
        {uploadErr&&<div style={{fontSize:13,color:"#ff4757",marginBottom:5}}>⚠ {uploadErr}</div>}
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <input value={caption} onChange={e=>setCaption(e.target.value)} placeholder="사진 설명 (선택)"
            style={{flex:1,background:"#0f172a",border:"1px solid #1e3060",borderRadius:7,padding:"7px 10px",color:"#e2e8f0",fontSize:13,outline:"none",fontFamily:"inherit"}}/>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/>
          <button onClick={()=>fileRef.current?.click()} disabled={uploading||sending}
            style={{padding:"7px 14px",background:uploading?"rgba(241,196,15,.15)":"rgba(52,152,219,.15)",border:"1px solid #3498db40",borderRadius:7,color:uploading?"#f1c40f":"#3498db",fontSize:13,fontWeight:700,cursor:uploading?"wait":"pointer",whiteSpace:"nowrap"}}>
            {uploading?"⏳ 업로드 중...":"📷 사진 추가"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── 로그아웃 확인 모달 ────────────────────────────────────────────────────────
function LogoutConfirmModal({ user, onConfirm, onClose }) {
  return (
    <BottomSheet onClose={onClose}>
      <div style={{textAlign:"center",padding:"8px 0 20px"}}>
        <div style={{fontSize:14,marginBottom:12}}>{user.icon}</div>
        <div style={{fontSize:14,fontWeight:800,color:"#e2e8f0",marginBottom:6}}>로그아웃 하시겠습니까?</div>
        <div style={{fontSize:14,color:"#64748b",marginBottom:20}}>
          <strong style={{color:user.color}}>{user.name}</strong> ({user.label})<br/>
          로그아웃 후 다시 로그인이 필요합니다
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button onClick={onClose} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"12px 0",color:"#94a3b8",fontWeight:700,fontSize:14,cursor:"pointer"}}>취소</button>
          <button onClick={onConfirm} style={{background:"linear-gradient(135deg,#ff4757,#c0392b)",border:"none",borderRadius:10,padding:"12px 0",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>로그아웃</button>
        </div>
      </div>
    </BottomSheet>
  );
}

// ── 일정 탭 (구장·조 필터 + 시간 수정) ──────────────────────────────────────
function ScheduleTab({ matches, fields, user, setMatchForm, setDetailId, setDelMatch, updateMatch, showNotif }) {
  const [fieldFilter, setFieldFilter] = useState("전체");
  const [groupFilter, setGroupFilter] = useState("전체");
  const [editM, setEditM] = useState(null);
  const [editTime, setEditTime] = useState({date:"",time:"",field:""});

  const allFields = ["전체", ...new Set(matches.map(m=>m.field))];
  const allGroups = ["전체", ...new Set(matches.map(m=>m.group).filter(Boolean))].sort((a,b)=>a==="전체"?-1:b==="전체"?1:a.localeCompare(b));

  const filtered = matches.filter(m =>
    (fieldFilter==="전체" || m.field===fieldFilter) &&
    (groupFilter==="전체" || m.group===groupFilter)
  );

  const openEdit = (m) => { setEditTime({date:m.date,time:m.time,field:m.field}); setEditM(m); };
  const saveTime = () => {
    updateMatch(editM.id, {date:editTime.date,time:editTime.time,field:editTime.field});
    setEditM(null);
    showNotif("✅ 경기 일정이 수정되었습니다!");
  };

  return (
    <div style={{padding:16}}>
      {editM&&(
        <BottomSheet onClose={()=>setEditM(null)}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:800,color:"#60a5fa"}}>📅 경기 일정 수정</div>
            <button onClick={()=>setEditM(null)} style={{marginLeft:"auto",background:"rgba(255,255,255,.08)",border:"none",borderRadius:8,width:30,height:30,color:"#94a3b8",fontSize:14,cursor:"pointer"}}>✕</button>
          </div>
          <div style={{fontSize:14,color:"#64748b",marginBottom:14}}>{editM.home.name} vs {editM.away.name} · {editM.group}조</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:6}}>날짜</div>
              <input value={editTime.date} onChange={e=>setEditTime(p=>({...p,date:e.target.value}))} placeholder="05/30"
                style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
            </div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:6}}>시작 시간</div>
              <input value={editTime.time} onChange={e=>setEditTime(p=>({...p,time:e.target.value}))} placeholder="11:00"
                style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:14,fontWeight:700,color:"#7b9bc8",marginBottom:6}}>경기장</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
              {fields.map(f=>(
                <button key={f.id} onClick={()=>setEditTime(p=>({...p,field:f.name}))} style={{background:editTime.field===f.name?"rgba(46,204,113,.2)":"#0f172a",border:`1px solid ${editTime.field===f.name?"#2ecc71":"#1e3060"}`,borderRadius:7,padding:"7px 14px",color:editTime.field===f.name?"#2ecc71":"#64748b",fontWeight:editTime.field===f.name?700:500,fontSize:14,cursor:"pointer"}}>{f.name}</button>
              ))}
            </div>
            <input value={editTime.field} onChange={e=>setEditTime(p=>({...p,field:e.target.value}))} placeholder="직접 입력"
              style={{width:"100%",background:"#0f172a",border:"1px solid #1e3060",borderRadius:9,padding:"10px 12px",color:"#e2e8f0",fontSize:14,boxSizing:"border-box",outline:"none",fontFamily:"inherit"}}/>
          </div>
          <button onClick={saveTime} style={{width:"100%",background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:12,padding:"14px 0",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>저장</button>
        </BottomSheet>
      )}

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div><div style={{fontSize:14,fontWeight:800}}>경기 일정</div><div style={{fontSize:14,color:"#64748b",marginTop:2}}>총 {filtered.length}경기 표시</div></div>
        {user.canManage&&<button onClick={()=>setMatchForm("new")} style={{background:"linear-gradient(135deg,#2ecc71,#27ae60)",border:"none",borderRadius:10,padding:"9px 14px",color:"#000",fontWeight:800,fontSize:14,cursor:"pointer"}}>➕ 경기 개설</button>}
      </div>

      {/* 구장 필터 */}
      <div style={{display:"flex",gap:6,marginBottom:7,overflowX:"auto",paddingBottom:2}}>
        {allFields.map(f=>(
          <button key={f} onClick={()=>setFieldFilter(f)} style={{flexShrink:0,background:fieldFilter===f?"rgba(59,130,246,.2)":"#0f1d35",border:`1px solid ${fieldFilter===f?"#3b82f6":"#1e3060"}`,borderRadius:20,padding:"5px 12px",color:fieldFilter===f?"#60a5fa":"#64748b",fontWeight:fieldFilter===f?700:500,fontSize:14,cursor:"pointer",whiteSpace:"nowrap"}}>{f}</button>
        ))}
      </div>

      {/* 조 필터 */}
      <div style={{display:"flex",gap:6,marginBottom:14,overflowX:"auto",paddingBottom:2}}>
        {allGroups.map(g=>(
          <button key={g} onClick={()=>setGroupFilter(g)} style={{flexShrink:0,background:groupFilter===g?"rgba(46,204,113,.2)":"#0f1d35",border:`1px solid ${groupFilter===g?"#2ecc71":"#1e3060"}`,borderRadius:20,padding:"5px 12px",color:groupFilter===g?"#2ecc71":"#64748b",fontWeight:groupFilter===g?700:500,fontSize:14,cursor:"pointer",whiteSpace:"nowrap"}}>{g==="전체"?g:`${g}조`}</button>
        ))}
      </div>

      {/* 경기 목록 */}
      {filtered.length===0
        ?<div style={{textAlign:"center",padding:"40px 0",color:"#475569"}}><div style={{fontSize:14,marginBottom:12}}>📋</div><div>해당하는 경기가 없습니다</div></div>
        :filtered.map(m=>(
          <div key={m.id}>
            <MatchCard match={m} onTap={()=>setDetailId(m.id)} onEdit={()=>setMatchForm(m)} onDelete={()=>setDelMatch(m)} canManage={user.canManage}/>
            {user.canManage && m.phase==="pre" && (
              <div style={{marginTop:-6,marginBottom:10,paddingLeft:4}}>
                <button onClick={()=>openEdit(m)} style={{background:"rgba(59,130,246,.1)",border:"1px solid #3b82f630",borderRadius:7,padding:"4px 12px",color:"#60a5fa",fontSize:14,fontWeight:600,cursor:"pointer"}}>
                  📅 일정 수정
                </button>
              </div>
            )}
          </div>
        ))
      }
    </div>
  );
}

function App() {
  // 로그인 유지: sessionStorage 사용 (탭 닫으면 초기화, 새로고침은 유지)
  const [user, setUser] = useState(() => {
    try { const s = sessionStorage.getItem("kickoff_user"); return s ? JSON.parse(s) : null; } catch(e) { return null; }
  });
  const [tab,       setTab]       = useState("home");
  const [matches,   setMatches]   = useState(INIT_MATCHES);
  const [teams,     setTeams]     = useState(INIT_TEAMS);
  const [fields,    setFields]    = useState(INIT_FIELDS);
  const [notices,   setNotices]   = useState(INIT_NOTICES);
  const [fbReady,   setFbReady]   = useState(false); // Firebase 첫 로드 완료 여부
  const [detailId,  setDetailId]  = useState(null);
  const [matchForm, setMatchForm] = useState(null);
  const [delMatch,  setDelMatch]  = useState(null);
  const [notif,     setNotif]     = useState(null);
  const [showLogout,setShowLogout]= useState(false);

  // Firebase 실시간 리스너 (마운트 시 1회 등록)
  useEffect(()=>{
    // 경기 데이터 — Firebase 없으면 초기 데이터 업로드
    const unsubM = FB.watchMatches(list=>{
      setMatches(list.length>0 ? list : INIT_MATCHES);
      setFbReady(true);
    });
    // 공지 데이터
    const unsubN = FB.watchNotices(list=>{
      if(list.length>0) setNotices(list);
    });
    return ()=>{ unsubM(); unsubN(); };
  },[]);

  // Firebase 초기 데이터 업로드 (최초 1회 — 이미 데이터 있으면 skip)
  useEffect(()=>{
    if(!fbReady) return;
    FB.saveMatches(INIT_MATCHES).catch(()=>{});
  // eslint-disable-next-line
  },[fbReady]);

  // 전체 경기 실시간 타이머
  useEffect(()=>{
    const iv=setInterval(()=>{
      setMatches(prev=>prev.map(m=>(m.phase==="first_half"||m.phase==="second_half")?{...m,elapsedSec:(m.elapsedSec||0)+1}:m));
    },1000);
    return ()=>clearInterval(iv);
  },[]);

  const showNotif=(msg,color="#2ecc71")=>{setNotif({msg,color});setTimeout(()=>setNotif(null),2400);};
  const updateMatch=(id,updater)=>setMatches(prev=>{
    const next=prev.map(m=>m.id===id?(typeof updater==="function"?updater(m):{...m,...updater}):m);
    FB.saveMatches(next).catch(()=>{}); // Firebase에 즉시 저장
    return next;
  });
  const saveMatch=(m)=>{
    setMatches(prev=>{
      const next=prev.find(x=>x.id===m.id)?prev.map(x=>x.id===m.id?m:x):[...prev,m];
      FB.saveMatches(next).catch(()=>{});
      return next;
    });
    setMatchForm(null);
    showNotif(matchForm==="new"?"✅ 경기가 개설되었습니다!":"✅ 경기가 수정되었습니다!");
  };
  const deleteMatch=(id)=>{
    setMatches(prev=>{
      const next=prev.filter(m=>m.id!==id);
      FB.saveMatches(next).catch(()=>{});
      return next;
    });
    setDelMatch(null); showNotif("🗑 경기가 삭제되었습니다","#ff4757");
  };

  const handleLogin = (userData) => {
    try { sessionStorage.setItem("kickoff_user", JSON.stringify(userData)); } catch(e){}
    setUser(userData);
  };
  const handleLogout = () => {
    try { sessionStorage.removeItem("kickoff_user"); } catch(e){}
    setUser(null); setShowLogout(false);
  };

  if(!user) return <LoginScreen onLogin={handleLogin}/>;
  if(detailId!=null) return <MatchDetail matchId={detailId} matches={matches} onUpdateMatch={updateMatch} onBack={()=>setDetailId(null)} user={user}/>;

  const navTabs=[
    {id:"home",    icon:"🏠", label:"홈"},
    {id:"notice",  icon:"📢", label:"공지"},
    {id:"schedule",icon:"📅", label:"일정"},
    {id:"ranking", icon:"🏆", label:"순위"},
    {id:"cheer",   icon:"🙏", label:"영광"},
  ];

  const liveCount=matches.filter(m=>m.phase==="first_half"||m.phase==="second_half").length;
  const latestNotice = notices.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0))[0];

  return (
    <div style={{fontFamily:"'Noto Sans KR','Apple SD Gothic Neo',sans-serif",background:"#0a0e1a",minHeight:"100vh",color:"#e8eaf0",maxWidth:430,margin:"0 auto"}}>
      <Notif notif={notif}/>
      {showLogout&&<LogoutConfirmModal user={user} onConfirm={handleLogout} onClose={()=>setShowLogout(false)}/>}
      {/* 경기 개설/삭제는 기록 담당자 앱에서만 */}

      {/* 헤더 */}
      <div style={{background:"linear-gradient(135deg,#0d1b3e,#1a2a5e)",padding:"14px 16px 12px",borderBottom:"1px solid #1e3060",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#2ecc71,#27ae60)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>⚽</div>
          <div><div style={{fontSize:14,fontWeight:800}}>26년 상반기 은하수대회</div><div style={{fontSize:14,color:"#7b9bc8",marginTop:1}}>2026 · 5월 30일 · U9/U11/U13</div></div>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:7}}>
            {liveCount>0&&<div style={{background:"#ff4757",color:"#fff",fontSize:14,fontWeight:800,padding:"2px 7px",borderRadius:20,animation:"blink 1.5s infinite"}}>LIVE {liveCount}</div>}
            {/* 로그아웃: 반드시 확인 모달 거침 */}
            <button onClick={()=>setShowLogout(true)} style={{background:`${user.color}20`,border:`1px solid ${user.color}40`,borderRadius:20,padding:"4px 10px",display:"flex",alignItems:"center",gap:4,cursor:"pointer"}}>
              <span style={{fontSize:14}}>{user.icon}</span>
              <span style={{fontSize:14,fontWeight:700,color:user.color}}>{user.name}</span>
            </button>
          </div>
        </div>
      </div>

      <div style={{padding:"0 0 76px"}}>
        {/* 홈 */}
        {tab==="home"&&(
          <div style={{padding:16}}>
            <div style={{background:"#0f1d35",border:`1px solid ${user.color}40`,borderRadius:14,padding:14,marginBottom:14,display:"flex",alignItems:"center",gap:10}}>
              <div style={{fontSize:14}}>{user.icon}</div>
              <div>
                <div style={{fontSize:14,fontWeight:700,color:user.color}}>{user.label}</div>
                <div style={{fontSize:14,color:"#e2e8f0"}}>{user.name}님, 환영합니다 👋</div>
                <div style={{fontSize:14,color:"#64748b",marginTop:1}}>"경기·팀·공지 조회 가능"</div>
              </div>
            </div>
            {/* 최신 공지 배너 */}
            {latestNotice&&(
              <div onClick={()=>setTab("notice")} style={{background:latestNotice.pinned?"rgba(241,196,15,.08)":"rgba(255,255,255,.04)",border:`1px solid ${latestNotice.pinned?"#f1c40f30":"#1e3060"}`,borderRadius:12,padding:"10px 14px",marginBottom:14,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:14}}>📢</span>
                <div style={{flex:1,overflow:"hidden"}}>
                  <div style={{fontSize:14,color:"#f1c40f",fontWeight:700,marginBottom:2}}>최신 공지</div>
                  <div style={{fontSize:14,color:"#e2e8f0",fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{latestNotice.title}</div>
                </div>
                <span style={{fontSize:14,color:"#64748b",flexShrink:0}}>›</span>
              </div>
            )}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:16}}>
              {[
                {label:"경기",value:matches.length,icon:"📋",color:"#3498db"},
                {label:"팀",value:teams.length,icon:"👥",color:"#2ecc71"},
                {label:"완료",value:matches.filter(m=>m.phase==="finished").length,icon:"✅",color:"#2ecc71"},
              ].map(s=>(
                <div key={s.label} style={{background:"#0f1d35",border:"1px solid #1e3060",borderRadius:12,padding:"12px 10px",textAlign:"center"}}>
                  <div style={{fontSize:14}}>{s.icon}</div>
                  <div style={{fontSize:14,fontWeight:900,color:s.color,marginTop:4}}>{s.value}</div>
                  <div style={{fontSize:14,color:"#64748b",marginTop:2}}>{s.label}</div>
                </div>
              ))}
            </div>
            <div style={{fontSize:14,fontWeight:700,color:"#64748b",marginBottom:10,letterSpacing:1}}>최근 경기</div>
            {matches.slice(0,3).map(m=><MatchCard key={m.id} match={m} onTap={()=>setDetailId(m.id)} onEdit={()=>setMatchForm(m)} onDelete={()=>setDelMatch(m)} canManage={user.canManage}/>)}
          </div>
        )}

        {/* 공지사항 (모든 사용자) */}
        {tab==="notice"&&<NoticeTab notices={notices} setNotices={setNotices} canNotice={!!user.canNotice} userName={user.name} userObj={user} showNotif={showNotif}/>}

        {/* 일정 */}
        {tab==="schedule"&&<ScheduleTab matches={matches} fields={fields} user={user} setMatchForm={setMatchForm} setDetailId={setDetailId} setDelMatch={setDelMatch} updateMatch={updateMatch} showNotif={showNotif}/>}

        {/* 팀 - 홈 탭에서 접근 */}
        {tab==="teams"&&<TeamTab teams={teams} setTeams={setTeams} canManage={user.canManage} showNotif={showNotif}/>}

        {/* 순위/결과 */}
        {tab==="ranking"&&<RankingTab matches={matches}/>}

        {/* 응원 탭 - 전체 경기 댓글 통합 */}
        {tab==="cheer"&&<CheerTab matches={matches} user={user}/>}
      </div>

      {/* 하단 내비 */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#0a0e1a",borderTop:"1px solid #1e3060",display:"flex",padding:"8px 0 12px"}}>
        {navTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",padding:"4px 0"}}>
            <span style={{fontSize:14}}>{t.icon}</span>
            <span style={{fontSize:14,fontWeight:tab===t.id?700:400,color:tab===t.id?"#2ecc71":"#4a6080"}}>{t.label}</span>
            {tab===t.id&&<div style={{width:4,height:4,borderRadius:"50%",background:"#2ecc71"}}/>}
          </button>
        ))}
      </div>

      <style>{`
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
        input::placeholder{color:#2a3a5a;}
        textarea::placeholder{color:#2a3a5a;}
        *{-webkit-tap-highlight-color:transparent;}
        input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
      `}</style>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
