// Firebase 연동

// Firebase는 HTML에서 compat 스크립트로 로드되며, window.firebase 로 사용
const FB = {
  ready: false,
  db: null,
  storage: null,

  init() {
    if (this.ready) return true;
    if (typeof window === "undefined" || !window.firebase) return false;
    try {
      const config = {
        apiKey: "AIzaSyD68up8_xI6vg1n0GNOUv4do9TfnZvIScg",
        authDomain: "eunhasu-2026.firebaseapp.com",
        projectId: "eunhasu-2026",
        storageBucket: "eunhasu-2026.firebasestorage.app",
        messagingSenderId: "553247461294",
        appId: "1:553247461294:web:41cf7829f264002c58423f",
      };
      if (!window.firebase.apps.length) {
        window.firebase.initializeApp(config);
      }
      this.db = window.firebase.firestore();
      this.storage = window.firebase.storage ? window.firebase.storage() : null;
      this.ready = true;
      return true;
    } catch (e) {
      console.error("Firebase 초기화 실패:", e);
      return false;
    }
  },

  // ----- Firestore: 정보 문서 -----
  watchInfo(cb) {
    if (!this.init()) return () => {};
    return this.db.collection("kickoff").doc("info").onSnapshot(
      (snap) => {
        if (snap.exists) cb(snap.data());
        else cb(null);
      },
      (err) => console.error("watchInfo:", err)
    );
  },
  saveInfo(data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff").doc("info").set(data, { merge: true });
  },

  // ----- 공지사항 -----
  watchNotices(cb) {
    if (!this.init()) return () => {};
    return this.db
      .collection("kickoff_notices")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        (snap) => {
          const list = snap.docs.map((d) => ({ fbId: d.id, ...d.data() }));
          cb(list);
        },
        (err) => console.error("watchNotices:", err)
      );
  },
  addNotice(data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").add({
      ...data,
      createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
    });
  },
  updateNotice(fbId, data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").doc(fbId).update(data);
  },
  deleteNotice(fbId) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").doc(fbId).delete();
  },

  // ----- Storage: 파일 업로드 -----
  uploadFile(path, file, onProgress) {
    if (!this.init() || !this.storage) return Promise.reject("Storage not ready");
    return new Promise((resolve, reject) => {
      const ref = this.storage.ref(path);
      const task = ref.put(file);
      task.on(
        "state_changed",
        (snap) => {
          const p = (snap.bytesTransferred / snap.totalBytes) * 100;
          if (onProgress) onProgress(p);
        },
        (err) => reject(err),
        () => {
          task.snapshot.ref.getDownloadURL().then(resolve).catch(reject);
        }
      );
    });
  },
  getDownloadURL(path) {
    if (!this.init() || !this.storage) return Promise.reject("Storage not ready");
    return this.storage.ref(path).getDownloadURL();
  },
};

const ADMIN_DEFAULT_PASSWORD = "eunhasu2026";

function useAdmin() {
  // URL 쿼리에서 admin 모드 진입 여부 판단
  const isAdminMode = useMemo(() => {
    if (typeof window === "undefined") return false;
    const params = new URLSearchParams(window.location.search);
    return params.get("admin") === "1";
  }, []);

  // 비밀번호 인증 여부 (sessionStorage)
  const [authed, setAuthed] = useState(() => {
    if (typeof window === "undefined") return false;
    return sessionStorage.getItem("eunhasu_admin_authed") === "1";
  });

  const login = useCallback((pw) => {
    const saved = localStorage.getItem("eunhasu_admin_pw") || ADMIN_DEFAULT_PASSWORD;
    if (pw === saved) {
      sessionStorage.setItem("eunhasu_admin_authed", "1");
      setAuthed(true);
      return true;
    }
    return false;
  }, []);

  const logout = useCallback(() => {
    sessionStorage.removeItem("eunhasu_admin_authed");
    setAuthed(false);
  }, []);

  const changePassword = useCallback((oldPw, newPw) => {
    const saved = localStorage.getItem("eunhasu_admin_pw") || ADMIN_DEFAULT_PASSWORD;
    if (oldPw !== saved) return { ok: false, msg: "현재 비밀번호가 일치하지 않습니다" };
    if (!newPw || newPw.length < 4) return { ok: false, msg: "새 비밀번호는 4자 이상이어야 합니다" };
    localStorage.setItem("eunhasu_admin_pw", newPw);
    return { ok: true, msg: "비밀번호가 변경되었습니다" };
  }, []);

  return { isAdminMode, authed, login, logout, changePassword };
}

// ========================
// 유틸
// ========================
function parseTime(str) {
  if (!str) return [0, 0];
  const [s, e] = str.split("~");
  const toMin = (t) => {
    const [h, m] = t.trim().split(":").map(Number);
    return h * 60 + m;
  };
  return [toMin(s), toMin(e)];
}

function isMatchLive(times, curMin, isToday) {
  if (!isToday) return false;
  for (const t of times) {
    if (!t) continue;
    const [s, e] = parseTime(t);
    if (curMin >= s && curMin <= e) return true;
  }
  return false;
}

function isMatchDone(times, curMin, isToday) {
  if (!isToday) return false;
  const lastEnd = Math.max(...times.filter(Boolean).map((t) => parseTime(t)[1]));
  return curMin > lastEnd;
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

          <Input type="password" value={newPw} onChange={setNewPw} />
        </Field>
        {msg && (
          <div
            style={{
              fontSize: 13,
              padding: 10,
              borderRadius: 8,
              marginBottom: 10,
              background: msg.includes("변경") ? "#dcfce7" : "#fef2f2",
              color: msg.includes("변경") ? "#166534" : C.danger,

            {msg}
          </div>
        )}
        <Btn onClick={submitPw} style={{ width: "100%" }}>
          변경하기
        </Btn>
      </Modal>
    </>
  );
}

function MapUploader({ onUploaded }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) {
      alert("10MB 이하 이미지만 가능합니다");
      return;
    }
    setUploading(true);
    setProgress(0);
    try {
      const url = await FB.uploadFile("map/aerial.jpg", file, setProgress);
      onUploaded(url);
      alert("업로드 완료");
    } catch (err) {
      alert("업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setProgress(0);
      e.target.value = "";
    }
  };

  return (
    <>
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        onChange={handleFile}
        style={{ display: "none" }}
      />
      <button
        onClick={() => inputRef.current?.click()}
        disabled={uploading}
        style={{
          padding: "5px 10px",
          background: C.primary,
          color: "#fff",
          border: "none",
          borderRadius: 6,
          fontSize: 11,
          fontWeight: 700,
          cursor: uploading ? "wait" : "pointer",
        }}
      >
        {uploading ? `업로드 ${progress.toFixed(0)}%` : "✏️ 지도 교체"}
      </button>
    </>
  );
}

function OrderTab({ info, now, admin }) {
  const [editOpen, setEditOpen] = useState(null); // 'opening' | 'closing'

  const isToday = useMemo(() => {
    return now.toISOString().slice(0, 10) === info.dateISO;
  }, [now, info.dateISO]);

  const curMin = now.getHours() * 60 + now.getMinutes();

  // 진행 중인 단계 판별
  const currentIdx = useMemo(() => {
    if (!isToday) return -1;
    if (curMin < 590) return -1; // 9:50 이전
    if (curMin < 600) return 0; // 9:50~10:00 집합
    if (curMin < 650) return 1; // 10:00~10:50 개회
    if (curMin < 960) return 2; // 11:00~16:00 경기
    if (curMin < 990) return 3; // 16:00~16:30 폐회
    return -1;
  }, [isToday, curMin]);

  return (
    <div>
      <SectionTitle icon="📋">대회 순서</SectionTitle>

      {!isToday && (
        <Card style={{ background: "#fef3c7", border: "1px solid #fcd34d" }}>
          <div style={{ fontSize: 13, color: "#92400e", fontWeight: 600 }}>
            ⏳ 대회 당일이 되면 현재 진행 중인 순서가 자동으로 표시됩니다.
          </div>
        </Card>
      )}

      {/* 집합 */}
      <OrderItem
        icon="👕"
        time="09:50"
        title="운동장 집합"
        desc="운동복 착용 후 운동장에 집합해주세요"
        color="#64748b"
        active={currentIdx === 0}
      />

      {/* 개회예배 */}
      <OrderItem
        icon="🙏"
        time={info.opening?.time || "10:00 ~ 10:50"}
        title="개회예배"
        desc={`사회: ${info.host || ""}`}
        color="#2563eb"
        active={currentIdx === 1}
        details={[
          { label: "준비찬양", value: info.opening?.prepHymn },
          { label: "대표기도", value: info.opening?.representative },
          { label: "말씀", value: info.opening?.sermon },
          { label: "선서", value: info.opening?.oath },
          { label: "개회선언", value: info.opening?.declaration },
          { label: "사진촬영", value: info.opening?.photo },
        ]}
        onEdit={admin.authed ? () => setEditOpen("opening") : null}
      />

      {/* 경기 */}
      <OrderItem
        icon="⚽"
        time="11:00 ~ 16:00"
        title="경기 진행"
        desc="제1·2구장 동시 진행 · 페이스페인팅·부채만들기 부스 운영"
        color="#16a34a"
        active={currentIdx === 2}
      />

      {/* 폐회식 */}
      <OrderItem
        icon="🏆"
        time={info.closing?.time || "16:00 ~ 16:30"}
        title="폐회 및 시상식"
        desc={`사회: ${info.host || ""}`}
        color="#dc2626"
        active={currentIdx === 3}
        details={[
          { label: "준비찬양", value: info.closing?.prepHymn },
          { label: "치어", value: info.closing?.cheer },
          { label: "성적발표/시상", value: info.closing?.result },
          { label: "폐회사", value: info.closing?.farewell },
          { label: "경품&포토제닉상", value: info.closing?.photogenic },
          { label: "사진촬영", value: info.closing?.photo },
        ]}
        onEdit={admin.authed ? () => setEditOpen("closing") : null}
      />

      {/* 편집 모달 */}
      {admin.authed && editOpen && (
        <OrderEditModal
          open={!!editOpen}
          onClose={() => setEditOpen(null)}
          info={info}
          which={editOpen}
        />
      )}

  );
}

// 4) 찬양 탭 (음원 플레이어 + 가사)
// =========================================================
function HymnTab({ admin }) {
  // 현재 재생 중인 곡 id
  const [playingId, setPlayingId] = useState(null);
  const [audioState, setAudioState] = useState({
    duration: 0,
    currentTime: 0,
    paused: true,
    loading: false,
  });
  // 각 곡의 다운로드 URL 캐시
  const [urlCache, setUrlCache] = useState({});
  // 가사 펼침 상태
  const [expandedId, setExpandedId] = useState(null);

  const audioRef = useRef(null);

  const allHymns = useMemo(() => [...HYMNS.opening, ...HYMNS.closing], []);

  // 곡 재생 시작
  const playHymn = useCallback(
    async (hymn) => {
      // 현재 같은 곡이 재생 중이면 일시정지/재개
      if (playingId === hymn.id && audioRef.current) {
        if (audioRef.current.paused) {
          audioRef.current.play();
        } else {
          audioRef.current.pause();
        }
        return;
      }

      // 새 곡 재생: URL 가져오기
      setAudioState((s) => ({ ...s, loading: true, paused: true }));
      setPlayingId(hymn.id);

      let url = urlCache[hymn.id];
      if (!url) {
        try {
          url = await FB.getDownloadURL(hymn.storageKey);
          setUrlCache((c) => ({ ...c, [hymn.id]: url }));
        } catch (e) {
          alert(`음원을 불러올 수 없습니다.\n(${hymn.title})\n파일이 업로드되지 않았을 수 있습니다.`);
          setPlayingId(null);
          setAudioState((s) => ({ ...s, loading: false }));
          return;
        }
      }

      // audio 엘리먼트 준비
      if (!audioRef.current) {
        audioRef.current = new Audio();
      }
      audioRef.current.src = url;
      audioRef.current.play().catch((err) => {
        console.error("재생 실패:", err);
      });
    },
    [playingId, urlCache]
  );

  // 다음/이전 곡
  const playNext = useCallback(() => {
    if (!playingId) return;
    const idx = allHymns.findIndex((h) => h.id === playingId);
    if (idx >= 0 && idx < allHymns.length - 1) {
      playHymn(allHymns[idx + 1]);
    }
  }, [playingId, allHymns, playHymn]);

  const playPrev = useCallback(() => {
    if (!playingId) return;
    const idx = allHymns.findIndex((h) => h.id === playingId);
    if (idx > 0) {
      playHymn(allHymns[idx - 1]);
    }
  }, [playingId, allHymns, playHymn]);

  // audio 이벤트 핸들러
  useEffect(() => {
    if (!audioRef.current) return;
    const audio = audioRef.current;

    const onTime = () =>
      setAudioState((s) => ({ ...s, currentTime: audio.currentTime }));
    const onMeta = () =>
      setAudioState((s) => ({ ...s, duration: audio.duration, loading: false }));
    const onPlay = () => setAudioState((s) => ({ ...s, paused: false, loading: false }));
    const onPause = () => setAudioState((s) => ({ ...s, paused: true }));
    const onEnded = () => {
      // 자동 다음곡 재생
      playNext();
    };
    const onError = () => {
      setAudioState((s) => ({ ...s, loading: false, paused: true }));
    };

    audio.addEventListener("timeupdate", onTime);
    audio.addEventListener("loadedmetadata", onMeta);
    audio.addEventListener("play", onPlay);
    audio.addEventListener("pause", onPause);
    audio.addEventListener("ended", onEnded);
    audio.addEventListener("error", onError);

    return () => {
      audio.removeEventListener("timeupdate", onTime);
      audio.removeEventListener("loadedmetadata", onMeta);
      audio.removeEventListener("play", onPlay);
      audio.removeEventListener("pause", onPause);
      audio.removeEventListener("ended", onEnded);
      audio.removeEventListener("error", onError);
    };
    // playNext가 의존성이지만 매번 새로 만들어지므로 의도적으로 빈 deps 사용 안 함
    // 대신 useCallback으로 playNext를 메모이즈하여 안정화
  }, [playNext]);

  // 컴포넌트 언마운트 시 오디오 정리
  useEffect(() => {
    return () => {
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.src = "";
      }
    };
  }, []);

  const seek = (e) => {
    if (!audioRef.current || !audioState.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioRef.current.currentTime = ratio * audioState.duration;
  };

  return (
    <div>
      <SectionTitle icon="🎵">개막식 찬양</SectionTitle>
      {HYMNS.opening.map((h, i) => (
        <HymnCard
          key={h.id}
          no={i + 1}
          hymn={h}
          color="#2563eb"
          bg="#eff6ff"
          isPlaying={playingId === h.id && !audioState.paused}
          isCurrent={playingId === h.id}
          loading={playingId === h.id && audioState.loading}
          expanded={expandedId === h.id}
          onPlay={() => playHymn(h)}
          onExpand={() => setExpandedId(expandedId === h.id ? null : h.id)}
          admin={admin}
        />
      ))}

      <SectionTitle icon="🕊️">폐막식 찬양</SectionTitle>
      {HYMNS.closing.map((h, i) => (
        <HymnCard
          key={h.id}
          no={i + 1}
          hymn={h}
          color="#dc2626"
          bg="#fef2f2"
          isPlaying={playingId === h.id && !audioState.paused}
          isCurrent={playingId === h.id}
          loading={playingId === h.id && audioState.loading}
          expanded={expandedId === h.id}
          onPlay={() => playHymn(h)}
          onExpand={() => setExpandedId(expandedId === h.id ? null : h.id)}
          admin={admin}
        />
      ))}

      <SectionTitle icon="✨">은하수축구대회 조건기도</SectionTitle>
      <Card
        style={{
          background: "linear-gradient(135deg,#fff7ed,#fef3c7)",
          border: "1px solid #fcd34d",
        }}
      >
        <div
          style={{
            fontSize: 13,
            color: "#92400e",
            marginBottom: 14,
            lineHeight: 1.6,
            fontStyle: "italic",
          }}
        >
          🙏 선생님의 건강을 지켜주시고, 선생님의 기도가 하나님 뜻대로 다 이루어지길 기도합니다.
        </div>
        {PRAYERS.map((p, i) => (
          <div
            key={i}
            style={{
              display: "flex",
              gap: 10,
              padding: "10px 0",
              borderTop: `1px dashed #fbbf24`,
            }}
          >
            <div
              style={{
                minWidth: 24,
                height: 24,
                borderRadius: "50%",
                background: "#d97706",
                color: "#fff",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 12,
                fontWeight: 800,
                flexShrink: 0,
              }}
            >
              {i + 1}
            </div>
            <div style={{ fontSize: 14, lineHeight: 1.6, color: "#451a03" }}>{p}</div>
          </div>
        ))}
      </Card>

      {/* 고정 플레이어 (하단 네비 위에 떠 있음) */}
      {playingId && (
        <FixedPlayer
          hymn={allHymns.find((h) => h.id === playingId)}
          audioState={audioState}
          onPlayPause={() => {
            if (!audioRef.current) return;
            if (audioRef.current.paused) audioRef.current.play();
            else audioRef.current.pause();
          }}
          onSeek={seek}
          onPrev={playPrev}
          onNext={playNext}
          onClose={() => {
            if (audioRef.current) {
              audioRef.current.pause();
              audioRef.current.src = "";
            }
            setPlayingId(null);
          }}
          canPrev={allHymns.findIndex((h) => h.id === playingId) > 0}
          canNext={allHymns.findIndex((h) => h.id === playingId) < allHymns.length - 1}
        />
      )}
    </div>
  );
}

function HymnUploader({ hymn, color }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) {
      alert("20MB 이하 MP3만 가능합니다");
      return;
    }
    setUploading(true);
    setProgress(0);
    setDone(false);
    try {
      await FB.uploadFile(hymn.storageKey, file, setProgress);
      setDone(true);
      setTimeout(() => setDone(false), 2000);
    } catch (err) {
      alert("업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setProgress(0);
      e.target.value = "";
    }
  };

  return (
    <div style={{ marginTop: 8 }}>
      <input
        ref={inputRef}
        type="file"
        accept="audio/mp3,audio/mpeg"
        onChange={handleFile}
        style={{ display: "none" }}
      />
      <button
        onClick={() => inputRef.current?.click()}
        disabled={uploading}
        style={{
          width: "100%",
          padding: "6px 10px",
          background: done ? C.success : "rgba(255,255,255,.7)",
          border: `1px dashed ${done ? C.success : color}`,
          borderRadius: 6,
          fontSize: 11,
          fontWeight: 700,
          color: done ? "#fff" : color,
          cursor: uploading ? "wait" : "pointer",
        }}
      >
        {done
          ? "✓ 업로드 완료"
          : uploading
          ? `업로드 중 ${progress.toFixed(0)}%`
          : "✏️ MP3 교체 (관리자)"}
      </button>
    </div>
  );
}

function NoticeTab({ notices, admin }) {
  const [composing, setComposing] = useState(false);
  const [editing, setEditing] = useState(null); // notice 객체

  const fmtDate = (ts) => {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return "방금 전";
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    return d.toLocaleString("ko-KR", {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  };

  // 고정 공지 우선 정렬
  const sorted = useMemo(() => {
    const pinned = notices.filter((n) => n.pinned);
    const normal = notices.filter((n) => !n.pinned);
    return [...pinned, ...normal];
  }, [notices]);

  return (
    <div>
      <SectionTitle
        icon="📢"
        action={
          admin.authed && (
            <Btn onClick={() => setComposing(true)}>
              ✏️ 새 공지
            </Btn>
          )
        }
      >
        공지사항
      </SectionTitle>

      {sorted.length === 0 ? (
        <Card>
          <div
            style={{
              textAlign: "center",
              padding: 30,
              color: C.muted,
              fontSize: 14,
            }}
          >
            <div style={{ fontSize: 40, marginBottom: 10 }}>📭</div>
            <div>아직 등록된 공지사항이 없습니다</div>
            {admin.authed && (
              <div style={{ fontSize: 12, marginTop: 6 }}>
                우측 상단 "새 공지" 버튼으로 작성해주세요
              </div>
            )}
          </div>
        </Card>
      ) : (
        sorted.map((n) => (
          <Card
            key={n.fbId}
            style={{
              borderLeft: n.pinned ? `4px solid ${C.danger}` : `1px solid ${C.border}`,
              background: n.pinned ? "#fef2f2" : C.card,
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "flex-start",
                gap: 10,
                marginBottom: 8,
              }}
            >
              <div style={{ flex: 1, minWidth: 0 }}>
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    flexWrap: "wrap",
                    marginBottom: 4,
                  }}
                >
                  {n.pinned && (
                    <span
                      style={{
                        fontSize: 10,
                        background: C.danger,
                        color: "#fff",
                        padding: "2px 6px",
                        borderRadius: 4,
                        fontWeight: 800,
                      }}
                    >
                      📌 고정
                    </span>
                  )}
                  <div style={{ fontSize: 16, fontWeight: 800, color: C.text }}>
                    {n.title}
                  </div>
                </div>
                <div style={{ fontSize: 11, color: C.muted }}>
                  {n.author || "은하수 운영진"} · {fmtDate(n.createdAt)}
                </div>
              </div>
              {admin.authed && (
                <div style={{ display: "flex", gap: 4 }}>
                  <button
                    onClick={() => setEditing(n)}
                    style={{
                      padding: "4px 8px",
                      background: "#eff6ff",
                      border: "1px solid #bfdbfe",
                      borderRadius: 6,
                      fontSize: 11,
                      fontWeight: 700,
                      cursor: "pointer",
                      color: C.primary,
                    }}
                  >
                    ✏️
                  </button>
                  <button
                    onClick={async () => {
                      if (!confirm("공지를 삭제할까요?")) return;
                      try {
                        await FB.deleteNotice(n.fbId);
                      } catch (e) {
                        alert("삭제 실패: " + e.message);
                      }
                    }}
                    style={{
                      padding: "4px 8px",
                      background: "#fef2f2",
                      border: "1px solid #fecaca",
                      borderRadius: 6,
                      fontSize: 11,
                      fontWeight: 700,
                      cursor: "pointer",
                      color: C.danger,
                    }}
                  >
                    🗑
                  </button>
                </div>
              )}
            </div>
            <div
              style={{
                fontSize: 14,
                color: C.text,
                lineHeight: 1.7,
                whiteSpace: "pre-wrap",
              }}
            >
              {n.body}
            </div>
          </Card>
        ))
      )}

      {admin.authed && (
        <NoticeComposeModal
          open={composing || !!editing}
          onClose={() => {
            setComposing(false);
            setEditing(null);
          }}
          notice={editing}
        />
      )}
    </div>
  );
}

function NoticeComposeModal({ open, onClose, notice }) {
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [author, setAuthor] = useState("은하수 운영진");
  const [pinned, setPinned] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (notice) {
      setTitle(notice.title || "");
      setBody(notice.body || "");
      setAuthor(notice.author || "은하수 운영진");
      setPinned(!!notice.pinned);
    } else {
      setTitle("");
      setBody("");
      setAuthor("은하수 운영진");
      setPinned(false);
    }
  }, [notice, open]);

  const save = async () => {
    if (!title.trim() || !body.trim()) {
      alert("제목과 내용을 입력해주세요");
      return;
    }
    setSaving(true);
    try {
      const data = { title: title.trim(), body: body.trim(), author, pinned };
      if (notice) {
        await FB.updateNotice(notice.fbId, data);
      } else {
        await FB.addNotice(data);
      }
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal
      open={open}
      onClose={onClose}
      title={notice ? "✏️ 공지 수정" : "✏️ 새 공지 작성"}
      width={420}
    >
      <Field label="제목">
        <Input value={title} onChange={setTitle} placeholder="공지 제목" />
      </Field>
      <Field label="내용">
        <Textarea
          value={body}
          onChange={setBody}
          placeholder="공지 내용을 입력하세요"
          rows={6}
        />
      </Field>
      <Field label="작성자">
        <Input value={author} onChange={setAuthor} placeholder="작성자명" />
      </Field>
      <label
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          padding: "10px 12px",
          background: "#fef2f2",
          borderRadius: 8,
          cursor: "pointer",
          marginBottom: 12,
        }}
      >
        <input
          type="checkbox"
          checked={pinned}
          onChange={(e) => setPinned(e.target.checked)}
          style={{ width: 16, height: 16, cursor: "pointer" }}
        />
        <div style={{ fontSize: 13, color: C.danger, fontWeight: 700 }}>
          📌 상단 고정
        </div>
      </label>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}
