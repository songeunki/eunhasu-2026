// Firebase는 HTML에서 compat 스크립트로 로드되며, window.firebase 로 사용
const FB = {
  ready: false,
  db: null,
  storage: null,

  init() {
    if (this.ready) return true;
    if (typeof window === "undefined" || !window.firebase) return false;
    try {
      const config = {
        apiKey: "AIzaSyD68up8_xI6vg1n0GNOUv4do9TfnZvIScg",
        authDomain: "eunhasu-2026.firebaseapp.com",
        projectId: "eunhasu-2026",
        storageBucket: "eunhasu-2026.firebasestorage.app",
        messagingSenderId: "553247461294",
        appId: "1:553247461294:web:41cf7829f264002c58423f",
      };
      if (!window.firebase.apps.length) {
        window.firebase.initializeApp(config);
      }
      this.db = window.firebase.firestore();
      this.storage = window.firebase.storage ? window.firebase.storage() : null;
      this.ready = true;
      return true;
    } catch (e) {
      console.error("Firebase 초기화 실패:", e);
      return false;
    }
  },

  // ----- Firestore: 정보 문서 -----
  watchInfo(cb) {
    if (!this.init()) return () => {};
    return this.db.collection("kickoff").doc("info").onSnapshot(
      (snap) => {
        if (snap.exists) cb(snap.data());
        else cb(null);
      },
      (err) => console.error("watchInfo:", err)
    );
  },
  saveInfo(data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff").doc("info").set(data, { merge: true });
  },

  // ----- 공지사항 -----
  watchNotices(cb) {
    if (!this.init()) return () => {};
    return this.db
      .collection("kickoff_notices")
      .orderBy("createdAt", "desc")
      .onSnapshot(
        (snap) => {
          const list = snap.docs.map((d) => ({ fbId: d.id, ...d.data() }));
          cb(list);
        },
        (err) => console.error("watchNotices:", err)
      );
  },
  addNotice(data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").add({
      ...data,
      createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
    });
  },
  updateNotice(fbId, data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").doc(fbId).update(data);
  },
  deleteNotice(fbId) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff_notices").doc(fbId).delete();
  },

  // ----- 범용 단일 문서 watch/save (teams, matches, hymns, prayers, ...) -----
  watchDoc(docId, cb) {
    if (!this.init()) return () => {};
    return this.db.collection("kickoff").doc(docId).onSnapshot(
      (snap) => {
        if (snap.exists) cb(snap.data());
        else cb(null);
      },
      (err) => console.error("watchDoc " + docId + ":", err)
    );
  },
  saveDoc(docId, data) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff").doc(docId).set(data, { merge: false });
  },
  // 한 번만 (초기 데이터 시드용)
  getDoc(docId) {
    if (!this.init()) return Promise.reject("Firebase not ready");
    return this.db.collection("kickoff").doc(docId).get().then((snap) => {
      return snap.exists ? snap.data() : null;
    });
  },

  // ----- Storage: 파일 업로드 -----
  uploadFile(path, file, onProgress) {
    if (!this.init() || !this.storage) return Promise.reject("Storage not ready");
    return new Promise((resolve, reject) => {
      const ref = this.storage.ref(path);
      const task = ref.put(file);
      task.on(
        "state_changed",
        (snap) => {
          const p = (snap.bytesTransferred / snap.totalBytes) * 100;
          if (onProgress) onProgress(p);
        },
        (err) => reject(err),
        () => {
          task.snapshot.ref.getDownloadURL().then(resolve).catch(reject);
        }
      );
    });
  },
  getDownloadURL(path) {
    if (!this.init() || !this.storage) return Promise.reject("Storage not ready");
    return this.storage.ref(path).getDownloadURL();
  },
};

  const changePassword = useCallback((oldPw, newPw) => {

  return { isAdminMode, authed, login, logout, changePassword };

// 유틸

function parseTime(str) {
  if (!str) return [0, 0];
  const [s, e] = str.split("~");
  const toMin = (t) => {
    const [h, m] = t.trim().split(":").map(Number);
    return h * 60 + m;
  };
  return [toMin(s), toMin(e)];
}

function isMatchLive(times, curMin, isToday) {
  if (!isToday) return false;
  for (const t of times) {
    if (!t) continue;
    const [s, e] = parseTime(t);
    if (curMin >= s && curMin <= e) return true;
  }
  return false;
}

function isMatchDone(times, curMin, isToday) {
  if (!isToday) return false;
  const lastEnd = Math.max(...times.filter(Boolean).map((t) => parseTime(t)[1]));
  return curMin > lastEnd;
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, "0")}`;
}

// 이미지 압축 (긴 변 1600px, JPEG 품질 80%)
// 업로드 속도와 다운로드 속도를 크게 개선
function compressImage(file, maxSize = 1600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    // 이미지가 아니면 원본 그대로 반환
    if (!file.type.startsWith("image/")) {
      resolve(file);
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        // 긴 변 기준으로 리사이즈 (원본이 더 작으면 그대로)
        if (width > maxSize || height > maxSize) {
          if (width >= height) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(
          (blob) => {
            if (!blob) {
              resolve(file); // 실패 시 원본
              return;
            }
            // 압축본이 원본보다 크면 원본 사용
            if (blob.size >= file.size) {
              resolve(file);
              return;
            }
            // Blob → File 로 변환 (이름 유지, 확장자 jpg)
            const newName = file.name.replace(/\.[^.]+$/, "") + ".jpg";
            const compressed = new File([blob], newName, {
              type: "image/jpeg",
              lastModified: Date.now(),
            });
            resolve(compressed);
          },
          "image/jpeg",
          quality
        );
      };
      img.onerror = () => resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("파일 읽기 실패"));
    reader.readAsDataURL(file);
  });
}

// 전체화면 사진 슬라이드 뷰어 (스와이프 + 화살표 + 인디케이터)
function PhotoViewer({ images, startIndex = 0, onClose }) {
  const [idx, setIdx] = useState(startIndex);
  const [scale, setScale] = useState(1);
  const [tx, setTx] = useState(0); // 이동 X
  const [ty, setTy] = useState(0); // 이동 Y

  const total = images.length;

  // 제스처 추적용 ref
  const touchStartX = useRef(null);
  const touchEndX = useRef(null);
  const pinchStartDist = useRef(null);
  const pinchStartScale = useRef(1);
  const panStart = useRef(null); // { x, y, tx, ty }
  const lastTap = useRef(0);

  const resetZoom = useCallback(() => {
    setScale(1);
    setTx(0);
    setTy(0);
  }, []);

  const goPrev = useCallback(() => {
    setIdx((i) => (i > 0 ? i - 1 : i));
    resetZoom();
  }, [resetZoom]);
  const goNext = useCallback(() => {
    setIdx((i) => (i < total - 1 ? i + 1 : i));
    resetZoom();
  }, [total, resetZoom]);

  // 키보드 조작
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "ArrowLeft") goPrev();
      else if (e.key === "ArrowRight") goNext();
      else if (e.key === "Escape") onClose();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [goPrev, goNext, onClose]);

  // 두 손가락 거리 계산
  const getDist = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  };

  const onTouchStart = (e) => {
    if (e.touches.length === 2) {
      // 핀치 시작
      pinchStartDist.current = getDist(e.touches);
      pinchStartScale.current = scale;
      touchStartX.current = null;
    } else if (e.touches.length === 1) {
      if (scale > 1) {
        // 확대 상태: 팬 시작
        panStart.current = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY,
          tx,
          ty,
        };
      } else {
        // 일반 상태: 스와이프 추적
        touchStartX.current = e.touches[0].clientX;
        touchEndX.current = null;
      }
      // 더블탭 감지
      const now = Date.now();
      if (now - lastTap.current < 300) {
        // 더블탭 → 줌 토글
        if (scale > 1) {
          resetZoom();
        } else {
          setScale(2.5);
        }
        lastTap.current = 0;
      } else {
        lastTap.current = now;
      }
    }
  };

  const onTouchMove = (e) => {
    if (e.touches.length === 2 && pinchStartDist.current) {
      // 핀치 줌
      e.preventDefault();
      const dist = getDist(e.touches);
      const ratio = dist / pinchStartDist.current;
      let newScale = pinchStartScale.current * ratio;
      newScale = Math.max(1, Math.min(newScale, 4)); // 1~4배 제한
      setScale(newScale);
      if (newScale === 1) {
        setTx(0);
        setTy(0);
      }
    } else if (e.touches.length === 1) {
      if (scale > 1 && panStart.current) {
        // 팬 (확대 상태 이동)
        e.preventDefault();
        const dx = e.touches[0].clientX - panStart.current.x;
        const dy = e.touches[0].clientY - panStart.current.y;
        // 이동 범위 제한 (확대 비율에 비례)
        const maxOffset = (scale - 1) * 200;
        setTx(Math.max(-maxOffset, Math.min(maxOffset, panStart.current.tx + dx)));
        setTy(Math.max(-maxOffset, Math.min(maxOffset, panStart.current.ty + dy)));
      } else if (scale === 1) {
        // 스와이프 추적
        touchEndX.current = e.touches[0].clientX;
      }
    }
  };

  const onTouchEnd = (e) => {
    // 핀치 종료
    if (pinchStartDist.current && e.touches.length < 2) {
      pinchStartDist.current = null;
    }
    // 팬 종료
    if (panStart.current && e.touches.length === 0) {
      panStart.current = null;
    }
    // 스와이프 판정 (줌 안 된 상태에서만)
    if (scale === 1 && touchStartX.current != null && touchEndX.current != null) {
      const diff = touchStartX.current - touchEndX.current;
      const threshold = 50;
      if (diff > threshold) goNext();
      else if (diff < -threshold) goPrev();
    }
    touchStartX.current = null;
    touchEndX.current = null;
  };

  if (!images || total === 0) return null;

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(0,0,0,0.92)",
        zIndex: 2000,
        display: "flex",
        flexDirection: "column",
      }}
      onClick={onClose}
    >
      {/* 상단 바 */}
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          padding: "16px 18px",
          color: "#fff",
          flexShrink: 0,
        }}
        onClick={(e) => e.stopPropagation()}
      >
        <div style={{ fontSize: 15, fontWeight: 700 }}>
          {idx + 1} / {total}
          {scale > 1 && (
            <span style={{ fontSize: 12, opacity: 0.7, marginLeft: 8 }}>
              {scale.toFixed(1)}x
            </span>
          )}
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          {scale > 1 && (
            <button
              onClick={resetZoom}
              style={{
                height: 40,
                padding: "0 14px",
                background: "rgba(255,255,255,0.15)",
                border: "none",
                borderRadius: 20,
                color: "#fff",
                fontSize: 13,
                fontWeight: 700,
                cursor: "pointer",
              }}
            >
              원래대로
            </button>
          )}
          <button
            onClick={onClose}
            style={{
              width: 40,
              height: 40,
              background: "rgba(255,255,255,0.15)",
              border: "none",
              borderRadius: 20,
              color: "#fff",
              fontSize: 22,
              cursor: "pointer",
              lineHeight: 1,
            }}
          >
            ×
          </button>
        </div>
      </div>

      {/* 이미지 영역 */}
      <div
        style={{
          flex: 1,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          position: "relative",
          overflow: "hidden",
          touchAction: "none",
        }}
        onClick={(e) => e.stopPropagation()}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        <img
          src={images[idx]}
          alt={`사진 ${idx + 1}`}
          style={{
            maxWidth: "100%",
            maxHeight: "100%",
            objectFit: "contain",
            userSelect: "none",
            transform: `translate(${tx}px, ${ty}px) scale(${scale})`,
            transition: panStart.current || pinchStartDist.current ? "none" : "transform .2s",
            cursor: scale > 1 ? "move" : "zoom-in",
          }}
          draggable={false}
          onDoubleClick={() => {
            // PC 더블클릭 줌
            if (scale > 1) resetZoom();
            else setScale(2.5);
          }}
        />

        {/* 화살표 (줌 안 된 상태에서만) */}
        {scale === 1 && idx > 0 && (
          <button
            onClick={goPrev}
            style={{
              position: "absolute",
              left: 12,
              top: "50%",
              transform: "translateY(-50%)",
              width: 44,
              height: 44,
              background: "rgba(255,255,255,0.2)",
              border: "none",
              borderRadius: 22,
              color: "#fff",
              fontSize: 22,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
            }}
          >
            ‹
          </button>
        )}
        {scale === 1 && idx < total - 1 && (
          <button
            onClick={goNext}
            style={{
              position: "absolute",
              right: 12,
              top: "50%",
              transform: "translateY(-50%)",
              width: 44,
              height: 44,
              background: "rgba(255,255,255,0.2)",
              border: "none",
              borderRadius: 22,
              color: "#fff",
              fontSize: 22,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
            }}
          >
            ›
          </button>
        )}
      </div>

      {/* 하단 인디케이터 (줌 안 된 상태에서만) */}
      {scale === 1 && total > 1 && (
        <div
          style={{
            display: "flex",
            justifyContent: "center",
            gap: 8,
            padding: "16px 0 12px",
            flexShrink: 0,
          }}
          onClick={(e) => e.stopPropagation()}
        >
          {images.map((_, i) => (
            <button
              key={i}
              onClick={() => {
                setIdx(i);
                resetZoom();
              }}
              style={{
                width: i === idx ? 24 : 8,
                height: 8,
                borderRadius: 4,
                background: i === idx ? "#fff" : "rgba(255,255,255,0.4)",
                border: "none",
                cursor: "pointer",
                transition: "all .2s",
                padding: 0,
              }}
            />
          ))}
        </div>
      )}

      <div
        style={{
          textAlign: "center",
          color: "rgba(255,255,255,0.5)",
          fontSize: 12,
          paddingBottom: 16,
        }}
        onClick={(e) => e.stopPropagation()}
      >
        {scale > 1 ? "끌어서 이동 · 더블탭으로 원래대로" : "두 손가락으로 확대 · 더블탭 확대"}
      </div>
    </div>
  );
}

function MapUploader({ onUploaded }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    setProgress(0);
    try {
      // 지도는 디테일이 중요하므로 2000px로 압축
      const compressed = await compressImage(file, 2000, 0.85).catch(() => file);
      if (compressed.size > 10 * 1024 * 1024) {
        alert("압축 후에도 10MB를 초과합니다");
        setUploading(false);
        return;
      }
      const url = await FB.uploadFile("map/aerial.jpg", compressed, setProgress);
      onUploaded(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
      alert("업로드 완료");
    } catch (err) {
      alert("업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setProgress(0);
      e.target.value = "";
    }
  };

  return (
    <>
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        onChange={handleFile}
        style={{ display: "none" }}
      />
      <button
        onClick={() => inputRef.current?.click()}
        disabled={uploading}
        style={{
          padding: "5px 10px",
          background: C.primary,
          color: "#fff",
          border: "none",
          borderRadius: 6,
          fontSize: 12,
          fontWeight: 700,
          cursor: uploading ? "wait" : "pointer",
        }}
      >
        {uploading ? `업로드 ${progress.toFixed(0)}%` : "✏️ 지도 교체"}
      </button>
    </>
  );
}

function OrderTab({ info, now, admin }) {
  const [editOpen, setEditOpen] = useState(null); // 'opening' | 'closing'

  const isToday = useMemo(() => {
    return now.toISOString().slice(0, 10) === info.dateISO;
  }, [now, info.dateISO]);

  const curMin = now.getHours() * 60 + now.getMinutes();

  // 진행 중인 단계 판별
  const currentIdx = useMemo(() => {
    if (!isToday) return -1;
    if (curMin < 590) return -1; // 9:50 이전
    if (curMin < 600) return 0; // 9:50~10:00 집합
    if (curMin < 650) return 1; // 10:00~10:50 개회
    if (curMin < 960) return 2; // 11:00~16:00 경기
    if (curMin < 990) return 3; // 16:00~16:30 폐회
    return -1;
  }, [isToday, curMin]);

  return (
    <div>
      <SectionTitle icon="📋">대회 순서</SectionTitle>

      {!isToday && (
        <Card style={{ background: "#fef3c7", border: "1px solid #fcd34d" }}>

            ⏳ 대회 당일이 되면 현재 진행 중인 순서가 자동으로 표시됩니다.
          </div>
        </Card>
      )}

      {/* 집합 */}
      <OrderItem
        icon="👕"
        time="09:50"
        title="운동장 집합"
        desc="운동복 착용 후 운동장에 집합해주세요"
        color="#64748b"
        active={currentIdx === 0}
      />

      {/* 개회예배 */}
      <OrderItem
        icon="🙏"
        time={info.opening?.time || "10:00 ~ 10:50"}
        title="개회예배"
        desc={`사회: ${info.host || ""}`}
        color="#2563eb"
        active={currentIdx === 1}
        details={[
          { label: "준비찬양", value: info.opening?.prepHymn },
          { label: "대표기도", value: info.opening?.representative },
          { label: "말씀", value: info.opening?.sermon },
          { label: "선서", value: info.opening?.oath },
          { label: "개회선언", value: info.opening?.declaration },
          { label: "사진촬영", value: info.opening?.photo },
        ]}
        onEdit={admin.authed ? () => setEditOpen("opening") : null}
      />

      {/* 경기 */}
      <OrderItem
        icon="⚽"
        time="11:00 ~ 16:00"
        title="경기 진행"
        desc="제1·2구장 동시 진행 · 페이스페인팅·부채만들기 부스 운영"
        color="#16a34a"
        active={currentIdx === 2}
      />

      {/* 폐회식 */}
      <OrderItem
        icon="🏆"
        time={info.closing?.time || "16:00 ~ 16:30"}
        title="폐회 및 시상식"
        desc={`사회: ${info.host || ""}`}
        color="#dc2626"
        active={currentIdx === 3}
        details={[
          { label: "준비찬양", value: info.closing?.prepHymn },
          { label: "치어", value: info.closing?.cheer },

      {/* 편집 모달 */}

        <OrderEditModal
          open={!!editOpen}
          onClose={() => setEditOpen(null)}

// 대진표 이미지 업로더 (관리자 전용)
function MatchImageUploader({ storageKey, onUploaded }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    setProgress(0);
    try {
      // 대진표는 글자 가독성이 중요하므로 2000px, 품질 88%
      const compressed = await compressImage(file, 2000, 0.88).catch(() => file);
      if (compressed.size > 10 * 1024 * 1024) {
        alert("압축 후에도 10MB를 초과합니다");
        setUploading(false);
        return;
      }
      const url = await FB.uploadFile(storageKey, compressed, setProgress);
      // 캐시 무력화를 위해 timestamp 쿼리 추가
      onUploaded(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now());
      alert("대진표 이미지 업로드 완료");
    } catch (err) {
      alert("업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setProgress(0);
      e.target.value = "";
    }
  };

  return (
    <>
      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        onChange={handleFile}
        style={{ display: "none" }}
      />
      <button
        onClick={() => inputRef.current?.click()}
        disabled={uploading}
        style={{
          padding: "5px 10px",
          background: C.primary,
          color: "#fff",
          border: "none",
          borderRadius: 6,
          fontSize: 12,
          fontWeight: 700,
          cursor: uploading ? "wait" : "pointer",
        }}
      >
        {uploading ? `업로드 ${progress.toFixed(0)}%` : "✏️ 이미지 교체"}
      </button>
    </>
  );
}

function HymnTab({ hymns, prayers, admin }) {
  const [playingId, setPlayingId] = useState(null);
  const [audioState, setAudioState] = useState({
    duration: 0,
    currentTime: 0,
    paused: true,
    loading: false,
  });
  const [urlCache, setUrlCache] = useState({});
  const [expandedId, setExpandedId] = useState(null);
  const [editHymn, setEditHymn] = useState(null); // 편집 중인 곡
  const [addingTo, setAddingTo] = useState(null); // 'opening' | 'closing' 추가 모드
  const [prayersEditOpen, setPrayersEditOpen] = useState(false);

  const audioRef = useRef(null);

  const opening = hymns.opening || [];
  const closing = hymns.closing || [];
  const allHymns = useMemo(() => [...opening, ...closing], [opening, closing]);

  // 곡 재생 시작
  const playHymn = useCallback(
    async (hymn) => {
      // 현재 같은 곡이 재생 중이면 일시정지/재개
      if (playingId === hymn.id && audioRef.current) {
        if (audioRef.current.paused) {
          audioRef.current.play();
        } else {
          audioRef.current.pause();
        }
        return;
      }

      // 새 곡 재생: URL 가져오기
      setAudioState((s) => ({ ...s, loading: true, paused: true }));
      setPlayingId(hymn.id);

      let url = urlCache[hymn.id];
      if (!url) {
        try {
          url = await FB.getDownloadURL(hymn.storageKey);
          setUrlCache((c) => ({ ...c, [hymn.id]: url }));
        } catch (e) {
          alert(`음원을 불러올 수 없습니다.\n(${hymn.title})\n파일이 업로드되지 않았을 수 있습니다.`);
          setPlayingId(null);
          setAudioState((s) => ({ ...s, loading: false }));
          return;
        }
      }

      // audio 엘리먼트 준비
      if (!audioRef.current) {
        audioRef.current = new Audio();
      }
      audioRef.current.src = url;
      audioRef.current.play().catch((err) => {
        console.error("재생 실패:", err);
      });
    },
    [playingId, urlCache]
  );

  // 다음/이전 곡
  const playNext = useCallback(() => {
    if (!playingId) return;
    const idx = allHymns.findIndex((h) => h.id === playingId);
    if (idx >= 0 && idx < allHymns.length - 1) {
      playHymn(allHymns[idx + 1]);
    }
  }, [playingId, allHymns, playHymn]);

  const playPrev = useCallback(() => {
    if (!playingId) return;
    const idx = allHymns.findIndex((h) => h.id === playingId);
    if (idx > 0) {
      playHymn(allHymns[idx - 1]);
    }
  }, [playingId, allHymns, playHymn]);

  // audio 이벤트 핸들러
  useEffect(() => {
    if (!audioRef.current) return;
    const audio = audioRef.current;

    const onTime = () =>
      setAudioState((s) => ({ ...s, currentTime: audio.currentTime }));
    const onMeta = () =>
      setAudioState((s) => ({ ...s, duration: audio.duration, loading: false }));
    const onPlay = () => setAudioState((s) => ({ ...s, paused: false, loading: false }));
    const onPause = () => setAudioState((s) => ({ ...s, paused: true }));
    const onEnded = () => {
      // 자동 다음곡 재생
      playNext();
    };
    const onError = () => {
      setAudioState((s) => ({ ...s, loading: false, paused: true }));
    };

    audio.addEventListener("timeupdate", onTime);
    audio.addEventListener("loadedmetadata", onMeta);
    audio.addEventListener("play", onPlay);
    audio.addEventListener("pause", onPause);
    audio.addEventListener("ended", onEnded);
    audio.addEventListener("error", onError);

    return () => {
      audio.removeEventListener("timeupdate", onTime);
      audio.removeEventListener("loadedmetadata", onMeta);
      audio.removeEventListener("play", onPlay);
      audio.removeEventListener("pause", onPause);
      audio.removeEventListener("ended", onEnded);
      audio.removeEventListener("error", onError);
    };
    // playNext가 의존성이지만 매번 새로 만들어지므로 의도적으로 빈 deps 사용 안 함
    // 대신 useCallback으로 playNext를 메모이즈하여 안정화
  }, [playNext]);

  // 컴포넌트 언마운트 시 오디오 정리
  useEffect(() => {
    return () => {
      if (audioRef.current) {
        audioRef.current.pause();
        audioRef.current.src = "";
      }
    };
  }, []);

  const seek = (e) => {
    if (!audioRef.current || !audioState.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    audioRef.current.currentTime = ratio * audioState.duration;
  };

  return (
    <div>
      <SectionTitle
        icon="🎵"
        action={

            <Btn onClick={() => setAddingTo("opening")} variant="ghost">

          isCurrent={playingId === h.id}
          loading={playingId === h.id && audioState.loading}
          expanded={expandedId === h.id}
          onPlay={() => playHymn(h)}
          onExpand={() => setExpandedId(expandedId === h.id ? null : h.id)}
          onEdit={() => setEditHymn({ ...h, _section: "opening", _index: i })}
          admin={admin}
        />
      ))}

      <SectionTitle
        icon="🕊️"
        action={
          admin.authed && (
            <Btn onClick={() => setAddingTo("closing")} variant="ghost">
              + 곡 추가
            </Btn>
          )
        }
      >
        폐막식 찬양
      </SectionTitle>
      {closing.map((h, i) => (
        <HymnCard

      </SectionTitle>
      <Card

        }}

function HymnUploader({ hymn, color }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 20 * 1024 * 1024) {
      alert("20MB 이하 MP3만 가능합니다");
      return;
    }
    setUploading(true);
    setProgress(0);
    setDone(false);
    try {
      await FB.uploadFile(hymn.storageKey, file, setProgress);
      setDone(true);
      setTimeout(() => setDone(false), 2000);
    } catch (err) {
      alert("업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setProgress(0);
      e.target.value = "";
    }
  };

  return (
    <div style={{ marginTop: 8 }}>
      <input
        ref={inputRef}
        type="file"
        accept="audio/mp3,audio/mpeg"
        onChange={handleFile}
        style={{ display: "none" }}
      />
      <button
        onClick={() => inputRef.current?.click()}
        disabled={uploading}
        style={{
          width: "100%",
          padding: "6px 10px",
          background: done ? C.success : "rgba(255,255,255,.7)",
          border: `1px dashed ${done ? C.success : color}`,
          borderRadius: 6,
          fontSize: 12,
          fontWeight: 700,
          color: done ? "#fff" : color,
          cursor: uploading ? "wait" : "pointer",
        }}
      >
        {done
          ? "✓ 업로드 완료"
          : uploading
          ? `업로드 중 ${progress.toFixed(0)}%`
          : "✏️ MP3 교체 (관리자)"}
      </button>
    </div>
  );
}

function NoticeTab({ notices, admin }) {
  const [composing, setComposing] = useState(false);
  const [editing, setEditing] = useState(null); // notice 객체
  // 사진 뷰어 상태: { images: [...], index: n } 또는 null
  const [viewer, setViewer] = useState(null);

  const fmtDate = (ts) => {
    if (!ts) return "";
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return "방금 전";
    if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
    return d.toLocaleString("ko-KR", {
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  };

  // 고정 공지 우선 정렬
  const sorted = useMemo(() => {
    const pinned = notices.filter((n) => n.pinned);
    const normal = notices.filter((n) => !n.pinned);
    return [...pinned, ...normal];
  }, [notices]);

  return (
    <div>
      <SectionTitle
        icon="📢"

          </div>
        </Card>
      ) : (
        sorted.map((n) => (
          <Card
            key={n.fbId}
            style={{

                  {n.pinned && (

                  <div style={{ fontSize: 18, fontWeight: 800, color: C.text }}>
                    {n.title}

                <div style={{ fontSize: 12, color: C.muted }}>
                  {n.author || "은하수 운영진"} · {fmtDate(n.createdAt)}

                    style={{

                lineHeight: 1.7,

              <div
                style={{
                  display: "grid",
                  gridTemplateColumns:
                    n.images.length === 1 ? "1fr" : "1fr 1fr",

                  marginTop: 12,

                  <img
                    key={ii}
                    src={url}
                    alt={`공지 사진 ${ii + 1}`}

                      objectFit: n.images.length === 1 ? "contain" : "cover",

      {/* 사진 전체화면 슬라이드 뷰어 */}
      {viewer && (
        <PhotoViewer
          images={viewer.images}
          startIndex={viewer.index}
          onClose={() => setViewer(null)}
        />
      )}
    </div>
  );
}

function NoticeComposeModal({ open, onClose, notice }) {
  const [title, setTitle] = useState("");
  const [body, setBody] = useState("");
  const [author, setAuthor] = useState("은하수 운영진");
  const [pinned, setPinned] = useState(false);
  const [saving, setSaving] = useState(false);
  const [images, setImages] = useState([]); // 이미지 URL 배열
  const [uploading, setUploading] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [uploadStage, setUploadStage] = useState("");
  const imgInputRef = useRef(null);
  // 신규 공지용 임시 ID (Storage 경로에 사용)
  const draftIdRef = useRef(null);

  const MAX_IMAGES = 5;

  useEffect(() => {
    if (notice) {
      setTitle(notice.title || "");
      setBody(notice.body || "");
      setAuthor(notice.author || "은하수 운영진");
      setPinned(!!notice.pinned);
      setImages(Array.isArray(notice.images) ? [...notice.images] : []);
      draftIdRef.current = notice.fbId;
    } else {
      setTitle("");
      setBody("");
      setAuthor("은하수 운영진");
      setPinned(false);
      setImages([]);
      // 신규 작성: 임시 ID 생성 (Storage 폴더명)
      draftIdRef.current = "draft_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    }
  }, [notice, open]);

  // 이미지 업로드 (압축 후 병렬 업로드)
  const handleImageSelect = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    if (images.length + files.length > MAX_IMAGES) {
      alert(`사진은 최대 ${MAX_IMAGES}장까지 첨부할 수 있습니다`);
      e.target.value = "";
      return;
    }
    setUploading(true);
    try {
      const folderId = draftIdRef.current;

      // 1) 모든 사진 동시 압축
      setUploadStage("압축 중");
      const compressedFiles = await Promise.all(
        files.map((f) => compressImage(f, 1600, 0.8).catch(() => f))
      );

      // 2) 압축본을 병렬 업로드
      setUploadStage("업로드 중");
      let completed = 0;
      const total = compressedFiles.length;
      const uploadPromises = compressedFiles.map((file, i) => {
        if (file.size > 10 * 1024 * 1024) {
          alert(`"${file.name}"은 압축 후에도 10MB를 초과해 건너뜁니다`);
          return Promise.resolve(null);
        }
        const fname = `notices/${folderId}/${Date.now()}_${i}_${file.name.replace(/[^\w.\-]/g, "_")}`;
        return FB.uploadFile(fname, file, null)
          .then((url) => {
            completed++;
            setUploadProgress(Math.round((completed / total) * 100));
            return url;
          })
          .catch((err) => {
            console.error("업로드 실패:", err);
            return null;
          });
      });

      const urls = (await Promise.all(uploadPromises)).filter(Boolean);
      setImages((prev) => [...prev, ...urls]);
    } catch (err) {
      alert("사진 업로드 실패: " + err.message);
    } finally {
      setUploading(false);
      setUploadProgress(0);
      setUploadStage("");
      e.target.value = "";
    }
  };

  const removeImage = (idx) => {
    if (!confirm("이 사진을 목록에서 제거할까요?")) return;
    setImages((prev) => prev.filter((_, i) => i !== idx));
  };

  const moveImage = (idx, dir) => {
    setImages((prev) => {
      const arr = [...prev];
      const ni = idx + dir;
      if (ni < 0 || ni >= arr.length) return prev;
      [arr[idx], arr[ni]] = [arr[ni], arr[idx]];
      return arr;
    });
  };

  const save = async () => {
    if (!title.trim() || !body.trim()) {
      alert("제목과 내용을 입력해주세요");
      return;
    }
    if (uploading) {
      alert("사진 업로드가 끝난 후 저장해주세요");
      return;
    }
    setSaving(true);
    try {
      const data = { title: title.trim(), body: body.trim(), author, pinned, images };
      if (notice) {
        await FB.updateNotice(notice.fbId, data);
      } else {
        await FB.addNotice(data);
      }
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal
      open={open}
      onClose={onClose}
      title={notice ? "✏️ 공지 수정" : "✏️ 새 공지 작성"}
      width={420}
    >
      <Field label="제목">
        <Input value={title} onChange={setTitle} placeholder="공지 제목" />
      </Field>
      <Field label="내용">
        <Textarea
          value={body}
          onChange={setBody}
          placeholder="공지 내용을 입력하세요"
          rows={6}
        />
      </Field>
      <Field label="작성자">
        <Input value={author} onChange={setAuthor} placeholder="작성자명" />
      </Field>

      {/* 사진 첨부 */}
      <div style={{ marginBottom: 12 }}>
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            marginBottom: 6,
          }}
        >
          <div style={{ fontSize: 12, color: C.sub, fontWeight: 700 }}>
            📷 사진 첨부 ({images.length}/{MAX_IMAGES})
          </div>
          <button
            onClick={() => imgInputRef.current?.click()}
            disabled={uploading || images.length >= MAX_IMAGES}
            style={{
              padding: "5px 12px",
              background: images.length >= MAX_IMAGES ? C.muted : C.primary,
              color: "#fff",
              border: "none",
              borderRadius: 6,
              fontSize: 12,
              fontWeight: 700,
              cursor: uploading || images.length >= MAX_IMAGES ? "not-allowed" : "pointer",
            }}
          >
            {uploading
              ? uploadStage === "압축 중"
                ? "🗜 압축 중..."
                : `⬆ 업로드 ${uploadProgress}%`
              : "+ 사진 추가"}
          </button>
        </div>
        <input
          ref={imgInputRef}
          type="file"
          accept="image/*"
          multiple
          onChange={handleImageSelect}
          style={{ display: "none" }}
        />
        {images.length === 0 ? (
          <div
            style={{
              padding: 16,
              textAlign: "center",
              background: C.soft,
              borderRadius: 8,
              color: C.muted,
              fontSize: 12,
              border: `1px dashed ${C.border}`,
            }}
          >
            첨부된 사진이 없습니다
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {images.map((url, idx) => (
              <div
                key={idx}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  background: C.soft,
                  padding: 6,
                  borderRadius: 8,
                  border: `1px solid ${C.border}`,
                }}
              >
                <img
                  src={url}
                  alt={`첨부 ${idx + 1}`}
                  style={{
                    width: 48,
                    height: 48,
                    objectFit: "cover",
                    borderRadius: 6,
                    flexShrink: 0,
                  }}
                />
                <div style={{ flex: 1, fontSize: 12, color: C.sub }}>
                  사진 {idx + 1}
                </div>
                <button
                  onClick={() => moveImage(idx, -1)}
                  disabled={idx === 0}
                  style={{
                    width: 28,
                    height: 28,
                    background: "#fff",
                    border: `1px solid ${C.border}`,
                    borderRadius: 6,
                    cursor: idx === 0 ? "not-allowed" : "pointer",
                    opacity: idx === 0 ? 0.4 : 1,
                    fontSize: 12,
                  }}
                >
                  ▲
                </button>
                <button
                  onClick={() => moveImage(idx, 1)}
                  disabled={idx === images.length - 1}
                  style={{
                    width: 28,
                    height: 28,
                    background: "#fff",
                    border: `1px solid ${C.border}`,
                    borderRadius: 6,
                    cursor: idx === images.length - 1 ? "not-allowed" : "pointer",
                    opacity: idx === images.length - 1 ? 0.4 : 1,
                    fontSize: 12,
                  }}
                >
                  ▼
                </button>
                <button
                  onClick={() => removeImage(idx)}
                  style={{
                    width: 28,
                    height: 28,
                    background: "#fef2f2",
                    border: "1px solid #fecaca",
                    borderRadius: 6,
                    cursor: "pointer",
                    color: C.danger,
                    fontSize: 12,
                  }}
                >
                  🗑
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      <label
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          padding: "10px 12px",
          background: "#fef2f2",
          borderRadius: 8,
          cursor: "pointer",
          marginBottom: 12,
        }}
      >
        <input
          type="checkbox"
          checked={pinned}
          onChange={(e) => setPinned(e.target.checked)}
          style={{ width: 16, height: 16, cursor: "pointer" }}
        />
        <div style={{ fontSize: 15, color: C.danger, fontWeight: 700 }}>
          📌 상단 고정
        </div>
      </label>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

        onClick={onUp}
        disabled={idx === 0}
        style={{
          width: 28,

          fontSize: 13,

        ▲
      </button>
      <button
        onClick={onDown}
        disabled={idx === total - 1}
        style={{
          width: 28,
          height: 28,
          background: "#fff",
          border: `1px solid ${C.border}`,
          borderRadius: 6,

}

// ----- 1) 참가팀 편집 -----
function TeamsEditModal({ open, onClose, teams }) {
  const [form, setForm] = useState(teams);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (open) setForm(JSON.parse(JSON.stringify(teams)));
  }, [teams, open]);

  const save = async () => {
    setSaving(true);
    try {
      await FB.saveDoc("teams", form);
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const updateTeam = (group, idx, key, value) => {
    setForm((f) => {
      const next = { ...f };
      next[group] = [...next[group]];
      next[group][idx] = { ...next[group][idx], [key]: value };
      return next;
    });
  };

  const addTeam = (group) => {
    setForm((f) => {
      const next = { ...f };
      const prefix = group === "U9" ? "B" : group === "U11" ? "A" : "C";
      const nextNum = (next[group]?.length || 0) + 1;
      next[group] = [
        ...(next[group] || []),
        { code: `${prefix}${nextNum}`, name: "새 팀", emoji: "⚽", color: "#3498db" },
      ];
      return next;
    });
  };

  const removeTeam = (group, idx) => {
    if (!confirm("이 팀을 삭제하시겠어요? (대진표의 해당 팀도 영향받을 수 있습니다)")) return;
    setForm((f) => {
      const next = { ...f };
      next[group] = next[group].filter((_, i) => i !== idx);
      return next;
    });
  };

  const moveTeam = (group, idx, dir) => {
    setForm((f) => {
      const next = { ...f };
      const arr = [...next[group]];
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= arr.length) return f;
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      next[group] = arr;
      return next;
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="👥 참가팀 편집" width={460}>
      {[
        { key: "U9", label: "U-9 (1~2학년)", color: "#0891b2" },
        { key: "U11", label: "U-11 (3~4학년)", color: "#2563eb" },
        { key: "U13", label: "U-13 (5~6학년)", color: "#ea580c" },
      ].map((g) => (
        <div key={g.key} style={{ marginBottom: 16 }}>
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              marginBottom: 6,
            }}
          >
            <div style={{ fontSize: 15, fontWeight: 700, color: g.color }}>{g.label}</div>
            <button
              onClick={() => addTeam(g.key)}
              style={{
                padding: "4px 10px",
                background: g.color,
                color: "#fff",
                border: "none",
                borderRadius: 6,
                fontSize: 12,
                fontWeight: 700,
                cursor: "pointer",
              }}
            >
              + 팀 추가
            </button>
          </div>
          {(form[g.key] || []).map((t, idx) => (
            <div
              key={idx}
              style={{
                background: C.soft,
                padding: 8,
                borderRadius: 8,
                marginBottom: 6,
                display: "flex",
                gap: 6,
                alignItems: "center",
              }}
            >
              <input
                value={t.code}
                onChange={(e) => updateTeam(g.key, idx, "code", e.target.value)}
                placeholder="코드"
                style={{
                  width: 50,
                  padding: 6,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  fontSize: 13,
                  fontFamily: "monospace",
                  textAlign: "center",
                }}
              />
              <input
                value={t.emoji}
                onChange={(e) => updateTeam(g.key, idx, "emoji", e.target.value)}
                placeholder="이모지"
                style={{
                  width: 40,
                  padding: 6,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  fontSize: 18,
                  textAlign: "center",
                }}
              />
              <input
                value={t.name}
                onChange={(e) => updateTeam(g.key, idx, "name", e.target.value)}
                placeholder="팀명"
                style={{
                  flex: 1,
                  minWidth: 0,
                  padding: 6,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  fontSize: 15,
                }}
              />
              <input
                type="color"
                value={t.color}
                onChange={(e) => updateTeam(g.key, idx, "color", e.target.value)}
                style={{
                  width: 32,
                  height: 32,
                  padding: 0,
                  border: `1px solid ${C.border}`,
                  borderRadius: 6,
                  cursor: "pointer",
                }}
              />
              <ListItemControls
                idx={idx}
                total={form[g.key].length}
                onUp={() => moveTeam(g.key, idx, -1)}
                onDown={() => moveTeam(g.key, idx, 1)}
                onDelete={() => removeTeam(g.key, idx)}
              />
            </div>
          ))}
        </div>
      ))}
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

    if (open) setForm(JSON.parse(JSON.stringify(matches)));

      await FB.saveDoc("matches", form);
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const updateMatch = (field, idx, key, value) => {
    setForm((f) => {
      const next = { ...f };
      next[field] = [...(next[field] || [])];
      next[field][idx] = { ...next[field][idx], [key]: value };
      return next;
    });
  };

  const addMatch = (field) => {
    setForm((f) => {
      const next = { ...f };
      const arr = next[field] || [];
      const newMatch =
        field === "field1"
          ? { no: arr.length + 1, t1: "11:00~11:10", t2: "11:15~11:25", a: "A1", b: "A2" }
          : { no: arr.length + 1, kind: "U13", t1: "11:00~11:10", t2: "11:15~11:25", a: "C1", b: "C2" };
      next[field] = [...arr, newMatch];
      return next;
    });
  };

  const addRest = () => {
    setForm((f) => {
      const next = { ...f };
      next.field2 = [
        ...(next.field2 || []),
        { no: "*", kind: "REST", t1: "13:05~13:30", title: "경기 휴식시간" },
      ];
      return next;
    });
  };

  const removeMatch = (field, idx) => {
    if (!confirm("이 경기를 삭제하시겠어요?")) return;
    setForm((f) => ({
      ...f,
      [field]: f[field].filter((_, i) => i !== idx),
    }));
  };

  const moveMatch = (field, idx, dir) => {
    setForm((f) => {
      const arr = [...f[field]];
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= arr.length) return f;
      [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
      return { ...f, [field]: arr };
    });
  };

  const currentMatches = form[tab] || [];

  return (
    <Modal open={open} onClose={onClose} title="⚽ 대진표 편집" width={500}>
      <div
        style={{
          display: "flex",
          background: C.soft,
          padding: 4,
          borderRadius: 8,
          marginBottom: 12,
        }}
      >
        <button
          onClick={() => setTab("field1")}
          style={{
            flex: 1,
            padding: "8px 6px",
            background: tab === "field1" ? C.primary : "transparent",
            color: tab === "field1" ? "#fff" : C.sub,
            border: "none",
            borderRadius: 6,
            cursor: "pointer",
            fontSize: 15,
            fontWeight: 700,
          }}
        >
          제1구장 (U-11)
        </button>
        <button
          onClick={() => setTab("field2")}
          style={{
            flex: 1,
            padding: "8px 6px",

// ----- 3) 찬양 곡 편집 (개별 곡 추가/수정) -----
function HymnEditModal({ open, onClose, hymn, section, hymns }) {
  const isAdd = !!section;
  const targetSection = isAdd ? section : hymn?._section;
  const [form, setForm] = useState({
    id: "",
    title: "",
    source: "",
    storageKey: "",
    lyrics: "",
  });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (hymn && !isAdd) {
      setForm({
        id: hymn.id || "",
        title: hymn.title || "",
        source: hymn.source || "",
        storageKey: hymn.storageKey || "",
        lyrics: hymn.lyrics || "",
      });
    } else if (isAdd) {
      const list = hymns[section] || [];
      const nextNum = list.length + 1;
      setForm({
        id: `${section}_${nextNum}`,
        title: "",
        source: "",
        storageKey: `hymns/${section}_${nextNum}.mp3`,
        lyrics: "",
      });
    }
  }, [hymn, section, isAdd, hymns, open]);

  const save = async () => {
    if (!form.title.trim()) {
      alert("곡 제목을 입력해주세요");
      return;
    }
    setSaving(true);
    try {
      const next = { ...hymns };
      const arr = [...(next[targetSection] || [])];
      if (isAdd) {
        arr.push(form);
      } else {
        arr[hymn._index] = form;
      }
      next[targetSection] = arr;
      await FB.saveDoc("hymns", next);
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const remove = async () => {
    if (!confirm("이 곡을 삭제하시겠어요?\n(Storage의 MP3 파일은 별도로 삭제하지 않습니다)")) return;
    setSaving(true);
    try {
      const next = { ...hymns };
      next[targetSection] = (next[targetSection] || []).filter((_, i) => i !== hymn._index);
      await FB.saveDoc("hymns", next);
      onClose();
    } catch (e) {
      alert("삭제 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const upd = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  return (
    <Modal
      open={open}
      onClose={onClose}
      title={isAdd ? "🎵 새 곡 추가" : "🎵 곡 편집"}
      width={460}
    >
      <Field label="곡 ID (영문, 변경 비추천)">
        <Input value={form.id} onChange={(v) => upd("id", v)} placeholder="opening_1" />
      </Field>
      <Field label="곡 제목">
        <Input value={form.title} onChange={(v) => upd("title", v)} placeholder="가자 때가 됐다" />
      </Field>
      <Field label="출처">
        <Input value={form.source} onChange={(v) => upd("source", v)} placeholder="조슈아 정 1집" />
      </Field>
      <Field label="MP3 경로 (Storage)">
        <Input
          value={form.storageKey}
          onChange={(v) => upd("storageKey", v)}
          placeholder="hymns/opening_1.mp3"
        />
      </Field>
      <Field label="가사">
        <Textarea
          value={form.lyrics}
          onChange={(v) => upd("lyrics", v)}
          placeholder="가사를 입력하세요"
          rows={12}
        />
      </Field>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        {!isAdd && (
          <Btn onClick={remove} variant="danger" disabled={saving}>
            🗑 삭제
          </Btn>
        )}
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

// ----- 4) 조건기도 편집 -----
function PrayersEditModal({ open, onClose, prayers }) {
  const [form, setForm] = useState({ header: "", items: [] });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (open) setForm({
      header: prayers.header || "",
      items: [...(prayers.items || [])],
    });
  }, [prayers, open]);

  const save = async () => {
    setSaving(true);
    try {
      await FB.saveDoc("prayers", form);
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const updateItem = (idx, value) => {
    setForm((f) => {
      const items = [...f.items];
      items[idx] = value;
      return { ...f, items };
    });
  };
  const addItem = () => setForm((f) => ({ ...f, items: [...f.items, ""] }));
  const removeItem = (idx) => {
    if (!confirm("이 기도문을 삭제하시겠어요?")) return;
    setForm((f) => ({ ...f, items: f.items.filter((_, i) => i !== idx) }));
  };
  const moveItem = (idx, dir) => {
    setForm((f) => {
      const items = [...f.items];
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= items.length) return f;
      [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
      return { ...f, items };
    });
  };

  return (
    <Modal open={open} onClose={onClose} title="✨ 조건기도 편집" width={460}>
      <Field label="상단 문구">
        <Textarea value={form.header} onChange={(v) => setForm((f) => ({ ...f, header: v }))} rows={2} />
      </Field>
      <Field label="기도문 목록">
        {form.items.map((it, idx) => (
          <div
            key={idx}
            style={{
              background: C.soft,
              padding: 8,
              borderRadius: 8,
              marginBottom: 6,
              display: "flex",
              gap: 6,
              alignItems: "flex-start",
            }}
          >
            <div
              style={{
                minWidth: 24,
                height: 24,
                borderRadius: "50%",
                background: "#d97706",
                color: "#fff",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 12,
                fontWeight: 800,
                marginTop: 4,
              }}
            >
              {idx + 1}
            </div>
            <textarea
              value={it}
              onChange={(e) => updateItem(idx, e.target.value)}
              rows={2}
              style={{
                flex: 1,
                padding: 6,
                border: `1px solid ${C.border}`,
                borderRadius: 6,
                fontSize: 15,
                fontFamily: "inherit",
                resize: "vertical",
              }}
            />
            <ListItemControls
              idx={idx}
              total={form.items.length}
              onUp={() => moveItem(idx, -1)}
              onDown={() => moveItem(idx, 1)}
              onDelete={() => removeItem(idx)}
            />
          </div>
        ))}
        <button
          onClick={addItem}
          style={{
            width: "100%",
            padding: 8,
            background: "#fff",
            border: `1px dashed ${C.primary}`,
            borderRadius: 6,
            color: C.primary,
            fontSize: 13,
            fontWeight: 700,
            cursor: "pointer",
            marginTop: 4,
          }}
        >
          + 기도문 추가
        </button>
      </Field>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

              }}
            />
          </div>
          <input
            value={it.desc}
            onChange={(e) => {
              const next = [...list];
              next[idx] = { ...next[idx], desc: e.target.value };
              setList(next);
            }}
            placeholder="설명"
            style={{
              width: "100%",
              padding: 6,
              border: `1px solid ${C.border}`,
              borderRadius: 6,
              fontSize: 13,
            }}
          />
        </div>
      ))}
      <button
        onClick={() => setList([...list, { icon: "✨", title: "새 이벤트", desc: "설명" }])}
        style={{
          width: "100%",
          padding: 8,
          background: "#fff",
          border: `1px dashed ${C.primary}`,
          borderRadius: 6,
          color: C.primary,
          fontSize: 13,
          fontWeight: 700,
          cursor: "pointer",
          marginTop: 4,
        }}
      >
        + 이벤트 추가
      </button>
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

// ----- 8) 시상 편집 -----
function PrizesEditModal({ open, onClose, items }) {
  const [list, setList] = useState([]);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (open) setList(items.map((i) => ({ ...i })));
  }, [items, open]);

  const save = async () => {
    setSaving(true);
    try {
      await FB.saveDoc("prizes", { items: list });
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} title="🏆 시상 편집" width={420}>
      {list.map((it, idx) => (
        <div
          key={idx}
          style={{
            background: C.soft,
            padding: 8,
            borderRadius: 8,
            marginBottom: 6,
            display: "flex",
            gap: 6,
            alignItems: "center",
          }}
        >
          <input
            value={it.icon}
            onChange={(e) => {
              const next = [...list];
              next[idx] = { ...next[idx], icon: e.target.value };
              setList(next);
            }}
            style={{
              width: 50,
              padding: 6,
              border: `1px solid ${C.border}`,
              borderRadius: 6,
              fontSize: 22,
              textAlign: "center",
            }}
          />
          <input
            value={it.rank}
            onChange={(e) => {
              const next = [...list];
              next[idx] = { ...next[idx], rank: e.target.value };
              setList(next);
            }}
            placeholder="등수"
            style={{
              flex: 1,
              padding: 6,
              border: `1px solid ${C.border}`,
              borderRadius: 6,
              fontSize: 15,
              fontWeight: 700,
            }}
          />
          <input
            type="color"
            value={it.color}
            onChange={(e) => {
              const next = [...list];
              next[idx] = { ...next[idx], color: e.target.value };
              setList(next);
            }}
            style={{
              width: 32,
              height: 32,
              padding: 0,
              border: `1px solid ${C.border}`,
              borderRadius: 6,
              cursor: "pointer",
            }}
          />
          <ListItemControls
            idx={idx}
            total={list.length}
            onUp={() => {
              const next = [...list];
              if (idx === 0) return;
              [next[idx - 1], next[idx]] = [next[idx], next[idx - 1]];
              setList(next);
            }}
            onDown={() => {
              const next = [...list];
              if (idx === next.length - 1) return;
              [next[idx], next[idx + 1]] = [next[idx + 1], next[idx]];
              setList(next);
            }}
            onDelete={() => {
              if (!confirm("이 시상을 삭제하시겠어요?")) return;
              setList(list.filter((_, i) => i !== idx));
            }}
          />
        </div>
      ))}
      <button
        onClick={() => setList([...list, { icon: "🏅", rank: "특별상", color: "#3498db" }])}
        style={{
          width: "100%",
          padding: 8,
          background: "#fff",
          border: `1px dashed ${C.primary}`,
          borderRadius: 6,
          color: C.primary,
          fontSize: 13,
          fontWeight: 700,
          cursor: "pointer",
          marginTop: 4,
        }}
      >
        + 시상 추가
      </button>
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}

// ----- 9) 중요 안내 편집 -----
function ImportantNotesEditModal({ open, onClose, notes }) {
  const [form, setForm] = useState({ highlight: "", items: [] });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (open) setForm({
      highlight: notes.highlight || "",
      items: [...(notes.items || [])],
    });
  }, [notes, open]);

  const save = async () => {
    setSaving(true);
    try {
      await FB.saveDoc("importantNotes", form);
      onClose();
    } catch (e) {
      alert("저장 실패: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} title="📢 중요 안내 편집" width={440}>
      <Field label="강조 박스 (빨간색 안내)">
        <Textarea
          value={form.highlight}
          onChange={(v) => setForm((f) => ({ ...f, highlight: v }))}
          rows={3}
          placeholder="가장 중요한 안내사항"
        />
      </Field>
      <Field label="일반 안내 목록">
        {form.items.map((it, idx) => (
          <div
            key={idx}
            style={{
              background: C.soft,
              padding: 8,
              borderRadius: 8,
              marginBottom: 6,
              display: "flex",
              gap: 6,
              alignItems: "center",
            }}
          >
            <input
              value={it}
              onChange={(e) => {
                const items = [...form.items];
                items[idx] = e.target.value;
                setForm((f) => ({ ...f, items }));
              }}
              style={{
                flex: 1,
                padding: 6,
                border: `1px solid ${C.border}`,
                borderRadius: 6,
                fontSize: 15,
              }}
            />
            <ListItemControls
              idx={idx}
              total={form.items.length}
              onUp={() => {
                const items = [...form.items];
                if (idx === 0) return;
                [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]];
                setForm((f) => ({ ...f, items }));
              }}
              onDown={() => {
                const items = [...form.items];
                if (idx === items.length - 1) return;
                [items[idx], items[idx + 1]] = [items[idx + 1], items[idx]];
                setForm((f) => ({ ...f, items }));
              }}
              onDelete={() => {
                if (!confirm("이 항목을 삭제하시겠어요?")) return;
                setForm((f) => ({ ...f, items: f.items.filter((_, i) => i !== idx) }));
              }}
            />
          </div>
        ))}
        <button
          onClick={() => setForm((f) => ({ ...f, items: [...f.items, "📌 새 안내"] }))}
          style={{
            width: "100%",
            padding: 8,
            background: "#fff",
            border: `1px dashed ${C.primary}`,
            borderRadius: 6,
            color: C.primary,
            fontSize: 13,
            fontWeight: 700,
            cursor: "pointer",
            marginTop: 4,
          }}
        >
          + 안내 추가
        </button>
      </Field>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <Btn onClick={onClose} variant="ghost" style={{ flex: 1 }}>
          취소
        </Btn>
        <Btn onClick={save} disabled={saving} style={{ flex: 2 }}>
          {saving ? "저장 중..." : "💾 저장"}
        </Btn>
      </div>
    </Modal>
  );
}
